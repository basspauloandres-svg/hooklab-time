<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HookLab TIME v1.8</title><style>html,body{margin:0;height:100%;background:#f2f2f0}iframe{display:block;border:0;width:100%;height:100vh}</style></head><body><iframe id="app" src="app-v1.7.html?v=1801" allow="autoplay"></iframe><script>
const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=w.document;d.title='HookLab TIME v1.8';const h=d.querySelector('h1');if(h)h.textContent='HookLab TIME Mobile — Beat This! v1.8';const p=d.querySelector('.card .muted');if(p)p.textContent='Tactus-only validation. El acento métrico audible queda suspendido. Tras una readquisición por fallback, el reloj T puede sostenerse por continuidad mientras haya audio activo y se corrige cuando reaparece evidencia.';
const oldPT=w.predictiveTrack,oldSummary=w.summary,oldDl=w.dl;
w.predictiveTrack=function(strong,onsets,states,dur){let r=oldPT(strong,onsets,states,dur);if(!r.track.length)return r;let by=new Map();for(const x of r.track){if(!by.has(x.run))by.set(x.run,[]);by.get(x.run).push(x)}let maxRun=Math.max(...by.keys()),xs=by.get(maxRun)||[];let fallback=xs.some(x=>x.source==='audio_onset');if(fallback&&xs.length>=4){let ints=[];for(let i=1;i<xs.length;i++){let q=xs[i].t-xs[i-1].t;if(q>=.22&&q<=1.6)ints.push(q)}let period=w.median(ints);if(period){let last=xs[xs.length-1].t,miss=0;while(last+period<dur){let pred=last+period,st=w.stateAt(pred,states);if(st==='NO_PULSE')break;let tol=Math.min(.18,Math.max(.08,period*.25)),best=null;for(const e of onsets){if(e.t<pred-tol)continue;if(e.t>pred+tol)break;if(!best||Math.abs(e.t-pred)<Math.abs(best.t-pred))best=e}if(best){let err=best.t-pred;last=pred+.18*err;period=Math.max(.22,Math.min(1.6,period+.04*err));r.track.push({t:last,run:maxRun,observed:true,source:'audio_onset_sustain'});miss=0}else{last=pred;r.track.push({t:last,run:maxRun,observed:false,source:'fallback_clock_sustain'});miss++}if(miss>=20&&st==='FREE_TIME')break}}r.track.sort((a,b)=>a.t-b.t)}return r};
// Disable metric accent generation during tactus validation.
w.meter=function(tactus,states){return{segments:[],accents:[]}};
w.summary=function(obj){let x=oldSummary(obj);x.schema='HookLab-Mobile-BeatThis-v1.8';x.engine='Beat This + authority-gated fallback + sustained provisional T clock; metric accents abstained';x.metric_accent_count=0;x.metric_segments=[];x.notes=[...(x.notes||[]),'tactus_only_validation','metric_accent_abstention','sustained_fallback_clock','fallback_T_continuity'];return x};
w.dl=function(obj,s){let x={...obj};x.schema='HookLab-Mobile-BeatThis-v1.8';x.engine='Beat This + authority-gated fallback + sustained provisional T clock; metric accents abstained';x.metric_accent_count=0;x.metric_segments=[];x.metric_accents_s=[];x.notes=[...(x.notes||[]),'tactus_only_validation','metric_accent_abstention','sustained_fallback_clock','fallback_T_continuity'];return oldDl(x,s)};
});</script></body></html>

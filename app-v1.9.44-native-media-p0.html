<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.44 Native Media P0</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input,audio{font-size:16px}button{padding:12px 16px;border:0;border-radius:10px;background:#222;color:#fff;margin:4px}.secondary{background:#e7e7e4;color:#222}.muted{font-size:13px;color:#666}audio{width:100%;margin-top:10px}</style></head><body><main><div class="card"><h1 style="font-size:22px;margin:0 0 6px">HookLab TIME v1.9.44 — Native Media P0</h1><p class="muted">Microtest sin Web Audio. Ruta 1: WAV PCM generado → &lt;audio&gt; nativo → salida del navegador. Ruta 2: archivo musical seleccionado → &lt;audio&gt; nativo → salida del navegador.</p><button id="tone">1. Reproducir tono nativo 440 Hz</button><p id="toneStatus" class="muted">tono no probado</p><audio id="tonePlayer" controls></audio></div><div class="card"><input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg"><button id="playFile" disabled>2. Reproducir archivo nativo</button><p id="fileStatus" class="muted">esperando archivo</p><audio id="filePlayer" controls preload="metadata"></audio></div><div class="card"><button id="export" class="secondary">Exportar diagnóstico</button></div></main><script>
const $=x=>document.getElementById(x);let records=[],fileUrl=null,toneUrl=null;
function rec(kind,extra={}){records.push({kind,t_perf_ms:performance.now(),...extra})}
function wavTone(freq=440,duration=1,sr=48000,amp=.25){const n=Math.floor(duration*sr),bytes=44+n*2,b=new ArrayBuffer(bytes),v=new DataView(b);function s(o,x){for(let i=0;i<x.length;i++)v.setUint8(o+i,x.charCodeAt(i))}s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++){let env=Math.min(1,i/(sr*.01),(n-i)/(sr*.03));let x=Math.sin(2*Math.PI*freq*i/sr)*amp*env;v.setInt16(44+i*2,Math.max(-1,Math.min(1,x))*32767,true)}return new Blob([b],{type:'audio/wav'})}
$('tone').onclick=async()=>{try{if(toneUrl)URL.revokeObjectURL(toneUrl);toneUrl=URL.createObjectURL(wavTone());const p=$('tonePlayer');p.src=toneUrl;p.volume=1;p.muted=false;await p.play();$('toneStatus').textContent='play() aceptado · WAV PCM nativo en reproducción';rec('native_tone_play',{paused:p.paused,volume:p.volume,muted:p.muted,currentTime:p.currentTime});}catch(e){$('toneStatus').textContent='ERROR: '+e.message;rec('native_tone_error',{error:e.message})}};
$('audioFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(fileUrl)URL.revokeObjectURL(fileUrl);fileUrl=URL.createObjectURL(f);const p=$('filePlayer');p.src=fileUrl;p.load();$('playFile').disabled=false;$('fileStatus').textContent=f.name+' · listo';rec('file_selected',{name:f.name,type:f.type,size:f.size})};
$('playFile').onclick=async()=>{const p=$('filePlayer');try{p.volume=1;p.muted=false;await p.play();$('fileStatus').textContent='play() aceptado · archivo nativo en reproducción';rec('native_file_play',{paused:p.paused,volume:p.volume,muted:p.muted,currentTime:p.currentTime,duration:p.duration})}catch(e){$('fileStatus').textContent='ERROR: '+e.message;rec('native_file_error',{error:e.message})}};
$('tonePlayer').addEventListener('playing',()=>rec('tone_playing_event'));$('tonePlayer').addEventListener('ended',()=>rec('tone_ended_event'));$('filePlayer').addEventListener('playing',()=>rec('file_playing_event'));$('filePlayer').addEventListener('ended',()=>rec('file_ended_event'));
$('export').onclick=()=>{let payload={schema:'HookLab-TIME-v1.9.44-native-media-p0',build_id:'v1.9.44-native-media-p0',architecture:{webaudio:false,audio_context_count:0,iframe_count:0,native_media_element:true,routes:['generated WAV PCM > HTMLAudioElement > browser output','selected file > HTMLAudioElement > browser output']},userAgent:navigator.userAgent,records};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HookLab_native_media_P0_v1_9_44.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>

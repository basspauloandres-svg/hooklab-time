<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>HookLab TIME v1.9.3 PRETEST</title><style>html,body{margin:0;height:100%;background:#f2f2f0;font-family:-apple-system,BlinkMacSystemFont,system-ui}.mix{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #ddd;padding:10px 12px;box-shadow:0 2px 10px #0001}.mix b{display:block;margin-bottom:6px}.row{display:grid;grid-template-columns:72px 1fr 46px;gap:8px;align-items:center;margin:7px 0}.row input{width:100%}.v{font-variant-numeric:tabular-nums;text-align:right;color:#555}iframe{display:block;border:0;width:100%;height:calc(100vh - 142px)}</style></head><body><div class="mix"><b>v1.9.3 PRETEST · Mezclador corregido</b><div class="row"><label>Pista</label><input id="track" type="range" min="0" max="100" value="30"><span id="trackV" class="v">30%</span></div><div class="row"><label>Beat</label><input id="beat" type="range" min="0" max="100" value="90"><span id="beatV" class="v">90%</span></div><div class="row"><label>Acento</label><input id="accent" type="range" min="0" max="100" value="70"><span id="accentV" class="v">70%</span></div></div><iframe id="app" src="app-v1.6.html?build=20260820-1933" allow="autoplay"></iframe><script>
const f=document.getElementById('app'),$=id=>document.getElementById(id);let ready=false;
const med=a=>{if(!a||!a.length)return null;let z=[...a].sort((x,y)=>x-y),m=z.length>>1;return z.length%2?z[m]:(z[m-1]+z[m])/2};
const mad=a=>{let m=med(a);return m==null?null:med(a.map(x=>Math.abs(x-m)))};
function regimeChanges(times){let ev=(times||[]).filter(Number.isFinite).sort((a,b)=>a-b);if(ev.length<12)return[];let ibis=[];for(let i=1;i<ev.length;i++)ibis.push(ev[i]-ev[i-1]);let out=[],pending=[],seg=0;for(let i=7;i<ibis.length;i++){let hist=ibis.slice(Math.max(seg,i-7),i).filter(x=>x>.18&&x<1.8);if(hist.length<4)continue;let c=med(hist),sp=Math.max(mad(hist)||0,.004),x=ibis[i];if(x>2.5*c){pending=[];continue}let rel=Math.abs(x-c)/Math.max(c,1e-9),z=Math.abs(x-c)/sp,ratio=Math.max(x,c)/Math.max(1e-9,Math.min(x,c));if(ratio>=1.82&&ratio<=2.18){pending=[];continue}if(rel>=.12&&z>=5)pending.push([i,x,c]);else pending=[];if(pending.length>=3){let q=pending.slice(-3),rc=med(q.map(v=>v[1]));let coherent=Math.max(...q.map(v=>Math.abs(v[1]-rc)))<=Math.max(.035*rc,.012);if(coherent){let fi=q[0][0],oldB=60/c,newB=60/rc;if(oldB>=45&&oldB<=220&&newB>=45&&newB<=220){out.push({localized_t:ev[fi],confirmed_t:ev[i+1],old_ibi:c,new_ibi:rc,old_bpm:oldB,new_bpm:newB});seg=i+1}pending=[]}}}return out}
function install(){if(ready)return;const w=f.contentWindow,d=w.document;const h=d.querySelector('h1');if(h)h.textContent='HookLab TIME Mobile — Beat This! v1.9.3 PRETEST';const p=d.querySelector('.card .muted');if(p)p.textContent='Pretest corregido: un solo reloj por instante, CTL conservador, mezclador funcional y acento métrico suspendido.';
const oldPT=w.predictiveTrack,oldSummary=w.summary,oldDl=w.dl;
w.predictiveTrack=function(strong,onsets,states,dur){let r=oldPT(strong,onsets,states,dur);w.__hlStates=states||[];if(!r||!r.track)return r;let cps=regimeChanges((strong||[]).map(x=>x.t));let cuts=cps.map(x=>x.localized_t).sort((a,b)=>a-b),run=1;for(const x of r.track){while(cuts.length&&x.t>=cuts[0]){run++;cuts.shift()}x.run=run}r.runs=run;r.transitions=cps.map((x,i)=>({at_s:+x.localized_t.toFixed(3),confirmed_s:+x.confirmed_t.toFixed(3),from_bpm:+x.old_bpm.toFixed(3),candidate_bpm:+x.new_bpm.toFixed(3),source:'event_regime_v0.7_conservative',run:i+2}));return r};
const oldRT=w.resolveTactus;w.resolveTactus=function(track,evidence){let r=oldRT(track,evidence);if(!r||!r.tactus)return r;let clean=[],last=-1e9;for(const x of r.tactus.sort((a,b)=>a.t-b.t)){if(x.t-last>=.12){clean.push(x);last=x.t}}r.tactus=clean;let ii=[];for(let i=1;i<clean.length;i++)if(clean[i].run===clean[i-1].run){let q=clean[i].t-clean[i-1].t;if(q>.22&&q<1.6)ii.push(q)}let m=med(ii);r.estimated_bpm=m?+(60/m).toFixed(3):null;return r};
w.meter=function(){return{segments:[],accents:[]}};
w.__hlBeat=.90;w.__hlAccent=.70;
try{w.eval("tone=function(at,f,v,d){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;let level=f>=1800?(0.24*window.__hlAccent):(0.30*window.__hlBeat);level=Math.max(.0001,level);g.gain.setValueAtTime(level,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+d+.01)}")}catch(e){console.warn('tone override failed',e)}
w.summary=function(obj){let x=oldSummary(obj);x.schema='HookLab-Mobile-BeatThis-v1.9.3-pretest';x.engine='Beat This + single-clock CTL conservative + deduplicated tactus; metric accent abstained';x.metric_accent_count=0;x.metric_segments=[];x.notes=[...(x.notes||[]),'single_clock_no_overlap','ctl_conservative_persistence3','octave_flip_not_tempo_transition','tactus_dedup_120ms','working_three_channel_mixer','metric_accent_abstention'];return x};
w.dl=function(obj,s){let x={...obj};x.schema='HookLab-Mobile-BeatThis-v1.9.3-pretest';x.engine='Beat This + single-clock CTL conservative + deduplicated tactus; metric accent abstained';x.metric_accent_count=0;x.metric_segments=[];x.metric_accents_s=[];x.notes=[...(x.notes||[]),'single_clock_no_overlap','ctl_conservative_persistence3','octave_flip_not_tempo_transition','tactus_dedup_120ms','working_three_channel_mixer','metric_accent_abstention'];return oldDl(x,s)};
let player=d.getElementById('player');if(player)player.volume=.30;ready=true}
f.addEventListener('load',()=>setTimeout(install,50));
function bind(id,fn){$(id).addEventListener('input',e=>{let v=+e.target.value/100;$(id+'V').textContent=e.target.value+'%';fn(v)})}
bind('track',v=>{try{let p=f.contentWindow.document.getElementById('player');if(p)p.volume=v}catch(_){}});bind('beat',v=>{try{f.contentWindow.__hlBeat=v}catch(_){}});bind('accent',v=>{try{f.contentWindow.__hlAccent=v}catch(_){}});

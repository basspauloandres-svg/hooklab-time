<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>MIE Decoder + Beat This + Melody v0.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:780px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input,audio,progress{font-size:16px;width:100%;box-sizing:border-box}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin-top:8px}button:disabled{opacity:.4}.muted{color:#666;font-size:14px}</style></head><body><main><div class="card"><h1>MIE Decoder + Beat This + Melody v0.1</h1><p class="muted">Una sola variable nueva respecto del baseline validado: motor melódico. Decoder y Beat This permanecen sin cambios.</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><button id="decode">1. Decodificar</button><p id="ds" class="muted">Sin decodificar.</p><button id="run" disabled>2. Detectar beat + melodía</button><progress id="pr" max="100" value="0"></progress><p id="st" class="muted">Esperando audio.</p></div><div class="card"><b>Audio + Beat This + melodía resintetizada</b><audio id="out" controls></audio><p id="meta" class="muted">Sin salida.</p></div></main><script>var input=document.getElementById('f'),buf=null,out=document.getElementById('out'),ortLoaded=false,melS=null,beatS=null;function getFile(){var fs=input.files;if(!fs||fs.length<1)throw new Error('Sin archivo');return fs[0]}document.getElementById('decode').onclick=async function(){try{var f=getFile(),AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),ab=await f.arrayBuffer(),t=performance.now();buf=await ac.decodeAudioData(ab.slice(0));document.getElementById('ds').textContent='DECODE OK · '+buf.duration.toFixed(6)+' s · '+buf.sampleRate+' Hz · '+(performance.now()-t).toFixed(1)+' ms';document.getElementById('run').disabled=false;try{await ac.close()}catch(_){}}catch(e){document.getElementById('ds').textContent='ERROR DECODE · '+e.name+' · '+e.message}};function mono(b){let y=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){let x=b.getChannelData(c);for(let i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function rs(x,sr,to=22050){if(sr===to)return x;let n=Math.floor(x.length*to/sr),y=new Float32Array(n),r=sr/to;for(let i=0;i<n;i++){let p=i*r,a=Math.floor(p),f=p-a;y[i]=x[a]*(1-f)+x[Math.min(x.length-1,a+1)]*f}return y}function hz(m){return 440*Math.pow(2,(m-69)/12)}function goertzel(x,a,N,m,sr){let f=hz(m),re=0,im=0,ws=0;for(let n=0;n<N;n+=2){let j=a+n;if(j>=x.length)break,w=.5-.5*Math.cos(2*Math.PI*n/(N-1)),v=x[j]*w,p=2*Math.PI*f*n/sr;re+=v*Math.cos(p);im-=v*Math.sin(p);ws+=w}return Math.hypot(re,im)/Math.max(1,ws)}function melody(x,sr){let N=2048,hop=1024,fr=[];for(let a=0;a+N<x.length;a+=hop){let best={m:48,e:0},second=0;for(let m=45;m<=79;m++){let e=goertzel(x,a,N,m,sr);if(e>best.e){second=best.e;best={m,e}}else if(e>second)second=e}fr.push({t:a/sr,m:best.m,e:best.e,ratio:best.e/(second+1e-9)})}let es=fr.map(q=>q.e).sort((a,b)=>a-b),thr=(es[Math.floor(es.length*.45)]||0)*.75,ev=[],cur=null;for(let q of fr){if(q.e<thr||q.ratio<1.03){if(cur){ev.push(cur);cur=null}continue}if(!cur||q.m!==cur.m){if(cur)ev.push(cur);cur={on:q.t,off:q.t+hop/sr,m:q.m}}else cur.off=q.t+hop/sr}if(cur)ev.push(cur);return ev.filter(e=>e.off-e.on>=.07)}async function loadORT(){if(ortLoaded)return;await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.min.js';s.onload=()=>{ortLoaded=true;ok()};s.onerror=()=>no(new Error('No cargó ONNX Runtime'));document.head.appendChild(s)})}async function beatthis(x){await loadORT();ort.env.wasm.numThreads=1;const MEL_URL='https://raw.githubusercontent.com/danigb/beat-this-rs/main/models/mel_spectrogram.onnx',BEAT_URL='https://raw.githubusercontent.com/danigb/beat-this-rs/main/models/beat_this_small.onnx';if(!melS)melS=await ort.InferenceSession.create(MEL_URL,{executionProviders:['wasm']});if(!beatS)beatS=await ort.InferenceSession.create(BEAT_URL,{executionProviders:['wasm']});let mo=await melS.run({[melS.inputNames[0]]:new ort.Tensor('float32',x,[1,x.length])}),sp=mo[melS.outputNames[0]],dims=sp.dims,frames=dims.length===3?dims[1]:dims[0],bands=dims.length===3?dims[2]:dims[1],flat=sp.data,bp=[],chunk=1500,ov=12,step=chunk-2*ov;for(let st=0;st<frames;st+=step){let n=Math.min(chunk,frames-st),ar=new Float32Array(n*bands);ar.set(flat.subarray(st*bands,(st+n)*bands));let o=await beatS.run({[beatS.inputNames[0]]:new ort.Tensor('float32',ar,[1,n,bands])}),z=o[beatS.outputNames[0]].data,L=st?ov:0,R=st+n<frames?ov:0;for(let j=L;j<n-R;j++)bp.push({frame:st+j,v:1/(1+Math.exp(-z[j]))})}let q=[];for(let i=1;i<bp.length-1;i++)if(bp[i].v>=.5&&bp[i].v>=bp[i-1].v&&bp[i].v>bp[i+1].v)q.push({t:bp[i].frame*.02,s:bp[i].v});let keep=[];for(let z of q.sort((a,b)=>b.s-a.s))if(!keep.some(y=>Math.abs(y.t-z.t)<.16))keep.push(z);return keep.sort((a,b)=>a.t-b.t).map(z=>z.t)}function wav(M,T,dur){let SR=44100,N=Math.ceil(dur*SR),y=new Float32Array(N);function add(a,b,m,A){let i=Math.max(0,Math.floor(a*SR)),j=Math.min(N,Math.floor(b*SR)),f=hz(m);for(let k=i;k<j;k++){let t=(k-i)/SR,en=(1-Math.exp(-t/.006))*Math.exp(-t/1.8);y[k]+=A*en*Math.sin(2*Math.PI*f*t)}}for(let q of M)add(q.on,q.off,q.m,.12);for(let b of T){let i=Math.floor(b*SR),j=Math.min(N,i+Math.floor(.04*SR));for(let k=i;k<j;k++){let t=(k-i)/SR;y[k]+=.16*Math.exp(-70*t)*Math.sin(2*Math.PI*1000*t)}}let mx=0;for(let v of y)mx=Math.max(mx,Math.abs(v));let g=.9/Math.max(mx,1e-9),ab=new ArrayBuffer(44+N*2),v=new DataView(ab),p=0,S=s=>{for(let c of s)v.setUint8(p++,c.charCodeAt(0))},U=n=>{v.setUint32(p,n,true);p+=4},H=n=>{v.setUint16(p,n,true);p+=2};S('RIFF');U(36+N*2);S('WAVEfmt ');U(16);H(1);H(1);U(SR);U(SR*2);H(2);H(16);S('data');U(N*2);for(let z of y){z=Math.max(-1,Math.min(1,z*g));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}document.getElementById('run').onclick=async function(){try{if(!buf)throw new Error('Primero pulsa Decodificar');this.disabled=true;let dur=Math.min(buf.duration,60),x=rs(mono(buf),buf.sampleRate).subarray(0,Math.floor(dur*22050));document.getElementById('st').textContent='T · Beat This…';document.getElementById('pr').value=15;let T=await beatthis(x);document.getElementById('pr').value=55;document.getElementById('st').textContent='M · melodía…';let M=melody(x,22050);document.getElementById('pr').value=85;let blob=wav(M,T,dur);out.src=URL.createObjectURL(blob);out.load();document.getElementById('pr').value=100;document.getElementById('st').textContent='LISTO';document.getElementById('meta').textContent='Beat: '+T.length+' eventos · Melodía: '+M.length+' eventos · '+dur.toFixed(2)+' s'}catch(e){document.getElementById('st').textContent='ERROR · '+e.name+' · '+e.message;console.error(e)}finally{this.disabled=false}};</script></body></html>

const frame=document.getElementById('core'),OFFSET_S=-0.1152;let monitor=[];
function dl(obj,name){let b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function median(a){if(!a.length)return null;let z=[...a].sort((x,y)=>x-y),m=z.length>>1;return z.length%2?z[m]:(z[m-1]+z[m])/2}
function timing(t){if(!Array.isArray(t)||t.length<2)return null;let ints=[];for(let i=1;i<t.length;i++)ints.push((t[i]-t[i-1])*1000);let med=median(ints),dr=[];for(let i=0;i<t.length;i++)dr.push((t[i]-(t[0]+i*med/1000))*1000);return{median_interval_ms:med,median_bpm:60000/med,min_interval_ms:Math.min(...ints),max_interval_ms:Math.max(...ints),final_grid_drift_ms:dr[dr.length-1],grid_drift_range_ms:Math.max(...dr)-Math.min(...dr),local_intervals_ms:ints,grid_drift_ms:dr}}
function inject(){try{let w=frame.contentWindow,d=w.document;if(!d||!d.body)return setTimeout(inject,150);if(d.getElementById('hl1925panel'))return;let cards=d.querySelectorAll('.card');if(cards.length<2)return setTimeout(inject,150);
let panel=d.createElement('div');panel.className='card';panel.id='hl1925panel';panel.innerHTML=`<h2 style="font-size:18px;margin:0 0 10px">Monitoreo y datos P0</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label style="font-size:13px">Pista <b id="hlTrackVal">60%</b><input id="hlTrack" type="range" min="0" max="100" value="60" step="1"></label><label style="font-size:13px">Claqueta <b id="hlClickVal">90%</b><input id="hlClick" type="range" min="0" max="100" value="90" step="1"></label></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px"><div class="m">BPM tactus<b id="hlBpm">—</b></div><div class="m">Tactus<b id="hlTactus">—</b></div><div class="m">Runs<b id="hlRuns">—</b></div><div class="m">Transiciones<b id="hlTrans">—</b></div></div><p class="muted" id="hlState" style="margin:8px 0">Offset audible fijo: −115.2 ms. PlaybackRate 1.0.</p><button id="hlExport" class="secondary">Exportar diagnóstico P0</button>`;cards[1].after(panel);
let p=d.getElementById('player'),tr=d.getElementById('hlTrack'),cl=d.getElementById('hlClick'),tv=d.getElementById('hlTrackVal'),cv=d.getElementById('hlClickVal');let targetTrack=.60,targetClick=.90,lastLogged=null;
function getData(){try{return w.eval('data')}catch(_){return null}}
function enforceTrack(reason,forceLog=false){if(!p)return;p.volume=targetTrack;p.muted=targetTrack===0;p.playbackRate=1;p.defaultPlaybackRate=1;if('preservesPitch'in p)p.preservesPitch=true;tv.textContent=Math.round(targetTrack*100)+'%';let snap=[targetTrack,p.volume,p.muted,p.playbackRate].join('|');if(forceLog||snap!==lastLogged){monitor.push({t_perf_ms:performance.now(),type:'track_state',reason,requested_volume:targetTrack,actual_volume:p.volume,muted:p.muted,playbackRate:p.playbackRate});lastLogged=snap}}
tr.addEventListener('input',()=>{targetTrack=+tr.value/100;enforceTrack('slider',true)});p.addEventListener('volumechange',()=>{if(Math.abs(p.volume-targetTrack)>.001||p.muted!==(targetTrack===0))enforceTrack('volumechange_guard',true)});enforceTrack('install',true);
w.__hl1925ClickGain=targetClick;cl.addEventListener('input',()=>{targetClick=+cl.value/100;w.__hl1925ClickGain=targetClick;cv.textContent=Math.round(targetClick*100)+'%';monitor.push({t_perf_ms:performance.now(),type:'click_gain',value:targetClick})});
try{w.eval(`(function(){if(window.__hl1925Installed)return;window.__hl1925Installed=true;window.__hl1925OrigTone=tone;tone=function(at,f,v,d){let g=window.__hl1925ClickGain==null?.9:window.__hl1925ClickGain;let finalAt=Math.max(ctx.currentTime+.002,at+${OFFSET_S});return window.__hl1925OrigTone(finalAt,f,Math.max(0,Math.min(1,v*g)),d)};})();`)}catch(_){}
function refresh(){try{enforceTrack('poll');let x=getData();d.getElementById('hlBpm').textContent=x&&x.estimated_tactus_bpm!=null?Number(x.estimated_tactus_bpm).toFixed(3):'—';d.getElementById('hlTactus').textContent=x&&x.tactus_count!=null?x.tactus_count:'—';d.getElementById('hlRuns').textContent=x&&x.pulse_runs!=null?x.pulse_runs:'—';d.getElementById('hlTrans').textContent=x&&x.tempo_transition_count!=null?x.tempo_transition_count:'—';d.getElementById('hlState').textContent='Pista '+Math.round(targetTrack*100)+'% · Claqueta '+Math.round(targetClick*100)+'% · offset −115.2 ms · rate '+p.playbackRate.toFixed(6)}catch(_){}}
setInterval(refresh,500);
d.getElementById('hlExport').onclick=()=>{enforceTrack('export',true);let x=getData(),tt=x&&x.tactus_s?timing(x.tactus_s):null;dl({schema:'HookLab-TIME-v1.9.25-p0-diagnostic',audible_offset_ms:-115.2,monitor:{track_requested:targetTrack,track_actual:p?p.volume:null,track_muted:p?p.muted:null,click_gain:targetClick,playbackRate:p?p.playbackRate:null,defaultPlaybackRate:p?p.defaultPlaybackRate:null,preservesPitch:p&&'preservesPitch'in p?p.preservesPitch:null,currentTime_s:p?p.currentTime:null},analysis:x?{file:x.file,duration_s:x.duration_s,raw_beat_events:x.raw_beat_events,fallback_onset_events:x.fallback_onset_events,predictive_beat_count:x.predictive_beat_count,pulse_runs:x.pulse_runs,tempo_transition_count:x.tempo_transition_count,tactus_count:x.tactus_count,estimated_tactus_bpm:x.estimated_tactus_bpm,tactus_run_choices:x.tactus_run_choices,rhythmic_state_counts:x.rhythmic_state_counts,raw_beats_s:x.raw_beats_s,predictive_beats_s:x.predictive_beats_s,tactus_s:x.tactus_s,metric_accents_s:x.metric_accents_s,tactus_timing:tt}:null,monitor_records:monitor},'HookLab_P0_diagnostic_v1_9_25.json')};
let title=d.querySelector('h1');if(title)title.textContent='HookLab TIME v1.9.25 — P0 Data Fix';let desc=d.querySelector('h1 + .muted');if(desc)desc.textContent='Base única con volumen de pista verificable y captura directa de los datos analíticos completos del tactus.';
}catch(e){setTimeout(inject,200)}}
frame.addEventListener('load',()=>setTimeout(inject,300));setTimeout(inject,800);
</script></body></html>

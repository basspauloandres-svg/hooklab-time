<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.22 Unified Control Surface</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f2f2f0;color:#171717}#deck{position:sticky;top:0;z-index:999999;background:#fff;border-bottom:1px solid #ddd;padding:8px;display:grid;gap:7px}.row{display:grid;gap:6px;align-items:center}.r1{grid-template-columns:minmax(0,1fr) auto auto}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(6,1fr)}button,input{font:600 13px system-ui}button{padding:9px 8px;border:1px solid #aaa;border-radius:8px;background:#f7f7f7;color:#111}button.on{background:#111;color:#fff}input[type=file]{min-width:0;width:100%}.mix{display:grid;grid-template-columns:auto 1fr 42px;gap:5px;align-items:center;font-size:12px}.mix input{width:100%}.status{font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#host{border:0;width:100%;height:calc(100vh - 176px);display:block;background:#f2f2f0}@media(max-width:650px){.r1{grid-template-columns:1fr 1fr}.r1 input{grid-column:1/-1}.r3{grid-template-columns:repeat(3,1fr)}#host{height:calc(100vh - 232px)}}</style></head><body><div id="deck"><div class="row r1"><input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg"><button id="analyze">Analizar</button><button id="play">Play / Pausa</button></div><div class="row r2"><div class="mix"><span>Pista</span><input id="track" type="range" min="0" max="100" value="55"><span id="tv">55%</span></div><div class="mix"><span>Claqueta</span><input id="click" type="range" min="0" max="100" value="90"><span id="cv">90%</span></div></div><div class="row r3" id="bpms"></div><div class="status" id="status">Cargando núcleo…</div></div><iframe id="host" src="app-v1.9.19-tempo-bias-test.html?build=20260821-1922" allow="autoplay"></iframe><script>
const host=document.getElementById('host'),file=document.getElementById('file'),status=document.getElementById('status'),track=document.getElementById('track'),click=document.getElementById('click'),tv=document.getElementById('tv'),cv=document.getElementById('cv');const BPMS=[118.8,119.0,119.2,119.4,119.532,119.6];let active=119.532;
function chain(){let out=[];try{let w=host.contentWindow;for(let k=0;k<12;k++){out.push(w);let q=w.document.getElementById('outer')||w.document.getElementById('app');if(!q||!q.contentWindow)break;w=q.contentWindow}}catch(_){}return out}
function core(){let a=chain();return a.length?a[a.length-1]:null}
function parent1919(){try{return host.contentWindow}catch(_){return null}}
function player(){try{let w=core();return w&&w.document.getElementById('player')}catch(_){return null}}
function flatten(){for(const w of chain()){try{w.document.querySelectorAll('.bar').forEach(x=>x.style.display='none');w.document.documentElement.style.height='100%';w.document.body.style.height='100%';w.document.body.style.overflow='auto';w.document.querySelectorAll('iframe').forEach(f=>{f.style.height='100vh';f.style.minHeight='760px';f.style.width='100%';f.style.border='0'})}catch(_){}}}
function installClickGain(){let w=parent1919();if(!w)return;try{w.__hl1922ClickGain=+click.value/100;if(w.__hl1922PingInstalled)return;w.eval(`(function(){if(window.__hl1922PingInstalled)return;window.__hl1922PingInstalled=true;ping=function(when){try{let o=core.ctx.createOscillator(),g=core.ctx.createGain(),z=window.__hl1922ClickGain==null?.9:window.__hl1922ClickGain;o.frequency.value=900;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(Math.max(.001,.34*z),when+.002);g.gain.exponentialRampToValueAtTime(.0001,when+.045);o.connect(g);g.connect(core.ctx.destination);o.start(when);o.stop(when+.05)}catch(_){}}})();`)}catch(_){} }
function applyMix(){let p=player();if(p)p.volume=+track.value/100;tv.textContent=track.value+'%';cv.textContent=click.value+'%';installClickGain()}
function syncStatus(){let p=player(),w=core();try{let s=w&&w.document.getElementById('status');status.textContent=(s?s.textContent.trim():'Núcleo listo')+(p?' · pista '+Math.round(p.volume*100)+'%':'')}catch(_){}}
for(const x of BPMS){let b=document.createElement('button');b.textContent=x===119.532?'119.532':x.toFixed(1);b.classList.toggle('on',x===active);b.onclick=()=>{active=x;document.querySelectorAll('#bpms button').forEach(q=>q.classList.toggle('on',+q.dataset.bpm===active));let w=parent1919();try{let btn=[...w.document.querySelectorAll('#bpms button')].find(q=>+q.dataset.bpm===active);if(btn)btn.click()}catch(_){} };b.dataset.bpm=x;document.getElementById('bpms').appendChild(b)}
file.onchange=()=>{let f=file.files&&file.files[0];if(!f)return;let w=core();try{let target=w.document.getElementById('audioFile'),dt=new DataTransfer();dt.items.add(f);target.files=dt.files;target.dispatchEvent(new Event('change',{bubbles:true}));status.textContent=f.name+' · cargado'}catch(e){status.textContent='No se pudo transferir el archivo; recarga y prueba otra vez'}};
document.getElementById('analyze').onclick=()=>{let w=core();try{w.document.getElementById('run').click()}catch(_){}};
document.getElementById('play').onclick=()=>{let p=player();if(!p)return;if(p.paused)p.play();else p.pause()};track.oninput=applyMix;click.oninput=applyMix;
host.addEventListener('load',()=>setTimeout(()=>{flatten();applyMix();status.textContent='Listo · carga el audio arriba'},1200));setInterval(()=>{flatten();applyMix();syncStatus()},800);
</script></body></html>

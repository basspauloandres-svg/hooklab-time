<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIE F0/Voicing Fingerprint Audit v0.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f2f2f0;color:#171717;margin:0}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button{font-size:16px;padding:12px;border:0;border-radius:10px;background:#222;color:#fff;width:100%;margin-top:8px}button.secondary{background:#e7e7e4;color:#222}button:disabled{opacity:.45}pre{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:7px;text-align:left}.ok{color:#087a38}.warn{color:#8a5200}</style></head><body><main><div class="card"><h1>MIE · F0/Voicing Fingerprint Audit v0.1</h1><p>Auditoría documental. No procesa audio. Contrasta la huella histórica D0/R1.3 con propiedades esperables de familias de estimadores F0.</p><button id="run">1. Ejecutar auditoría</button><button id="export" class="secondary" disabled>2. Exportar JSON</button><p id="status">Pendiente.</p></div><div class="card"><h2>Huella histórica</h2><div id="hist"></div></div><div class="card"><h2>Comparación de familias</h2><div id="cmp"></div></div><div class="card"><h2>Reporte</h2><pre id="out">Ejecuta la auditoría.</pre></div></main><script>
var D0=[.0449,.0157,.0226,.0124,.1979,.5372,.1465,.0597,.0557,.1012,.0536,.0176,.0123,.0165,.0566,.2739,.0623,.1387,.0113,.1544,.1692,.0726,.0498,.4192,.1415,.2644,.0121,.0684,.1547,.0295,.0174,.0416,.0164,.033,.0105,.0926,.2736,.1295,.0462,.0807,.0871,.1636,.137,.0112,.01,.1237,.1615,.1392,.0799,.1167,.0122,.2644,.1215,.0957,.0358,.0102,.1401,.1032,.2284,.0426,.152,.0538,.0603,.0232];
var R13=[.7216,.4261,.6861,.5168,.6861,.8911,.6159,.5485,.8267,.6861,.6861,.3721,.7216,.485];
var LAST=null;
function mean(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length}function median(a){var b=a.slice().sort(function(x,y){return x-y}),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2}function q(a,p){var b=a.slice().sort(function(x,y){return x-y}),i=(b.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return b[lo]+(b[hi]-b[lo])*(i-lo)}function stats(a){var low=0,high=0;for(var i=0;i<a.length;i++){if(a[i]<.1)low++;if(a[i]>=.5)high++}return{n:a.length,min:Math.min.apply(null,a),q25:q(a,.25),median:median(a),mean:mean(a),q75:q(a,.75),max:Math.max.apply(null,a),share_lt_0_1:low/a.length,share_ge_0_5:high/a.length}}
function row(name,continuous,explicitProb,viterbi,framewise,score,note){return{name:name,continuous_probability:continuous,explicit_voiced_probability:explicitProb,viterbi_sequence_model:viterbi,framewise_f0:framewise,compatibility_score:score,note:note}}
function run(){var sD=stats(D0),sR=stats(R13);var families=[row('pYIN / probabilistic YIN',true,true,true,true,4,'Produces f0, voiced flag and voiced probability per frame; sequence decoded with Viterbi.'),row('Deterministic YIN',false,false,false,true,1,'Produces frame-wise F0 but not an intrinsic voiced probability series comparable to the historical field.'),row('Generic autocorrelation/HPS peak picker',false,false,false,true,1,'Can generate pitch salience/confidence only if an extra confidence layer is added; field semantics are not intrinsic.'),row('Neural pitch estimator with confidence head',true,true,false,true,3,'Could match continuous confidence semantics, but the historical artifacts currently provide no neural-model identifier.')];var rows='<table><tr><th>Familia</th><th>Prob. continua</th><th>voiced_prob explícito</th><th>Viterbi</th><th>Score</th></tr>';for(var i=0;i<families.length;i++){var f=families[i];rows+='<tr><td>'+f.name+'</td><td>'+(f.continuous_probability?'sí':'no')+'</td><td>'+(f.explicit_voiced_probability?'sí':'no')+'</td><td>'+(f.viterbi_sequence_model?'sí':'no')+'</td><td>'+f.compatibility_score+'/4</td></tr>'}rows+='</table>';document.getElementById('cmp').innerHTML=rows;document.getElementById('hist').innerHTML='<table><tr><th>Serie</th><th>n</th><th>mediana</th><th>media</th><th>&lt;0.1</th><th>≥0.5</th></tr><tr><td>D0</td><td>'+sD.n+'</td><td>'+sD.median.toFixed(4)+'</td><td>'+sD.mean.toFixed(4)+'</td><td>'+(100*sD.share_lt_0_1).toFixed(1)+'%</td><td>'+(100*sD.share_ge_0_5).toFixed(1)+'%</td></tr><tr><td>R1.3</td><td>'+sR.n+'</td><td>'+sR.median.toFixed(4)+'</td><td>'+sR.mean.toFixed(4)+'</td><td>'+(100*sR.share_lt_0_1).toFixed(1)+'%</td><td>'+(100*sR.share_ge_0_5).toFixed(1)+'%</td></tr></table>';LAST={harness:'MIE F0/Voicing Fingerprint Audit v0.1',timestamp:new Date().toISOString(),historical:{frame_period_ms:11.609977324263038,D0_stats:sD,R13_stats:sR,field_name:'voicing_probability'},candidate_families:families,best_documentary_match:'pYIN / probabilistic YIN',interpretation:'Documentary compatibility only. This does not prove the historical implementation identity. Exact identity requires frame-level replay from the historical audio or recovery of the original script/manifest.',next_test:'Replay candidate pYIN parameterizations against the historical 0:00-0:20 fragment and compare frame-level F0/voiced_prob plus event aggregation against D0.'};document.getElementById('out').textContent=JSON.stringify(LAST,null,2);document.getElementById('status').className='ok';document.getElementById('status').textContent='Auditoría ejecutada · mejor coincidencia documental: pYIN (hipótesis, no identidad demostrada)';document.getElementById('export').disabled=false}
function exp(){if(!LAST)return;var b=new Blob([JSON.stringify(LAST,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='MIE_f0_voicing_fingerprint_audit_v0_1.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1000)}document.getElementById('run').onclick=run;document.getElementById('export').onclick=exp;
</script></body></html>

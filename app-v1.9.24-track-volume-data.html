<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.24 TRACK VOLUME + DATA</title><style>html,body{margin:0;height:100%;background:#f2f2f0}iframe{display:block;border:0;width:100%;height:100vh}</style></head><body><iframe id="core" src="app-v1.6.html?build=20260822-1924" allow="autoplay"></iframe><script>
const frame=document.getElementById('core'),OFFSET_S=-0.1152;
function inject(){try{const w=frame.contentWindow,d=w.document;if(!d||!d.body)return setTimeout(inject,150);if(d.getElementById('hl1924'))return;const cards=d.querySelectorAll('.card');if(cards.length<3)return setTimeout(inject,150);const box=d.createElement('div');box.className='card';box.id='hl1924';box.innerHTML=`<h2 style="font-size:18px;margin:0 0 10px">Monitoreo y datos</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label style="font-size:13px">Pista <b id="hlTrackVal">60%</b><input id="hlTrack" type="range" min="0" max="100" value="60" step="1"></label><label style="font-size:13px">Claqueta <b id="hlClickVal">90%</b><input id="hlClick" type="range" min="0" max="100" value="90" step="1"></label></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px"><div class="m">Tactus BPM<b id="hlBpm">—</b></div><div class="m">Beat raw<b id="hlRaw">—</b></div><div class="m">Beat predictivo<b id="hlPred">—</b></div><div class="m">Tactus<b id="hlTac">—</b></div><div class="m">Runs<b id="hlRuns">—</b></div><div class="m">Transiciones<b id="hlTrans">—</b></div><div class="m">Ciclo métrico<b id="hlCycle">—</b></div><div class="m">Acentos<b id="hlAcc">—</b></div></div><p class="muted" id="hlState" style="margin:8px 0 0">Esperando análisis. Offset audible: −115.2 ms solo en claqueta.</p>`;cards[2].after(box);
const p=d.getElementById('player'),tr=d.getElementById('hlTrack'),cl=d.getElementById('hlClick'),tv=d.getElementById('hlTrackVal'),cv=d.getElementById('hlClickVal'),state=d.getElementById('hlState');
function applyTrack(){if(p){const v=+tr.value/100;p.volume=v;p.muted=false;p.playbackRate=1;p.defaultPlaybackRate=1;if('preservesPitch'in p)p.preservesPitch=true;tv.textContent=Math.round(p.volume*100)+'%';state.dataset.track=String(p.volume);} }
tr.addEventListener('input',applyTrack);tr.addEventListener('change',applyTrack);applyTrack();
w.__hl1924ClickGain=+cl.value/100;cl.addEventListener('input',()=>{w.__hl1924ClickGain=+cl.value/100;cv.textContent=cl.value+'%'});
try{w.eval(`(function(){if(window.__hl1924Installed)return;window.__hl1924Installed=true;window.__hl1924OrigTone=tone;tone=function(at,f,v,d){let g=window.__hl1924ClickGain==null?.9:window.__hl1924ClickGain,finalAt=Math.max(ctx.currentTime+.002,at+${OFFSET_S});return window.__hl1924OrigTone(finalAt,f,Math.max(0,Math.min(1,v*g)),d)};})();`)}catch(e){state.textContent='Control de pista activo; control de claqueta no instalado.'}
function refreshData(){try{const out=d.getElementById('out');if(!out)return;const txt=out.textContent.trim();if(!txt||txt==='{}')return;const j=JSON.parse(txt);d.getElementById('hlBpm').textContent=j.estimated_tactus_bpm??'—';d.getElementById('hlRaw').textContent=j.raw_beat_events??'—';d.getElementById('hlPred').textContent=j.predictive_beat_count??'—';d.getElementById('hlTac').textContent=j.tactus_count??'—';d.getElementById('hlRuns').textContent=j.pulse_runs??'—';d.getElementById('hlTrans').textContent=j.tempo_transition_count??'—';let cyc='—';if(Array.isArray(j.metric_segments)&&j.metric_segments.length){const c={};j.metric_segments.forEach(x=>{if(x.best_beats_per_cycle!=null)c[x.best_beats_per_cycle]=(c[x.best_beats_per_cycle]||0)+1});cyc=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'}d.getElementById('hlCycle').textContent=cyc;d.getElementById('hlAcc').textContent=j.metric_accent_count??'—';state.textContent='Datos activos · pista '+Math.round((p?.volume??0)*100)+'% · claqueta '+cl.value+'% · offset −115.2 ms';}catch(_){} }
setInterval(()=>{try{applyTrack();refreshData()}catch(_){}},500);const title=d.querySelector('h1');if(title)title.textContent='HookLab TIME v1.9.24 — Track Volume + Data';const desc=d.querySelector('h1 + .muted');if(desc)desc.textContent='Núcleo único. Volumen de pista y claqueta conectados directamente; datos principales visibles después del análisis; exportaciones nativas preservadas.';
}catch(e){setTimeout(inject,200)}}
frame.addEventListener('load',()=>setTimeout(inject,300));setTimeout(inject,800);
</script></body></html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HookLab TIME v0.7</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:22px;margin:0 0 6px}.muted{font-size:13px;color:#666}input,button{font-size:16px}input{width:100%}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:4px}button.secondary{background:#e7e7e4;color:#222}button:disabled{opacity:.4}audio{width:100%}canvas{width:100%;height:190px;background:#151515;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#f5f5f3;border-radius:10px;padding:10px}.m b{display:block;font-size:18px}progress{width:100%}pre{white-space:pre-wrap;overflow:auto;max-height:360px;background:#111;color:#eee;padding:10px;border-radius:10px}</style></head><body><main><div class="card"><h1>HookLab TIME Mobile — Beat This! v0.7</h1><p class="muted">Beat limpio + resolver métrico multihipótesis. No asume 4/4: compara agrupaciones de 2, 3, 4 y 6 beats y sus fases.</p><input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg"><button id="run" disabled>Analizar</button><span id="status" class="muted"> esperando audio</span><progress id="prog" max="100" value="0"></progress></div><div class="card"><audio id="player" controls></audio><button id="click" class="secondary">Claqueta ON</button><p class="muted">Beat 900 Hz · Acento métrico resuelto 2600 Hz</p></div><div class="card"><div class="grid"><div class="m">Beats<b id="bn">—</b></div><div class="m">Acentos métricos<b id="dn">—</b></div><div class="m">BPM mediano<b id="bpm">—</b></div><div class="m">Hipótesis métrica<b id="meter">—</b></div></div></div><div class="card"><canvas id="cv"></canvas></div><div class="card"><pre id="out">{}</pre></div></main><script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.min.js"></script><script>
const MEL_URL='https://raw.githubusercontent.com/danigb/beat-this-rs/main/models/mel_spectrogram.onnx',BEAT_URL='https://raw.githubusercontent.com/danigb/beat-this-rs/main/models/beat_this_small.onnx';const $=id=>document.getElementById(id);let ctx=null,buf=null,url=null,data=null,timer=null,clickOn=true,fileName='',melS=null,beatS=null;
$('audioFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;fileName=f.name;$('status').textContent=' decodificando…';$('run').disabled=true;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();buf=await ctx.decodeAudioData((await f.arrayBuffer()).slice(0));if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);$('player').src=url;$('status').textContent=` ${f.name} · ${buf.duration.toFixed(1)} s · listo`;$('run').disabled=false}catch(err){$('status').textContent=' error al decodificar audio'}};
function mono(b){let y=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){let x=b.getChannelData(c);for(let i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function resample(x,sr,to=22050){if(sr===to)return x;let n=Math.floor(x.length*to/sr),y=new Float32Array(n),r=sr/to;for(let i=0;i<n;i++){let p=i*r,a=Math.floor(p),f=p-a,z=Math.min(x.length-1,a+1);y[i]=x[a]*(1-f)+x[z]*f}return y}function sigmoid(x){return 1/(1+Math.exp(-x))}function median(a){let b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length?(b.length%2?b[m]:(b[m-1]+b[m])/2):null}async function ensureModels(){ort.env.wasm.numThreads=1;if(!melS)melS=await ort.InferenceSession.create(MEL_URL,{executionProviders:['wasm']});if(!beatS)beatS=await ort.InferenceSession.create(BEAT_URL,{executionProviders:['wasm']})}function firstTensor(o,n){for(const x of n)if(o[x])return o[x];return o[Object.keys(o)[0]]}function peakCandidates(points,thr=.5){let out=[];for(let i=1;i<points.length-1;i++){let a=sigmoid(points[i-1].v),b=sigmoid(points[i].v),c=sigmoid(points[i+1].v);if(b>=thr&&b>=a&&b>c)out.push({t:points[i].frame*.02,s:b})}return out}function suppressClose(cands,minGap){let ranked=[...cands].sort((a,b)=>b.s-a.s),keep=[];for(const c of ranked)if(!keep.some(k=>Math.abs(c.t-k.t)<minGap))keep.push(c);return keep.sort((a,b)=>a.t-b.t)}
function nearestScore(t,cands,max=.18){let best=0;for(const c of cands){let d=Math.abs(c.t-t);if(d<=max)best=Math.max(best,c.s*(1-d/max))}return best}function resolveMeter(beats,downRaw){let meters=[2,3,4,6],hyps=[];for(const m of meters)for(let phase=0;phase<m;phase++){let vals=[],times=[];for(let i=phase;i<beats.length;i+=m){vals.push(nearestScore(beats[i],downRaw,.20));times.push(beats[i])}let support=vals.filter(v=>v>.15).length/Math.max(1,vals.length),mean=vals.reduce((a,b)=>a+b,0)/Math.max(1,vals.length);let score=.55*mean+.45*support;hyps.push({beats_per_cycle:m,phase,score,support,mean_downbeat_evidence:mean,times})}hyps.sort((a,b)=>b.score-a.score);let best=hyps[0];return{best,candidates:hyps.slice(0,8).map(h=>({beats_per_cycle:h.beats_per_cycle,phase:h.phase,score:+h.score.toFixed(4),support:+h.support.toFixed(4),mean_downbeat_evidence:+h.mean_downbeat_evidence.toFixed(4)}))}}
$('run').onclick=async()=>{$('run').disabled=true;try{if(typeof ort==='undefined')throw new Error('ONNX Runtime no cargó');$('prog').value=5;await ensureModels();$('prog').value=20;let pcm=resample(mono(buf),buf.sampleRate,22050),melOut=await melS.run({[melS.inputNames[0]]:new ort.Tensor('float32',pcm,[1,pcm.length])}),spec=firstTensor(melOut,melS.outputNames);$('prog').value=40;let dims=spec.dims,frames,bands=128,flat=spec.data;if(dims.length===3){frames=dims[1];bands=dims[2]}else if(dims.length===2){frames=dims[0];bands=dims[1]}else throw new Error('forma mel inesperada');let beatPts=[],downPts=[],chunk=1500,overlap=12,step=chunk-2*overlap;for(let st=0;st<frames;st+=step){let n=Math.min(chunk,frames-st),arr=new Float32Array(n*bands);arr.set(flat.subarray(st*bands,(st+n)*bands));let o=await beatS.run({[beatS.inputNames[0]]:new ort.Tensor('float32',arr,[1,n,bands])}),outs=beatS.outputNames.map(nm=>o[nm]),b=outs[0].data,d=outs[1].data,L=st?overlap:0,R=(st+n<frames)?overlap:0;for(let i=L;i<n-R;i++){beatPts.push({frame:st+i,v:b[i]});downPts.push({frame:st+i,v:d[i]})}$('prog').value=40+55*Math.min(1,(st+n)/frames);await new Promise(r=>setTimeout(r,0))}beatPts.sort((a,b)=>a.frame-b.frame);downPts.sort((a,b)=>a.frame-b.frame);let beatRaw=peakCandidates(beatPts),downRaw=peakCandidates(downPts),beatKept=suppressClose(beatRaw,.16),beats=beatKept.map(x=>x.t),metric=resolveMeter(beats,downRaw),accents=metric.best.times,ibis=[];for(let i=1;i<beats.length;i++){let d=beats[i]-beats[i-1];if(d>.2&&d<2)ibis.push(d)}let mi=median(ibis),bpm=mi?60/mi:null;data={schema:'HookLab-Mobile-BeatThis-v0.7',engine:'Beat This small pretrained ONNX + multihypothesis metric resolver',file:fileName,duration_s:+buf.duration.toFixed(4),raw_beat_candidates:beatRaw.length,beat_count:beats.length,removed_beat_duplicates:beatRaw.length-beats.length,raw_downbeat_candidates:downRaw.length,estimated_bpm_from_median_ibi:bpm?+bpm.toFixed(4):null,selected_metric_hypothesis:{beats_per_cycle:metric.best.beats_per_cycle,phase:metric.best.phase,score:+metric.best.score.toFixed(4),support:+metric.best.support.toFixed(4)},metric_candidates:metric.candidates,metric_accent_count:accents.length,beats_s:beats.map(x=>+x.toFixed(5)),metric_accents_s:accents.map(x=>+x.toFixed(5)),notes:['pretrained_no_training','absolute_frame_stitching','duplicate_beat_suppression','downbeat_constrained_to_accepted_beats','multihypothesis_meter_2_3_4_6','phase_resolution','no_fixed_4_4_assumption','no_song_specific_parameters']};$('bn').textContent=beats.length;$('dn').textContent=accents.length;$('bpm').textContent=bpm?bpm.toFixed(2):'—';$('meter').textContent=metric.best.beats_per_cycle+' beats · fase '+metric.best.phase;$('out').textContent=JSON.stringify(data,null,2);$('status').textContent=' terminado';$('prog').value=100;draw()}catch(err){console.error(err);$('status').textContent=' ERROR: '+err.message}finally{$('run').disabled=false}};
function draw(){if(!data)return;let c=$('cv'),g=c.getContext('2d'),d=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);g.fillStyle='#151515';g.fillRect(0,0,W,H);for(const t of data.beats_s){let x=t/buf.duration*W;g.strokeStyle='#aaa';g.lineWidth=1;g.beginPath();g.moveTo(x,28);g.lineTo(x,H-8);g.stroke()}for(const t of data.metric_accents_s){let x=t/buf.duration*W;g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(x,7);g.lineTo(x,H-5);g.stroke()}}$('click').onclick=()=>{clickOn=!clickOn;$('click').textContent=clickOn?'Claqueta ON':'Claqueta OFF'};$('player').addEventListener('play',()=>{if(!data)return;if(ctx.state==='suspended')ctx.resume();let sch=$('player').currentTime;if(timer)clearInterval(timer);timer=setInterval(()=>{if($('player').paused||!clickOn)return;let mt=$('player').currentTime,ct=ctx.currentTime,end=mt+.18;for(const t of data.beats_s)if(t>=sch&&t<end)tone(ct+t-mt,900,.10,.03);for(const t of data.metric_accents_s)if(t>=sch&&t<end)tone(ct+t-mt,2600,.25,.05);sch=end},25)});$('player').addEventListener('pause',()=>{if(timer){clearInterval(timer);timer=null}});function tone(w,f,v,d){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,w);g.gain.exponentialRampToValueAtTime(.0001,w+d);o.connect(g);g.connect(ctx.destination);o.start(w);o.stop(w+d+.01)}
</script></body></html>

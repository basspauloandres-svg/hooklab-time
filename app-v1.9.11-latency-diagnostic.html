const outer=document.getElementById('outer'),stateEl=document.getElementById('state'),baseEl=document.getElementById('base'),outEl=document.getElementById('out'),sumEl=document.getElementById('sum'),countEl=document.getElementById('count'),exportBtn=document.getElementById('export');
let core=null,player=null,ctx=null,timer=null,samples=[],sessionStart=performance.now(),hooked=false;
function deep(){try{let w=outer.contentWindow;for(let k=0;k<12;k++){let q=w.document.getElementById('outer')||w.document.getElementById('app');if(!q||!q.contentWindow)break;w=q.contentWindow}return w}catch(_){return null}}
function resolve(){core=deep();if(!core)return false;try{player=core.document&&core.document.getElementById('player');ctx=core.ctx||null;if(!ctx&&core.eval)ctx=core.eval('typeof ctx!=="undefined"?ctx:null');return !!player}catch(_){return false}}
function ms(v){return Number.isFinite(v)?(v*1000):null}function fmt(v){return Number.isFinite(v)?v.toFixed(3)+' ms':'—'}
function snap(event){resolve();const b=ctx?ms(Number(ctx.baseLatency)):null,o=ctx?ms(Number(ctx.outputLatency)):null,s=(Number.isFinite(b)?b:0)+(Number.isFinite(o)?o:0);const rec={t_perf_ms:+(performance.now()-sessionStart).toFixed(3),event:event||'sample',audio_context_state:ctx?ctx.state:null,base_latency_ms:Number.isFinite(b)?+b.toFixed(6):null,output_latency_ms:Number.isFinite(o)?+o.toFixed(6):null,reported_sum_ms:(Number.isFinite(b)||Number.isFinite(o))?+s.toFixed(6):null,player_current_time_s:player&&Number.isFinite(player.currentTime)?+player.currentTime.toFixed(6):null,player_paused:player?!!player.paused:null,ctx_current_time_s:ctx&&Number.isFinite(ctx.currentTime)?+ctx.currentTime.toFixed(6):null,playback_offset_ms:core&&Number.isFinite(core.__hlPlaybackOffset)?+(core.__hlPlaybackOffset*1000).toFixed(3):null};samples.push(rec);stateEl.textContent=rec.audio_context_state||'—';baseEl.textContent=fmt(rec.base_latency_ms);outEl.textContent=fmt(rec.output_latency_ms);sumEl.textContent=fmt(rec.reported_sum_ms);countEl.textContent=samples.length+' muestras'}
function start(){clearInterval(timer);snap('play');timer=setInterval(()=>snap('sample'),250)}function stop(ev){snap(ev||'pause');clearInterval(timer);timer=null}
function hook(){if(hooked)return; if(!resolve())return setTimeout(hook,150);try{player.addEventListener('play',start);player.addEventListener('pause',()=>stop('pause'));player.addEventListener('ended',()=>stop('ended'));hooked=true;snap('hooked')}catch(_){setTimeout(hook,150)}}
function safe(n){return(n||'hooklab').replace(/\.[^.]+$/,'').replace(/[^a-z0-9_-]+/gi,'_')}
exportBtn.onclick=()=>{resolve();snap('export');const payload={schema:'HookLab-TIME-v1.9.11-latency-diagnostic',purpose:'diagnose WebAudio latency variability without changing playback compensation or analytical beat/tactus',source_app:'app-v1.9.7-offset-calibration.html',file:core&&core.lastFileName?core.lastFileName:null,user_agent:navigator.userAgent,sample_count:samples.length,samples};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safe(payload.file||'HookLab')+'_latency_diagnostic_v1_9_11.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};

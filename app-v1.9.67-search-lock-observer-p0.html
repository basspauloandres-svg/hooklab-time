<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HookLab TIME v1.9.67 SEARCH LOCK Observer</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input{font-size:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:6px 4px 6px 0}.muted{color:#666;font-size:13px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px;border-bottom:1px solid #eee;text-align:left}.big{font-size:20px;font-weight:700}pre{white-space:pre-wrap;background:#f5f5f3;padding:10px;border-radius:10px}</style></head><body><main><div class="card"><h1>TIME v1.9.67 — SEARCH/LOCK Observer P0</h1><p class="muted">No altera audio ni v1.9.65. Busca hipótesis alternativas únicamente cuando la confianza cae. Hipótesis: T, 2T, T/2 y relaciones ternarias 3T/2, 2T/3.</p><input id="f" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac"><br><button id="run">Analizar SEARCH/LOCK</button><p id="st">Esperando.</p></div><div class="card"><div class="big" id="base">Baseline: —</div><p id="summary"></p><button id="exp" disabled>Exportar diagnóstico</button></div><div class="card"><table><thead><tr><th>Inicio</th><th>Fin</th><th>Base</th><th>Ganadora</th><th>Score</th><th>Δ</th><th>Decisión</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><pre id="log">Sin resultados.</pre></div></main><script>
const $=x=>document.getElementById(x);let result=null;function med(a){if(!a.length)return null;let z=[...a].sort((a,b)=>a-b),m=z.length>>1;return z.length%2?z[m]:(z[m-1]+z[m])/2}function mono(b){let y=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){let x=b.getChannelData(c);for(let i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function onsets(b){let x=mono(b),sr=b.sampleRate,hop=Math.round(sr*.005),win=Math.round(sr*.03),e=[];for(let a=0;a+win<x.length;a+=hop){let d=0,p=x[a];for(let i=a+1;i<a+win;i+=2){let v=x[i];d+=Math.abs(v-p);p=v}e.push(d)}let gm=med(e)||1,o=[];for(let k=2;k<e.length-2;k++){let q=[];for(let j=Math.max(0,k-20);j<=Math.min(e.length-1,k+20);j++)q.push(e[j]);let th=(med(q)||gm)*1.35+gm*.08;if(e[k]>th&&e[k]>=e[k-1]&&e[k]>e[k+1])o.push({t:k*hop/sr,s:Math.min(2,e[k]/th)})}return o}function acquire(os){let xs=os.filter(o=>o.t>=.2&&o.t<=12),best={score:-1,p:.5,a:.5};for(let p=.34;p<=.75;p+=.002)for(const seed of xs.slice(0,24)){let s=0,w=0,h=0;for(const o of xs){let k=Math.round((o.t-seed.t)/p),d=Math.abs(o.t-(seed.t+k*p)),tol=Math.min(.09,p*.18);if(d<=tol){s+=o.s*(1-d/tol);h++}w+=o.s}let sc=.72*s/Math.max(.001,w)+.28*Math.min(1,h/16);if(sc>best.score)best={score:sc,p,a:seed.t}}while(best.a-best.p>.15)best.a-=best.p;while(best.a<.15)best.a+=best.p;return best}function near(os,t,w){let z=null,d=w;for(const o of os){if(o.t<t-w)continue;if(o.t>t+w)break;let q=Math.abs(o.t-t);if(q<d){d=q;z=o.t}}return z}function track(os,dur,p,a){let r=[],t=a;while(t<dur){let pred=t+p,o=near(os,pred,Math.min(.09,p*.2)),er=o==null?0:o-pred;t=pred+.28*er;p=Math.max(.30,Math.min(.80,p+.045*er));r.push({t,p,obs:o!=null,err:o==null?90:Math.abs(er*1000)})}return r}function conf(r){return r.map((x,i)=>{let w=r.slice(Math.max(0,i-7),i+1),ob=w.filter(z=>z.obs),ratio=ob.length/w.length,em=ob.length?med(ob.map(z=>z.err)):90,ps=med(w.map(z=>z.p)),mad=med(w.map(z=>Math.abs(z.p-ps))),c=.52*ratio+.30*Math.max(0,1-em/45)+.18*Math.max(0,1-mad/Math.max(.001,ps*.025));return {...x,c,state:c>=.72?'TRACKING':c>=.45?'PREDICTING':'UNCERTAIN'}})}function regions(r){let a=[],s=null;for(const x of r){if(x.state==='UNCERTAIN'){if(!s)s={start:x.t,end:x.t};else s.end=x.t}else if(s){if(s.end-s.start>=1.2)a.push(s);s=null}}if(s&&s.end-s.start>=1.2)a.push(s);return a}function scoreHyp(os,start,end,p){let xs=os.filter(o=>o.t>=start&&o.t<=end);if(xs.length<2)return {score:0,phase:null,hits:0};let seeds=xs.slice(0,Math.min(18,xs.length)),best={score:0,phase:null,hits:0};for(const q of seeds){let s=0,w=0,h=0;for(const o of xs){let k=Math.round((o.t-q.t)/p),d=Math.abs(o.t-(q.t+k*p)),tol=Math.min(.10,p*.20);if(d<=tol){s+=o.s*(1-d/tol);h++}w+=o.s}let sc=.75*s/Math.max(.001,w)+.25*Math.min(1,h/10);if(sc>best.score)best={score:sc,phase:q.t,hits:h}}return best}
$('run').onclick=async()=>{try{$('run').disabled=true;$('st').textContent='Decodificando…';let fs=$('f').files;if(!fs.length)throw Error('Selecciona audio');let file=fs[0],AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),b=await ac.decodeAudioData((await file.arrayBuffer()).slice(0));try{await ac.close()}catch(_){}$('st').textContent='Extrayendo ataques…';let os=onsets(b),aq=acquire(os),tr=conf(track(os,b.duration,aq.p,aq.a)),rg=regions(tr);$('base').textContent='Baseline: '+(60/aq.p).toFixed(2)+' BPM · p='+aq.p.toFixed(3)+' s';let factors=[['T',1],['2T',2],['T/2',.5],['3T/2',1.5],['2T/3',2/3]],ev=[];for(const g of rg){let pad=Math.max(3,aq.p*8),s=Math.max(0,g.start-pad),e=Math.min(b.duration,g.end+pad),scores=factors.map(([name,f])=>{let q=scoreHyp(os,s,e,aq.p*f);return{name,f,period:aq.p*f,...q}}).sort((a,b)=>b.score-a.score),base=scores.find(x=>x.name==='T'),win=scores[0],delta=win.score-base.score,decision=(win.name!=='T'&&win.score>=.62&&delta>=.12)?'LOCK_CANDIDATE':'NO_LOCK';ev.push({start:g.start,end:g.end,search_start:s,search_end:e,baseline:base,winner:win,delta,decision,all:scores})}$('rows').innerHTML=ev.map(x=>'<tr><td>'+x.start.toFixed(1)+'</td><td>'+x.end.toFixed(1)+'</td><td>'+x.baseline.score.toFixed(3)+'</td><td>'+x.winner.name+'</td><td>'+x.winner.score.toFixed(3)+'</td><td>'+x.delta.toFixed(3)+'</td><td>'+x.decision+'</td></tr>').join('');let locks=ev.filter(x=>x.decision==='LOCK_CANDIDATE');$('summary').textContent=rg.length+' regiones UNCERTAIN · '+locks.length+' candidatas de cambio métrico.';$('log').textContent=locks.length?locks.map(x=>'t='+x.start.toFixed(1)+'–'+x.end.toFixed(1)+' s → '+x.winner.name+' · '+(60/x.winner.period).toFixed(2)+' BPM-equivalente · score '+x.winner.score.toFixed(3)+' · Δ '+x.delta.toFixed(3)).join('\n'):'Sin LOCK candidatos bajo los criterios P0.';result={schema:'HookLab-TIME-v1.9.67-search-lock-observer-p0',source:file.name,duration_s:b.duration,onsets:os.length,baseline:{period_s:aq.p,bpm:60/aq.p,anchor_s:aq.a,score:aq.score},rules:{uncertain_min_s:1.2,hypotheses:factors,lock_min_score:.62,lock_min_delta:.12,audio_modified:false},search_events:ev};$('exp').disabled=false;$('st').textContent='LISTO · análisis observacional; audio intacto.'}catch(e){$('st').textContent='ERROR · '+e.message}finally{$('run').disabled=false}};$('exp').onclick=()=>{let b=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HookLab_SEARCH_LOCK_v1_9_67.json';a.click()};

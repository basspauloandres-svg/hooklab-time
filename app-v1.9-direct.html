function regimeChanges(times){let ev=times.filter(Number.isFinite).sort((a,b)=>a-b);if(ev.length<10)return[];let ibis=[];for(let i=1;i<ev.length;i++)ibis.push(ev[i]-ev[i-1]);let out=[],pending=[],seg=0;for(let i=7;i<ibis.length;i++){let hist=ibis.slice(Math.max(seg,i-7),i).filter(x=>x>.18&&x<1.8);if(hist.length<3)continue;let c=med(hist),sp=Math.max(mad(hist)||0,.004),x=ibis[i];if(x>2.5*c){pending=[];continue}let rel=Math.abs(x-c)/Math.max(c,1e-9),z=Math.abs(x-c)/sp;if(rel>=.12&&z>=5)pending.push([i,x,c]);else pending=[];if(pending.length>=2){let q=pending.slice(-2),rc=med(q.map(v=>v[1]));let coherent=Math.max(...q.map(v=>Math.abs(v[1]-rc)))<=Math.max(.02*rc,.008);if(coherent){let fi=q[0][0];out.push({localized_t:ev[fi],confirmed_t:ev[i+1],old_ibi:c,new_ibi:rc,old_bpm:60/c,new_bpm:60/rc});seg=i+1;pending=[]}}}return out}

w.resolveTactus=function(track,evidence){let groups=new Map();for(const x of track||[]){if(!groups.has(x.run))groups.set(x.run,[]);groups.get(x.run).push(x)}let tact=[],choices=[];for(const [id,xs0] of groups){let xs=xs0.filter(x=>Number.isFinite(x.t));if(xs.length<4)continue;let ints=[];for(let i=1;i<xs.length;i++){let q=xs[i].t-xs[i-1].t;if(q>.18&&q<1.8)ints.push(q)}let p=med(ints);if(!p)continue;let base=60/p,pick={factor:1,phase:0,bpm:base,state:'BASE_LAYER_SUPPORTED',ratio:1,regularity:null};if(xs.length>=8){let cand=[];for(let parity=0;parity<2;parity++){let tp=[],sp=[],so=[];for(let i=0;i<xs.length;i++){let s=Math.max(.0001,w.nearStrength(xs[i].t,evidence,.18));if(i%2===parity){tp.push(xs[i].t);sp.push(s)}else so.push(s)}if(tp.length>=4&&so.length>=3){let ii=[];for(let j=1;j<tp.length;j++)ii.push(tp[j]-tp[j-1]);let m2=med(ii),reg=m2?med(ii.map(v=>Math.abs(v-m2)))/m2:999,ratio=med(sp)/Math.max(med(so),1e-9);cand.push({parity,ratio,regularity:reg,bpm:m2?60/m2:base/2})}}if(cand.length){let b=cand.sort((a,b)=>b.ratio-a.ratio)[0];if(b.ratio>=1.7&&b.regularity<=.12)pick={factor:2,phase:b.parity,bpm:b.bpm,state:'HALF_TIME_SUPPORTED',ratio:b.ratio,regularity:b.regularity};else pick={...pick,ratio:b.ratio,regularity:b.regularity}}}for(let i=pick.phase;i<xs.length;i+=pick.factor)tact.push({t:xs[i].t,run:id});choices.push({run:id,base_bpm:+base.toFixed(3),selected_level:pick.factor===2?'2T':'T',selected_bpm:+pick.bpm.toFixed(3),decision:pick.state,salience_ratio:+pick.ratio.toFixed(3),regularity:pick.regularity==null?null:+pick.regularity.toFixed(4)})}tact.sort((a,b)=>a.t-b.t);let ii=[];for(let i=1;i<tact.length;i++)if(tact[i].run===tact[i-1].run)ii.push(tact[i].t-tact[i-1].t);let mm=med(ii);return{tactus:tact,estimated_bpm:mm?+(60/mm).toFixed(3):null,choices}};

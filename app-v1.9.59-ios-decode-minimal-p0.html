<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.59 iOS Decode Minimal P0</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:22px}.muted{color:#666;font-size:14px}button,input{font-size:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:5px 0}audio{width:100%;margin-top:10px}.ok{font-weight:700}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.59 — Decode mínimo iPhone</h1><p class="muted">Aísla una sola capa adicional respecto de v1.9.58: decodificación con AudioContext. La reproducción sigue siendo nativa.</p><input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac"><button id="load">1. Cargar nativo</button><audio id="player" controls preload="metadata"></audio><p id="nativeState" class="muted">Sin fuente.</p><button id="decode">2. Decodificar con AudioContext</button><p id="decodeState" class="muted">Sin decodificar.</p><div id="stats" class="muted"></div></div></main><script>
const fileInput=document.getElementById('file');const player=document.getElementById('player');const nativeState=document.getElementById('nativeState');const decodeState=document.getElementById('decodeState');const stats=document.getElementById('stats');let srcUrl=null;
function currentFile(){const f=fileInput.files&&fileInput.files[0];if(!f)throw new Error('No hay archivo seleccionado');return f}
document.getElementById('load').onclick=()=>{try{const f=currentFile();if(srcUrl)URL.revokeObjectURL(srcUrl);srcUrl=URL.createObjectURL(f);player.src=srcUrl;player.load();nativeState.textContent='FUENTE NATIVA CARGADA · '+f.name}catch(e){nativeState.textContent='ERROR NATIVO · '+e.message}};
player.addEventListener('canplay',()=>nativeState.textContent='CANPLAY OK · reproducción nativa disponible');player.addEventListener('playing',()=>nativeState.textContent='PLAYING OK · salida nativa audible');player.addEventListener('error',()=>nativeState.textContent='ERROR MEDIA · code '+(player.error?player.error.code:'?'));
document.getElementById('decode').onclick=async()=>{let ac=null;try{const f=currentFile();decodeState.textContent='LEYENDO ARRAYBUFFER…';const ab=await f.arrayBuffer();decodeState.textContent='ARRAYBUFFER OK · '+ab.byteLength+' bytes · creando AudioContext…';const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)throw new Error('AudioContext no disponible');ac=new Ctx();decodeState.textContent='AUDIOCONTEXT OK · estado '+ac.state+' · decodificando…';const t0=performance.now();const b=await ac.decodeAudioData(ab.slice(0));const ms=performance.now()-t0;decodeState.textContent='DECODE OK';stats.innerHTML='duración = '+b.duration.toFixed(6)+' s<br>sampleRate = '+b.sampleRate+' Hz<br>canales = '+b.numberOfChannels+'<br>frames = '+b.length+'<br>decode_ms = '+ms.toFixed(1)+'<br>AudioContext.state = '+ac.state;}catch(e){decodeState.textContent='ERROR DECODE · '+(e&&e.message?e.message:String(e));}finally{if(ac){try{await ac.close()}catch(_){}}}};
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>MIE Decoder Isolated + T + M v0.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:780px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input,audio,progress{font-size:16px;width:100%;box-sizing:border-box}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin-top:8px}button:disabled{opacity:.4}.muted{color:#666;font-size:14px}</style></head><body><main><div class="card"><h1>MIE Decoder aislado + T + M v0.1</h1><p class="muted">Decoder v1.9.61 aislado. El motor T+M vive fuera de esta página y se carga solo después de DECODE OK.</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><button id="decode">1. Decodificar</button><p id="decodeState" class="muted">Sin decodificar.</p><button id="run" disabled>2. Ejecutar T + M</button><progress id="pr" max="100" value="0"></progress><p id="st" class="muted">Esperando audio.</p></div><div class="card"><b>Beat + melodía resintetizada</b><audio id="out" controls></audio><p id="meta" class="muted">Sin salida.</p></div></main><script>
var input=document.getElementById('f'),buf=null,engineLoaded=false;
function getFile(){var fs=input.files;if(!fs||fs.length<1)throw new Error('Sin archivo');return fs[0]}
document.getElementById('decode').onclick=async function(){try{var f=getFile(),AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),ab=await f.arrayBuffer(),t=performance.now();buf=await ac.decodeAudioData(ab.slice(0));document.getElementById('decodeState').textContent='DECODE OK · '+buf.duration.toFixed(6)+' s · '+buf.sampleRate+' Hz · '+(performance.now()-t).toFixed(1)+' ms';document.getElementById('run').disabled=false;try{await ac.close()}catch(_){}}catch(e){document.getElementById('decodeState').textContent='ERROR DECODE · '+e.name+' · '+e.message}};
</script><script>
function loadEngine(){if(engineLoaded)return Promise.resolve();return new Promise(function(ok,no){var s=document.createElement('script');s.src='assets/mie-tm-engine-v0.1.js';s.onload=function(){engineLoaded=true;ok()};s.onerror=function(){no(new Error('No cargó el motor T+M'))};document.head.appendChild(s)})}
document.getElementById('run').onclick=async function(){try{if(!buf)throw new Error('Primero pulsa Decodificar');this.disabled=true;document.getElementById('st').textContent='Cargando motor T+M aislado…';await loadEngine();await window.MIE_runTM(buf)}catch(e){document.getElementById('st').textContent='ERROR · '+e.name+' · '+e.message;console.error(e)}finally{this.disabled=false}};
</script></body></html>

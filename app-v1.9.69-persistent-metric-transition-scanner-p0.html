<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HookLab TIME v1.9.69 Persistent Metric Transition Scanner</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input{font-size:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:6px 4px 6px 0}.muted{color:#666;font-size:13px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px;border-bottom:1px solid #eee;text-align:left}.big{font-size:20px;font-weight:700}pre{white-space:pre-wrap;background:#f5f5f3;padding:10px;border-radius:10px}</style></head><body><main><div class="card"><h1>TIME v1.9.69 — Persistent Metric Transition Scanner P0</h1><p class="muted">Escáner observacional de ventanas solapadas. No modifica audio ni reloj. Evalúa persistencia de T, 2T, T/2, 3T/2 y 2T/3.</p><input id="f" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac"><br><button id="run">Analizar persistencia métrica</button><p id="st">Esperando.</p></div><div class="card"><div class="big" id="base">Baseline: —</div><p id="summary"></p><button id="exp" disabled>Exportar diagnóstico</button></div><div class="card"><table><thead><tr><th>Inicio</th><th>Fin</th><th>Hipótesis</th><th>Ventanas</th><th>Score med.</th><th>Δ med.</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><pre id="log">Sin resultados.</pre></div></main><script>
const $=x=>document.getElementById(x);let result=null;function med(a){if(!a.length)return null;let z=[...a].sort((a,b)=>a-b),m=z.length>>1;return z.length%2?z[m]:(z[m-1]+z[m])/2}function mono(b){let y=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){let x=b.getChannelData(c);for(let i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function onsets(b){let x=mono(b),sr=b.sampleRate,hop=Math.round(sr*.005),win=Math.round(sr*.03),e=[];for(let a=0;a+win<x.length;a+=hop){let d=0,p=x[a];for(let i=a+1;i<a+win;i+=2){let v=x[i];d+=Math.abs(v-p);p=v}e.push(d)}let gm=med(e)||1,o=[];for(let k=2;k<e.length-2;k++){let q=[];for(let j=Math.max(0,k-20);j<=Math.min(e.length-1,k+20);j++)q.push(e[j]);let th=(med(q)||gm)*1.35+gm*.08;if(e[k]>th&&e[k]>=e[k-1]&&e[k]>e[k+1])o.push({t:k*hop/sr,s:Math.min(2,e[k]/th)})}return o}function acquire(os){let xs=os.filter(o=>o.t>=.2&&o.t<=12),best={score:-1,p:.5,a:.5};for(let p=.34;p<=.75;p+=.002)for(const seed of xs.slice(0,24)){let s=0,w=0,h=0;for(const o of xs){let k=Math.round((o.t-seed.t)/p),d=Math.abs(o.t-(seed.t+k*p)),tol=Math.min(.09,p*.18);if(d<=tol){s+=o.s*(1-d/tol);h++}w+=o.s}let sc=.72*s/Math.max(.001,w)+.28*Math.min(1,h/16);if(sc>best.score)best={score:sc,p,a:seed.t}}while(best.a-best.p>.15)best.a-=best.p;while(best.a<.15)best.a+=best.p;return best}function scoreHyp(os,start,end,p){let xs=os.filter(o=>o.t>=start&&o.t<=end);if(xs.length<2)return {score:0,phase:null,matches:0,precision:0,recall:0,mean_quality:0};let seeds=xs.slice(0,Math.min(18,xs.length)),best={score:0};for(const q of seeds){let g=[];for(let t=q.t;t>=start;t-=p)g.push(t);for(let t=q.t+p;t<=end;t+=p)g.push(t);g.sort((a,b)=>a-b);let used=new Set(),qual=[];for(let gi=0;gi<g.length;gi++){let bd=Math.min(.10,p*.20),bi=-1;for(let oi=0;oi<xs.length;oi++){if(used.has(oi))continue;let d=Math.abs(xs[oi].t-g[gi]);if(d<bd){bd=d;bi=oi}}if(bi>=0){used.add(bi);qual.push(1-bd/Math.min(.10,p*.20))}}let m=qual.length,prec=m/Math.max(1,g.length),rec=m/Math.max(1,xs.length),f1=(prec+rec)?2*prec*rec/(prec+rec):0,mq=m?qual.reduce((a,b)=>a+b,0)/m:0,sc=.72*f1+.28*mq;if(sc>best.score)best={score:sc,phase:q.t,matches:m,precision:prec,recall:rec,mean_quality:mq}}return best}
$('run').onclick=async()=>{try{$('run').disabled=true;$('st').textContent='Decodificando…';let fs=$('f').files;if(!fs.length)throw Error('Selecciona audio');let file=fs[0],AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),b=await ac.decodeAudioData((await file.arrayBuffer()).slice(0));try{await ac.close()}catch(_){}$('st').textContent='Extrayendo ataques…';let os=onsets(b),aq=acquire(os),hyp=[['T',1],['2T',2],['T/2',.5],['3T/2',1.5],['2T/3',2/3]],win=10,step=2,windows=[];for(let s=0;s+win<=b.duration;s+=step){let scores=hyp.map(([name,f])=>({name,f,period:aq.p*f,...scoreHyp(os,s,s+win,aq.p*f)})).sort((a,b)=>b.score-a.score),base=scores.find(x=>x.name==='T'),winner=scores[0];windows.push({start:s,end:s+win,baseline:base,winner,delta:winner.score-base.score,all:scores})}let segs=[],cur=null;for(const w of windows){let qualifies=w.winner.name!=='T'&&w.winner.score>=.58&&w.delta>=.10;if(qualifies){if(cur&&cur.hyp===w.winner.name&&w.start<=cur.end+step+.01){cur.end=w.end;cur.windows++;cur.scores.push(w.winner.score);cur.deltas.push(w.delta)}else{if(cur)segs.push(cur);cur={start:w.start,end:w.end,hyp:w.winner.name,windows:1,scores:[w.winner.score],deltas:[w.delta]}}}else if(cur){segs.push(cur);cur=null}}if(cur)segs.push(cur);segs=segs.map(s=>({...s,median_score:med(s.scores),median_delta:med(s.deltas),persistent:s.windows>=3}));$('base').textContent='Baseline: '+(60/aq.p).toFixed(2)+' BPM · p='+aq.p.toFixed(3)+' s';$('summary').textContent=windows.length+' ventanas · '+segs.filter(s=>s.persistent).length+' transiciones persistentes.';$('rows').innerHTML=segs.map(x=>'<tr><td>'+x.start.toFixed(1)+'</td><td>'+x.end.toFixed(1)+'</td><td>'+x.hyp+'</td><td>'+x.windows+'</td><td>'+x.median_score.toFixed(3)+'</td><td>'+x.median_delta.toFixed(3)+'</td><td>'+(x.persistent?'PERSISTENT':'LOCAL')+'</td></tr>').join('');$('log').textContent=segs.filter(s=>s.persistent).map(x=>x.start.toFixed(1)+'–'+x.end.toFixed(1)+' s → '+x.hyp+' · '+(60/(aq.p*(x.hyp==='3T/2'?1.5:x.hyp==='2T'?2:x.hyp==='T/2'?.5:x.hyp==='2T/3'?2/3:1))).toFixed(2)+' BPM-equivalente · '+x.windows+' ventanas').join('\n')||'Sin transiciones persistentes bajo criterios P0.';result={schema:'HookLab-TIME-v1.9.69-persistent-metric-transition-scanner-p0',source:file.name,duration_s:b.duration,onsets:os.length,baseline:{period_s:aq.p,bpm:60/aq.p,anchor_s:aq.a,score:aq.score},rules:{window_s:win,step_s:step,hypotheses:hyp,score:'balanced_v1.9.68',candidate_score_min:.58,candidate_delta_min:.10,persistence_min_windows:3,audio_modified:false},windows,segments:segs};$('exp').disabled=false;$('st').textContent='LISTO · análisis observacional; audio intacto.'}catch(e){$('st').textContent='ERROR · '+e.message}finally{$('run').disabled=false}};$('exp').onclick=()=>{let b=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HookLab_PERSISTENT_METRIC_v1_9_69.json';a.click()};
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIE Oracle Melody v0.1.2</title><style>body{font-family:system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.muted{font-size:13px;color:#666}.ok{color:#176b2c}.err{color:#a02222}input,button,audio,progress{width:100%;box-sizing:border-box;font-size:16px}button{padding:12px;border:0;border-radius:10px;background:#222;color:#fff;margin-top:8px}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>MIE Oracle Melody v0.1.2</h1><p class="muted">Carga segura para iOS. Primero valida el MP3; después se habilita el análisis. Sin procesamiento al abrir la página.</p><input id="f" type="file"><button id="validate">1. Validar audio</button><p id="fi" class="muted">Sin archivo validado.</p><audio id="preview" controls></audio><button id="go" disabled>2. Analizar voz</button><progress id="pr" max="100" value="0"></progress><p id="st" class="muted">Selecciona Voz1_mixed.mp3 y pulsa Validar audio.</p></div><div class="card grid"><div><b>A · Detección desde Voz1</b><audio id="a" controls></audio></div><div><b>Referencia · P30-SCORE-002</b><audio id="p30" controls></audio></div></div><div class="card"><button id="ex" disabled>Exportar JSON</button></div></main><script>const $=x=>document.getElementById(x),SR0=22050,START=13.3,END0=40.7;let validatedFile=null,validatedBuffer=null,ctx=null,res=null;function hz(m){return 440*Math.pow(2,(m-69)/12)}function readArrayBuffer(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error||Error('No se pudo leer el archivo'));r.readAsArrayBuffer(f)})}function readDataURL(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error||Error('No se pudo crear preview'));r.readAsDataURL(f)})}$('validate').onclick=async()=>{try{let f=$('f').files&&$('f').files[0];if(!f)throw Error('No hay archivo seleccionado');$('validate').disabled=true;$('st').textContent='Validando archivo…';let [ab,url]=await Promise.all([readArrayBuffer(f),readDataURL(f)]);if(!ab||ab.byteLength<1000)throw Error('El archivo está vacío o no se pudo leer');validatedFile=f;validatedBuffer=ab;$('preview').src=url;$('preview').load();$('fi').textContent='✓ '+f.name+' · '+(f.size/1048576).toFixed(2)+' MB · '+ab.byteLength+' bytes leídos';$('fi').className='muted ok';$('go').disabled=false;$('st').textContent='Archivo validado. Prueba Preview y luego pulsa Analizar voz.';$('st').className='muted ok'}catch(e){validatedFile=null;validatedBuffer=null;$('go').disabled=true;$('fi').textContent='ERROR · '+e.message;$('fi').className='muted err';$('st').textContent='La selección no llegó al navegador.';$('st').className='muted err'}finally{$('validate').disabled=false}};async function decode(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio API no disponible');ctx=ctx||new AC();if(ctx.state==='suspended')await ctx.resume();return await ctx.decodeAudioData(validatedBuffer.slice(0))}function mono(b){let y=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){let x=b.getChannelData(c);for(let i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function rs(x,sr,to=SR0){if(sr===to)return x;let n=Math.floor(x.length*to/sr),y=new Float32Array(n),r=sr/to;for(let i=0;i<n;i++){let p=i*r,j=Math.floor(p),f=p-j;y[i]=x[j]*(1-f)+x[Math.min(x.length-1,j+1)]*f}return y}function pitchFrame(x,a,N=2048){let best=null;for(let m=45;m<=76;m++){let f=hz(m),re=0,im=0,ws=0;for(let n=0;n<N;n+=2){let j=a+n;if(j>=x.length)break,w=.5-.5*Math.cos(2*Math.PI*n/(N-1)),v=x[j]*w,p=2*Math.PI*f*n/SR0;re+=v*Math.cos(p);im-=v*Math.sin(p);ws+=w}let e=Math.hypot(re,im)/Math.max(1,ws);if(!best||e>best.e)best={m,e}}return best}function eventsFromFrames(fr){let ev=[],cur=null;for(let q of fr){if(!cur||q.m!==cur.m){if(cur)ev.push(cur);cur={on:q.t,off:q.t+.0464,m:q.m,energy:[q.e]}}else{cur.off=q.t+.0464;cur.energy.push(q.e)}}if(cur)ev.push(cur);let vals=fr.map(q=>q.e).sort((a,b)=>a-b),med=vals[Math.floor(vals.length/2)]||0;return ev.filter(e=>e.off-e.on>=.07&&e.energy.reduce((a,b)=>a+b,0)/e.energy.length>=med*.55)}function wav(ev,start,end){const SR=44100,N=Math.ceil((end-start)*SR),y=new Float32Array(N);for(let q of ev){let A=Math.max(0,Math.floor((q.on-start)*SR)),B=Math.min(N,Math.floor((q.off-start)*SR)),f=hz(q.m);for(let i=A;i<B;i++){let t=(i-A)/SR,en=(1-Math.exp(-t/.006))*Math.exp(-t/1.8);y[i]+=.16*en*Math.sin(2*Math.PI*f*t)}}let mx=0;for(let v of y)mx=Math.max(mx,Math.abs(v));let g=.88/Math.max(mx,1e-9),ab=new ArrayBuffer(44+y.length*2),v=new DataView(ab),p=0,S=s=>{for(let c of s)v.setUint8(p++,c.charCodeAt(0))},U=n=>{v.setUint32(p,n,true);p+=4},H=n=>{v.setUint16(p,n,true);p+=2};S('RIFF');U(36+y.length*2);S('WAVEfmt ');U(16);H(1);H(1);U(SR);U(SR*2);H(2);H(16);S('data');U(y.length*2);for(let x of y){x=Math.max(-1,Math.min(1,x*g));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}function buildP30(){const P=[[13.3283,13.4327,48],[13.5256,13.6766,57],[13.6766,13.9088,59],[13.9088,14.1177,60],[14.1177,14.3035,62],[14.3035,15.1859,60],[15.1975,16.4165,53],[16.939,17.1712,55],[17.1712,17.3453,57],[17.3453,17.5659,59],[17.5659,17.7981,60],[18.0303,18.2857,60],[18.2857,18.7733,59],[18.8082,19.5396,52],[20.3987,20.4684,56],[20.4684,20.5729,57],[20.5729,20.7819,59],[20.7819,21.0024,60],[21.0024,21.1766,62],[21.1766,21.3972,64],[21.641,22.5234,64],[22.5234,23.6147,65],[23.8237,24.4274,65],[24.4274,24.6364,64],[24.6364,24.7989,62],[25.2981,25.6813,64],[25.8322,26.6449,60],[27.1906,27.8291,64],[28.0265,28.2355,67],[28.4096,28.7463,64],[28.7463,28.9205,65],[28.9205,29.3732,64],[29.3732,29.79

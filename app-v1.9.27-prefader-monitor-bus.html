<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.27 PRE-FADER MONITOR BUS</title><style>html,body{margin:0;height:100%;background:#f2f2f0}iframe{display:block;border:0;width:100%;height:100vh}</style></head><body><iframe id="core" src="app-v1.6.html?build=20260822-1927" allow="autoplay"></iframe><script>
const frame=document.getElementById('core'),OFFSET_S=-0.1152;

const tr=d.getElementById('tr'),cl=d.getElementById('cl'),tv=d.getElementById('tv'),cv=d.getElementById('cv'),st=d.getElementById('st'),lat=d.getElementById('lat');let tg=.60,cg=.90,tm=false,cm=false;

function status(){st.textContent=`PRE bus · pista ${tm?'MUTE':Math.round(tg*100)+'%'} · beat ${cm?'MUTE':Math.round(cg*100)+'%'} · rate ${p.playbackRate.toFixed(6)} · offset −115.2 ms`;lat.textContent=`baseLatency ${ctx.baseLatency!=null?(ctx.baseLatency*1000).toFixed(2)+' ms':'n/d'} · outputLatency ${ctx.outputLatency!=null?(ctx.outputLatency*1000).toFixed(2)+' ms':'n/d'}`}

try{w.eval(`(function(){if(window.__hl1927Installed)return;window.__hl1927Installed=true;window.__hl1927OrigTone=tone;tone=function(at,f,v,d){if(window.__hl1927ClickMute)return;let g=window.__hl1927ClickGain==null?.9:window.__hl1927ClickGain;let finalAt=Math.max(ctx.currentTime+.002,at+${OFFSET_S});return window.__hl1927OrigTone(finalAt,f,Math.max(.0001,v*g),d)};})();`)}catch(e){st.textContent='Error al conectar claqueta: '+e.message}
p.volume=1;p.muted=false;p.playbackRate=1;p.defaultPlaybackRate=1;if('preservesPitch'in p)p.preservesPitch=true;setInterval(()=>{p.volume=1;p.muted=false;p.playbackRate=1;p.defaultPlaybackRate=1;status()},1000);applyTrack();let title=d.querySelector('h1');if(title)title.textContent='HookLab TIME v1.9.27 — PRE-FADER Monitor Bus';let desc=d.querySelector('h1 + .muted');if(desc)desc.textContent='La pista se toma una sola vez en PRE y se controla por GainNode. La rama paralela de referencia queda a 0 dB de ganancia audible (mute) para evitar duplicación y peine.';
}catch(e){setTimeout(inject,200)}}frame.addEventListener('load',()=>setTimeout(inject,300));setTimeout(inject,900);

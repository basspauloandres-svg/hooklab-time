<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.38 Flat Baseline</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:22px;margin:0 0 6px}.muted{font-size:13px;color:#666}input,button{font-size:16px}input{width:100%}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:4px}.secondary{background:#e7e7e4;color:#222}progress{width:100%}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.38 — Flat Baseline</h1><p class="muted">Regla de validez: 1 runtime · 1 AudioContext · 1 AudioBufferSourceNode · 1 scheduler. Sin iframe, sin dependencia de otro HTML experimental.</p><input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg"><button id="decode" disabled>Preparar audio</button><span id="status" class="muted"> esperando audio</span></div><div class="card"><div style="display:grid;grid-template-columns:auto auto 1fr;gap:8px"><button id="play" disabled>Play</button><button id="stop" class="secondary" disabled>Stop</button><input id="seek" type="range" min="0" max="1000" value="0"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px"><label>Pista <b id="tv">60%</b><input id="trackVol" type="range" min="0" max="100" value="60"></label><label>Click diagnóstico <b id="cv">90%</b><input id="clickVol" type="range" min="0" max="200" value="90"></label></div><label><input id="diag" type="checkbox"> Click diagnóstico estable (120 BPM, solo para verificar scheduler)</label><p id="rt" class="muted">runtime no iniciado</p></div><div class="card"><button id="export" class="secondary">Exportar baseline audit</button></div></main><script>
const $=x=>document.getElementById(x);let selectedFile=null,arrayBuffer=null,ctx=null,buf=null,src=null,trackGain=null,clickGain=null,playing=false,startCtx=0,pos=0,scheduler=null,nextClick=0,records=[];$('audioFile').onchange=e=>{selectedFile=e.target.files&&e.target.files[0];arrayBuffer=null;buf=null;$('decode').disabled=!selectedFile;$('status').textContent=selectedFile?' '+selectedFile.name+' · pulsa Preparar audio':' esperando audio'};async function prepare(){if(!selectedFile)return;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();arrayBuffer=arrayBuffer||await selectedFile.arrayBuffer();buf=await ctx.decodeAudioData(arrayBuffer.slice(0));if(!trackGain){trackGain=ctx.createGain();clickGain=ctx.createGain();trackGain.connect(ctx.destination);clickGain.connect(ctx.destination)}trackGain.gain.value=+$('trackVol').value/100;clickGain.gain.value=+$('clickVol').value/100;$('seek').max=Math.round(buf.duration*1000);$('play').disabled=false;$('stop').disabled=false;$('status').textContent=' audio preparado';$('rt').textContent=`1 runtime · AudioContext ${ctx.state} · buffer ${buf.duration.toFixed(3)} s · playbackRate 1`;records.push({kind:'prepared',duration_s:buf.duration,audio_context_state:ctx.state})}$('decode').onclick=prepare;function current(){return playing?Math.min(buf.duration,pos+ctx.currentTime-startCtx):pos}function kill(update=true){if(playing&&update)pos=current();playing=false;$('play').textContent='Play';if(src)try{src.stop()}catch(_){}src=null;if(scheduler)clearInterval(scheduler);scheduler=null}function tone(at){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=900;g.gain.setValueAtTime(.10,at);g.gain.exponentialRampToValueAtTime(.0001,at+.03);o.connect(g);g.connect(clickGain);o.start(at);o.stop(at+.04)}function scheduleDiag(){nextClick=Math.ceil(pos/.5)*.5;scheduler=setInterval(()=>{if(!playing||!$('diag').checked)return;let now=ctx.currentTime,end=now+.18,base=startCtx-pos;while(base+nextClick<end){let at=base+nextClick;if(at>=now+.002)tone(at);nextClick+=.5}},25)}async function startAt(x){if(!buf)await prepare();if(ctx.state==='suspended')await ctx.resume();kill(false);pos=Math.max(0,Math.min(buf.duration-.001,x||0));src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=1;src.connect(trackGain);startCtx=ctx.currentTime+.05;src.start(startCtx,pos);src.onended=()=>{if(playing){playing=false;$('play').textContent='Play';if(scheduler)clearInterval(scheduler)}};playing=true;$('play').textContent='Pausa';records.push({kind:'start',position_s:pos,ctx_start_s:startCtx,playback_rate:1});scheduleDiag()}$('play').onclick=()=>playing?kill(true):startAt(pos);$('stop').onclick=()=>{kill(false);pos=0;$('seek').value=0};$('seek').oninput=()=>{let x=+$('seek').value/1000;playing?startAt(x):pos=x};$('trackVol').oninput=e=>{if(trackGain)trackGain.gain.value=+e.target.value/100;$('tv').textContent=e.target.value+'%'};$('clickVol').oninput=e=>{if(clickGain)clickGain.gain.value=+e.target.value/100;$('cv').textContent=e.target.value+'%'};$('export').onclick=()=>{let payload={schema:'HookLab-TIME-v1.9.38-flat-baseline',build_id:'v1.9.38-flat-baseline',architecture:{runtime_count:1,audio_context_count:ctx?1:0,audio_source_design:'one active AudioBufferSourceNode',scheduler_count_design:1,iframe_count:0,experimental_html_dependency:false},file:selectedFile&&selectedFile.name,buffer_duration_s:buf&&buf.duration,source_playback_rate:1,audible_offset_ms:0,diagnostic_click_bpm:120,records};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HookLab_flat_baseline_v1_9_38.json';a.click()};
</script></body></html>

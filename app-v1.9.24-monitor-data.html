<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.24 MONITOR + DATA</title><style>html,body{margin:0;height:100%;background:#f2f2f0}iframe{display:block;border:0;width:100%;height:100vh}</style></head><body><iframe id="core" src="app-v1.6.html?build=20260822-1924" allow="autoplay"></iframe><script>
const frame=document.getElementById('core'),OFFSET_S=-0.1152;let monitor=[];
function dl(obj,name){let b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function inject(){try{let w=frame.contentWindow,d=w.document;if(!d||!d.body)return setTimeout(inject,150);if(d.getElementById('hl1924panel'))return;let main=d.querySelector('main'),cards=d.querySelectorAll('.card');if(!main||cards.length<2)return setTimeout(inject,150);
let panel=d.createElement('div');panel.className='card';panel.id='hl1924panel';panel.innerHTML=`<h2 style="font-size:18px;margin:0 0 10px">Monitoreo y datos P0</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label style="font-size:13px">Pista <b id="hlTrackVal">60%</b><input id="hlTrack" type="range" min="0" max="100" value="60" step="1"></label><label style="font-size:13px">Claqueta <b id="hlClickVal">90%</b><input id="hlClick" type="range" min="0" max="100" value="90" step="1"></label></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px"><div class="m">BPM tactus<b id="hlBpm">—</b></div><div class="m">Tactus<b id="hlTactus">—</b></div><div class="m">Runs<b id="hlRuns">—</b></div><div class="m">Transiciones<b id="hlTrans">—</b></div></div><p class="muted" id="hlState" style="margin:8px 0 8px">Offset audible fijo: −115.2 ms. PlaybackRate protegido en 1.0.</p><button id="hlExport" class="secondary">Exportar diagnóstico P0</button>`;cards[1].after(panel);
let p=d.getElementById('player'),tr=d.getElementById('hlTrack'),cl=d.getElementById('hlClick'),tv=d.getElementById('hlTrackVal'),cv=d.getElementById('hlClickVal');let targetTrack=.60,targetClick=.90;
function enforceTrack(reason){if(!p)return;p.volume=targetTrack;p.playbackRate=1;p.defaultPlaybackRate=1;if('preservesPitch'in p)p.preservesPitch=true;tv.textContent=Math.round(targetTrack*100)+'%';monitor.push({t_perf_ms:performance.now(),type:'track_enforce',reason,requested_volume:targetTrack,actual_volume:p.volume,playbackRate:p.playbackRate})}
tr.addEventListener('input',()=>{targetTrack=+tr.value/100;enforceTrack('slider')});p.addEventListener('volumechange',()=>{if(Math.abs(p.volume-targetTrack)>.001)enforceTrack('volumechange_guard')});enforceTrack('install');
w.__hl1924ClickGain=targetClick;cl.addEventListener('input',()=>{targetClick=+cl.value/100;w.__hl1924ClickGain=targetClick;cv.textContent=Math.round(targetClick*100)+'%';monitor.push({t_perf_ms:performance.now(),type:'click_gain',value:targetClick})});
try{w.eval(`(function(){if(window.__hl1924Installed)return;window.__hl1924Installed=true;window.__hl1924OrigTone=tone;tone=function(at,f,v,d){let g=window.__hl1924ClickGain==null?.9:window.__hl1924ClickGain;let finalAt=Math.max(ctx.currentTime+.002,at+${OFFSET_S});return window.__hl1924OrigTone(finalAt,f,Math.max(0,Math.min(1,v*g)),d)};})();`)}catch(_){}
function refresh(){try{enforceTrack('poll');let x=w.data||null;d.getElementById('hlBpm').textContent=x&&x.estimated_tactus_bpm!=null?Number(x.estimated_tactus_bpm).toFixed(3):'—';d.getElementById('hlTactus').textContent=x&&x.tactus_count!=null?x.tactus_count:'—';d.getElementById('hlRuns').textContent=x&&x.pulse_runs!=null?x.pulse_runs:'—';d.getElementById('hlTrans').textContent=x&&x.tempo_transition_count!=null?x.tempo_transition_count:'—';d.getElementById('hlState').textContent='Pista '+Math.round(targetTrack*100)+'% · Claqueta '+Math.round(targetClick*100)+'% · offset −115.2 ms · rate '+p.playbackRate.toFixed(6)}catch(_){}}
setInterval(refresh,500);
d.getElementById('hlExport').onclick=()=>{let x=w.data||null;dl({schema:'HookLab-TIME-v1.9.24-p0-diagnostic',audible_offset_ms:-115.2,monitor:{track_requested:targetTrack,track_actual:p?p.volume:null,click_gain:targetClick,playbackRate:p?p.playbackRate:null,defaultPlaybackRate:p?p.defaultPlaybackRate:null,preservesPitch:p&&'preservesPitch'in p?p.preservesPitch:null,currentTime_s:p?p.currentTime:null},analysis:x?{file:x.file,duration_s:x.duration_s,raw_beat_events:x.raw_beat_events,fallback_onset_events:x.fallback_onset_events,predictive_beat_count:x.predictive_beat_count,pulse_runs:x.pulse_runs,tempo_transition_count:x.tempo_transition_count,tactus_count:x.tactus_count,estimated_tactus_bpm:x.estimated_tactus_bpm,tactus_run_choices:x.tactus_run_choices,rhythmic_state_counts:x.rhythmic_state_counts}:null,monitor_records:monitor},'HookLab_P0_diagnostic_v1_9_24.json')};
let title=d.querySelector('h1');if(title)title.textContent='HookLab TIME v1.9.24 — Monitor + Data';let desc=d.querySelector('h1 + .muted');if(desc)desc.textContent='Base única: carga, análisis, reproducción, volumen independiente y exportación de datos P0.';
}catch(e){setTimeout(inject,200)}}
frame.addEventListener('load',()=>setTimeout(inject,300));setTimeout(inject,800);
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.10 AUTO COMP LIFECYCLE</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f2f2f0}.bar{position:sticky;top:0;z-index:999999;background:#fff;padding:10px 12px;border-bottom:1px solid #ddd}.bar b{display:block;margin-bottom:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.m{background:#f5f5f3;border-radius:8px;padding:7px}.m span{display:block;font-weight:700;font-variant-numeric:tabular-nums}.row{display:grid;grid-template-columns:90px 1fr 80px;gap:8px;align-items:center;margin-top:8px}.row input{width:100%}.small{font-size:12px;color:#666;margin-top:6px}iframe{border:0;width:100%;height:calc(100vh - 205px);display:block}</style></head><body><div class="bar"><b>v1.9.10 PRETEST · compensación por ciclo de vida</b><div class="grid"><div class="m">Estado<span id="status">esperando Play…</span></div><div class="m">Latencia detectada<span id="lat">—</span></div><div class="m">Compensación base<span id="base">0.0 ms</span></div><div class="m">Compensación total<span id="comp">0.0 ms</span></div></div><div class="row"><label>Ajuste fino</label><input id="fine" type="range" min="-80" max="80" step="0.1" value="0"><span id="finev">0.0 ms</span></div><div class="small" id="source">Fuente: pendiente. La compensación afecta solo la claqueta; beat/tactus analítico permanece intacto.</div></div><iframe id="outer" src="app-v1.9.6-latency-audit-exportfix.html?build=20260820-1910" allow="autoplay"></iframe><script>
const outer=document.getElementById('outer'),statusEl=document.getElementById('status'),lat=document.getElementById('lat'),baseEl=document.getElementById('base'),comp=document.getElementById('comp'),fine=document.getElementById('fine'),finev=document.getElementById('finev'),sourceEl=document.getElementById('source');
let core=null,ctx=null,baseMs=0,fineMs=0,patched=false,playHooked=false,pollTimer=null,pollDeadline=0,latencyMeta={base_latency_ms:null,output_latency_ms:null,detected_output_latency_ms:null,source_api:'unavailable',calculation:'none'};
function deepest(){try{let w=outer.contentWindow;for(let k=0;k<10;k++){let q=w.document.getElementById('outer')||w.document.getElementById('app');if(!q||!q.contentWindow)break;w=q.contentWindow}return w}catch(_){return null}}
function getCtx(w){try{if(w&&w.ctx)return w.ctx;if(w&&w.eval)return w.eval('typeof ctx!=="undefined"?ctx:null')}catch(_){}return null}
function fmt(v){return Number.isFinite(v)?v.toFixed(1)+' ms':'—'}
function apply(){if(!core)return;const total=baseMs+fineMs;core.__hlPlaybackOffset=total/1000;baseEl.textContent=fmt(baseMs);finev.textContent=(fineMs>=0?'+':'')+fineMs.toFixed(1)+' ms';comp.textContent=(total>=0?'+':'')+total.toFixed(1)+' ms'}
fine.oninput=()=>{fineMs=+fine.value;apply()};
function latencySnapshot(c){const b=Number(c&&c.baseLatency),o=Number(c&&c.outputLatency);const hasB=Number.isFinite(b)&&b>0,hasO=Number.isFinite(o)&&o>0;let used=null,source='unavailable',calc='none';
// Web Audio defines baseLatency as AudioContext processing latency and outputLatency as output timestamp latency estimate. They are recorded separately. For this experiment, when both are exposed we use their sum as the audible-path compensation candidate, while preserving both raw fields for later validation.
if(hasB&&hasO){used=b+o;source='AudioContext.baseLatency+outputLatency';calc='sum'}else if(hasO){used=o;source='AudioContext.outputLatency';calc='output_only'}else if(hasB){used=b;source='AudioContext.baseLatency';calc='base_only'}
return{base_latency_ms:hasB?b*1000:null,output_latency_ms:hasO?o*1000:null,detected_output_latency_ms:used?used*1000:null,source_api:source,calculation:calc}}
function readLatency(){ctx=getCtx(core);if(!ctx)return false;latencyMeta=latencySnapshot(ctx);if(Number.isFinite(latencyMeta.detected_output_latency_ms)&&latencyMeta.detected_output_latency_ms>1&&latencyMeta.detected_output_latency_ms<500){baseMs=latencyMeta.detected_output_latency_ms;lat.textContent=fmt(baseMs);sourceEl.textContent='Fuente: '+latencyMeta.source_api+' · cálculo: '+latencyMeta.calculation+'. Beat/tactus analítico intacto.';statusEl.textContent='compensación activa';apply();return true}return false}
function boundedPoll(){clearTimeout(pollTimer);pollDeadline=performance.now()+4000;const tick=()=>{core=deepest();if(core){installTone();if(readLatency())return}if(performance.now()<pollDeadline){statusEl.textContent='leyendo latencia…';pollTimer=setTimeout(tick,150)}else{statusEl.textContent='latencia no disponible';lat.textContent='no expuesta';sourceEl.textContent='Fuente: API de latencia no disponible tras 4 s. Ajuste fino permanece disponible; análisis intacto.'}};tick()}
function onRealPlay(){statusEl.textContent='Play detectado';core=deepest();if(!core)return boundedPoll();installTone();ctx=getCtx(core);try{if(ctx&&ctx.state==='suspended'&&ctx.resume){Promise.resolve(ctx.resume()).finally(()=>setTimeout(()=>{if(!readLatency())boundedPoll()},30));return}}catch(_){}setTimeout(()=>{if(!readLatency())boundedPoll()},30)}
function hookPlay(){if(playHooked)return true;core=deepest();if(!core)return false;try{const p=core.document&&core.document.getElementById('player');if(!p)return false;p.addEventListener('play',onRealPlay);playHooked=true;statusEl.textContent='listo · pulsa Play';return true}catch(_){return false}}
function installTone(){if(!core||patched)return false;try{core.eval(`(function(){if(window.__hlAutoCompTone1910)return;window.__hlAutoCompTone1910=true;window.__hlPlaybackOffset=0;let oldTone=tone;tone=function(at,f,v,d){let o=window.__hlPlaybackOffset||0;return oldTone(Math.max(ctx.currentTime+.002,at+o),f,v,d)};})();`);const os=core.summary,od=core.dl;const telemetry=()=>({detected_output_latency_ms:Number.isFinite(latencyMeta.detected_output_latency_ms)?+latencyMeta.detected_output_latency_ms.toFixed(3):null,base_compensation_ms:+baseMs.toFixed(3),fine_adjustment_ms:+fineMs.toFixed(3),total_compensation_ms:+(baseMs+fineMs).toFixed(3),base_latency_ms:Number.isFinite(latencyMeta.base_latency_ms)?+latencyMeta.base_latency_ms.toFixed(3):null,output_latency_ms:Number.isFinite(latencyMeta.output_latency_ms)?+latencyMeta.output_latency_ms.toFixed(3):null,source_api:latencyMeta.source_api,calculation:latencyMeta.calculation,scope:'playback_only'});if(typeof os==='function')core.summary=function(obj){let x=os(obj);x.output_compensation=telemetry();x.notes=[...(x.notes||[]),'auto_output_comp_lifecycle_v1_9_10'];return x};if(typeof od==='function')core.dl=function(obj,s){let x={...obj,output_compensation:telemetry()};x.notes=[...(x.notes||[]),'auto_output_comp_lifecycle_v1_9_10'];return od(x,s)};patched=true;return true}catch(_){return false}}
function bootstrap(){core=deepest();if(core){installTone();if(hookPlay())return}setTimeout(bootstrap,150)}
outer.addEventListener('load',()=>setTimeout(bootstrap,350));setTimeout(bootstrap,900);
</script></body></html>

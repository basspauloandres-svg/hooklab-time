<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.45 Native Playback Baseline</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:22px;margin:0 0 6px}.muted{font-size:13px;color:#666}input,button,audio{font-size:16px}input,audio{width:100%}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:4px}.secondary{background:#e7e7e4;color:#222}.grid{display:grid;grid-template-columns:auto auto 1fr;gap:8px}.m{background:#f5f5f3;border-radius:10px;padding:10px;margin-top:8px}.m b{display:block;font-size:17px}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.45 — Native Playback Baseline</h1><p class="muted">Baseline audible para Safari. 1 HTML · 1 HTMLAudioElement · 0 AudioContext · 0 Web Audio · 0 iframe · 0 scheduler · 0 análisis.</p><input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg"><span id="status" class="muted"> esperando audio</span></div><div class="card"><audio id="player" controls preload="metadata"></audio><div class="grid" style="margin-top:10px"><button id="play" disabled>Play</button><button id="stop" class="secondary" disabled>Stop</button><input id="seek" type="range" min="0" max="1000" value="0"></div><label style="display:block;margin-top:12px">Pista <b id="tv">100%</b><input id="trackVol" type="range" min="0" max="100" value="100"></label><div class="m">Ruta audible<b>HTMLAudioElement → browser output</b></div><p id="rt" class="muted">runtime nativo no iniciado</p></div><div class="card"><button id="export" class="secondary">Exportar auditoría baseline</button></div></main><script>
const $=x=>document.getElementById(x);const p=$('player');let file=null,url=null,records=[];
function rec(kind,extra={}){records.push({kind,t_perf_ms:performance.now(),currentTime:p.currentTime||0,paused:p.paused,volume:p.volume,muted:p.muted,playbackRate:p.playbackRate,...extra})}
$('audioFile').onchange=e=>{file=e.target.files&&e.target.files[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);p.src=url;p.load();p.volume=1;p.muted=false;p.playbackRate=1;p.defaultPlaybackRate=1;$('play').disabled=false;$('stop').disabled=false;$('status').textContent=' '+file.name+' · audio cargado';$('rt').textContent='1 HTMLAudioElement · Web Audio OFF · playbackRate 1';rec('file_selected',{name:file.name,type:file.type,size:file.size})};
$('play').onclick=async()=>{try{if(p.paused){await p.play();$('play').textContent='Pausa';rec('play_command')}else{p.pause();$('play').textContent='Play';rec('pause_command')}}catch(e){$('status').textContent=' Error: '+e.message;rec('play_error',{error:e.message})}};
$('stop').onclick=()=>{p.pause();p.currentTime=0;$('play').textContent='Play';$('seek').value=0;rec('stop_command')};
p.addEventListener('loadedmetadata',()=>{$('seek').max=Math.max(1,Math.round((p.duration||0)*1000));rec('loadedmetadata',{duration_s:p.duration})});
p.addEventListener('timeupdate',()=>{if(document.activeElement!==$('seek'))$('seek').value=Math.round((p.currentTime||0)*1000)});
p.addEventListener('playing',()=>{rec('playing_event');$('play').textContent='Pausa'});p.addEventListener('pause',()=>rec('pause_event'));p.addEventListener('ended',()=>{$('play').textContent='Play';rec('ended_event')});
$('seek').oninput=()=>{p.currentTime=+$('seek').value/1000;rec('seek',{to_s:p.currentTime})};
$('trackVol').oninput=e=>{p.volume=+e.target.value/100;p.muted=false;$('tv').textContent=e.target.value+'%';rec('volume_change',{requested:p.volume})};
$('export').onclick=()=>{let payload={schema:'HookLab-TIME-v1.9.45-native-playback-baseline',build_id:'v1.9.45-native-playback-baseline',architecture:{runtime_count:1,native_media_element_count:1,webaudio:false,audio_context_count:0,iframe_count:0,scheduler:false,analysis:false,audible_route:'HTMLAudioElement>browser output'},userAgent:navigator.userAgent,file:file&&file.name,duration_s:Number.isFinite(p.duration)?p.duration:null,records};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HookLab_native_playback_baseline_v1_9_45.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>

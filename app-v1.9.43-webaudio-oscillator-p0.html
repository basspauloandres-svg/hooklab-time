<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.43 WebAudio Oscillator P0</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button{font-size:16px;padding:12px 16px;border:0;border-radius:10px;background:#222;color:#fff;margin:4px}.secondary{background:#e7e7e4;color:#222}.muted{font-size:13px;color:#666}.m{background:#f5f5f3;border-radius:10px;padding:10px;margin-top:8px}.m b{display:block;font-size:17px}</style></head><body><main><div class="card"><h1 style="font-size:22px;margin:0 0 6px">HookLab TIME v1.9.43 — Web Audio Oscillator P0</h1><p class="muted">Microtest aislado. Sin archivo musical, AudioBuffer, PRE, fader, scheduler, iframe ni análisis. Única ruta: OscillatorNode → GainNode → destination.</p><button id="arm">1. Activar AudioContext</button><button id="tone" disabled>2. Reproducir tono 1 s</button><div class="m">Estado<b id="state">sin iniciar</b></div><div class="m">Ruta<b>oscillator → gain(0.20) → destination</b></div><p id="info" class="muted"></p></div><div class="card"><button id="export" class="secondary">Exportar diagnóstico</button></div></main><script>
const $=x=>document.getElementById(x);let ctx=null,records=[];
function snapshot(kind,extra={}){let r={kind,t_perf_ms:performance.now(),ctx_state:ctx?ctx.state:null,sample_rate:ctx?ctx.sampleRate:null,baseLatency:ctx&&ctx.baseLatency!=null?ctx.baseLatency:null,outputLatency:ctx&&ctx.outputLatency!=null?ctx.outputLatency:null,...extra};records.push(r);return r}
async function arm(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')await ctx.resume();$('state').textContent=ctx.state;$('tone').disabled=ctx.state!=='running';$('info').textContent=`sampleRate ${ctx.sampleRate} Hz · baseLatency ${ctx.baseLatency!=null?(ctx.baseLatency*1000).toFixed(2)+' ms':'n/d'} · outputLatency ${ctx.outputLatency!=null?(ctx.outputLatency*1000).toFixed(2)+' ms':'n/d'}`;snapshot('armed')}catch(e){$('state').textContent='ERROR: '+e.message;snapshot('arm_error',{error:e.message})}}
$('arm').onclick=arm;
$('tone').onclick=async()=>{try{if(!ctx||ctx.state!=='running')await arm();let now=ctx.currentTime+.03,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(440,now);g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(.20,now+.02);g.gain.setValueAtTime(.20,now+.90);g.gain.linearRampToValueAtTime(.0001,now+1);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+1.02);snapshot('tone_start',{frequency_hz:440,gain:.20,scheduled_at_ctx_s:now,duration_s:1});$('state').textContent='tono programado · '+ctx.state;o.onended=()=>{snapshot('tone_ended');$('state').textContent='tono finalizado · '+ctx.state}}catch(e){$('state').textContent='ERROR tono: '+e.message;snapshot('tone_error',{error:e.message})}};
$('export').onclick=()=>{let payload={schema:'HookLab-TIME-v1.9.43-webaudio-oscillator-p0',build_id:'v1.9.43-webaudio-oscillator-p0',architecture:{runtime_count:1,audio_context_count:ctx?1:0,file_audio:false,audio_buffer:false,prefader:false,scheduler:false,iframe_count:0,route:'OscillatorNode>GainNode(0.20)>destination'},records};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HookLab_webaudio_oscillator_P0_v1_9_43.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>

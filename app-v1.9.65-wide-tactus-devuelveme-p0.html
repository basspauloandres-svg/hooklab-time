<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>TIME v1.9.65 Wide Tactus P0</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input{font-size:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:5px}audio{width:100%}.muted{font-size:13px;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#f5f5f3;border-radius:10px;padding:10px}.m b{display:block;font-size:17px}progress{width:100%}</style></head><body><main><div class="card"><h1>TIME v1.9.65 — Wide Tactus</h1><p class="muted">Derivado directamente de v1.9.65. Único cambio: adquisición inicial ampliada a 60–176 BPM. Sin MIDI, melodía, SEARCH/LOCK ni reacquisición.</p><input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><button id="build">Detectar beat y construir</button><progress id="prog" max="100" value="0"></progress><p id="state">Esperando audio.</p></div><div class="card"><audio id="player" controls></audio></div><div class="card"><div class="grid"><div class="m">BPM inicial<b id="ibpm">—</b></div><div class="m">Ancla<b id="anchor">—</b></div><div class="m">BPM mediano<b id="mbpm">—</b></div><div class="m">Rango<b id="range">—</b></div><div class="m">Score<b id="score">—</b></div><div class="m">Offset<b>0 ms</b></div></div><button id="export" disabled>Exportar diagnóstico</button></div></main><script>
const $=id=>document.getElementById(id);let file=null,buf=null,urlMix=null,meta=null;const SR=48000,TG=.70,CG=.20;
function median(a){if(!a.length)return null;let z=[...a].sort((a,b)=>a-b),m=z.length>>1;return z.length%2?z[m]:(z[m-1]+z[m])/2}function mono(b){let y=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){let x=b.getChannelData(c);for(let i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}async function decode(){let fs=$('file').files;if(!fs.length)throw Error('Selecciona audio');file=fs[0];let AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),b=await ac.decodeAudioData((await file.arrayBuffer()).slice(0));try{await ac.close()}catch(_){}return b}function onsetTimes(b,dur){let x=mono(b),sr=b.sampleRate,hop=Math.max(1,Math.round(sr*.005)),win=Math.max(16,Math.round(sr*.03)),env=[];for(let a=0;a+win<x.length&&a/sr<dur;a+=hop){let d=0,p=x[a];for(let i=a+1;i<a+win;i+=2){let v=x[i];d+=Math.abs(v-p);p=v}env.push(d)}let gm=median(env)||1,out=[];for(let i=2;i<env.length-2;i++){let q=[];for(let j=Math.max(0,i-20);j<=Math.min(env.length-1,i+20);j++)q.push(env[j]);let lm=median(q)||gm,th=lm*1.35+gm*.08;if(env[i]>th&&env[i]>=env[i-1]&&env[i]>env[i+1])out.push({t:i*hop/sr,s:Math.min(2,env[i]/Math.max(th,1e-9))})}return out}
function acquire(os){let xs=os.filter(o=>o.t>=.2&&o.t<=12);if(xs.length<6)throw Error('Ataques insuficientes');let best={score:-1,p:.5,a:.5,hits:0};for(let p=.34;p<=1.0;p+=.002){for(const seed of xs.slice(0,Math.min(24,xs.length))){let a=seed.t,s=0,w=0,h=0;for(const o of xs){let k=Math.round((o.t-a)/p),pred=a+k*p,d=Math.abs(o.t-pred),tol=Math.min(.09,p*.18);if(d<=tol){s+=o.s*(1-d/tol);h++}w+=o.s}let sc=.72*s/Math.max(.001,w)+.28*Math.min(1,h/16);if(sc>best.score)best={score:sc,p,a,hits:h}}}while(best.a-best.p>.15)best.a-=best.p;while(best.a<.15)best.a+=best.p;return best}function nearest(xs,t,w){let best=null,bd=w;for(const o of xs){if(o.t<t-w)continue;if(o.t>t+w)break;let d=Math.abs(o.t-t);if(d<bd){best=o.t;bd=d}}return best}function adaptive(os,dur,p0,a0){let t=a0,p=p0,out=[t],rows=[{t,period:p,bpm:60/p,error_ms:null,observed:false}],guard=0;while(t+p<dur&&guard++<5000){let pred=t+p,obs=nearest(os,pred,Math.min(.09,p*.20)),err=obs==null?0:obs-pred,next=pred+.28*err,nextP=p+.045*err;nextP=Math.max(.30,Math.min(1.05,nextP));t=next;p=nextP;out.push(+t.toFixed(6));rows.push({t:+t.toFixed(6),period:+p.toFixed(6),bpm:+(60/p).toFixed(3),error_ms:obs==null?null:+(err*1000).toFixed(2),observed:obs!=null})}return{times:out,rows}}function wav(b){let ch=b.numberOfChannels,n=b.length,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab),p=0;let s=x=>{for(let i=0;i<x.length;i++)v.setUint8(p++,x.charCodeAt(i))},u32=x=>{v.setUint32(p,x,true);p+=4},u16=x=>{v.setUint16(p,x,true);p+=2};s('RIFF');u32(36+n*ch*2);s('WAVEfmt ');u32(16);u16(1);u16(ch);u32(b.sampleRate);u32(b.sampleRate*ch*2);u16(ch*2);u16(16);s('data');u32(n*ch*2);for(let i=0;i<n;i++)for(let c=0;c<ch;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}async function mix(times,dur){let O=window.OfflineAudioContext||window.webkitOfflineAudioContext,o=new O(2,Math.ceil(dur*SR),SR),src=o.createBufferSource(),g=o.createGain();src.buffer=buf;g.gain.value=TG;src.connect(g);g.connect(o.destination);src.start(0);for(const t of times){let q=o.createOscillator(),cg=o.createGain();q.frequency.value=900;cg.gain.setValueAtTime(.0001,t);cg.gain.linearRampToValueAtTime(CG,t+.003);cg.gain.exponentialRampToValueAtTime(.0001,t+.04);q.connect(cg);cg.connect(o.destination);q.start(t);q.stop(t+.05)}return wav(await o.startRendering())}
$('build').onclick=async()=>{try{$('build').disabled=true;$('prog').value=5;$('state').textContent='Decodificando…';let t0=performance.now();buf=await decode();let dur=buf.duration;$('prog').value=25;let ons=onsetTimes(buf,dur);$('prog').value=42;let aq=acquire(ons);$('ibpm').textContent=(60/aq.p).toFixed(3);$('anchor').textContent=aq.a.toFixed(3)+' s';$('score').textContent=aq.score.toFixed(4);$('prog').value=55;let ag=adaptive(ons,dur,aq.p,aq.a),bp=ag.rows.map(r=>r.bpm),mb=median(bp),mn=Math.min(...bp),mx=Math.max(...bp);$('mbpm').textContent=mb.toFixed(3);$('range').textContent=mn.toFixed(2)+'–'+mx.toFixed(2);$('prog').value=70;let blob=await mix(ag.times,dur);if(urlMix)URL.revokeObjectURL(urlMix);urlMix=URL.createObjectURL(blob);$('player').src=urlMix;$('player').load();meta={source_name:file.name,duration_s:dur,onset_count:ons.length,derived_directly_from:'v1.9.65',changed_variable_only:'acquisition_period_max_0.75_to_1.00_and_tracker_bound',automatic_acquisition:{period_s:aq.p,anchor_s:aq.a,initial_bpm:60/aq.p,score:aq.score,hits:aq.hits},adaptive_median_bpm:mb,adaptive_min_bpm:mn,adaptive_max_bpm:mx,adaptive_times_s:ag.times,adaptive_rows:ag.rows,manual_offset_ms:0,render_ms:performance.now()-t0};$('prog').value=100;$('state').textContent='LISTO · v1.9.65 con rango ampliado.';$('export').disabled=false}catch(e){$('state').textContent='ERROR · '+e.message}finally{$('build').disabled=false}};$('export').onclick=()=>{let b=new Blob([JSON.stringify({schema:'TIME-v1.9.65-wide-tactus-p0',meta},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='TIME_v1_9_65_wide_tactus.json';a.click()};</script></body></html>

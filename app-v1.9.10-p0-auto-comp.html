const outer=document.getElementById('outer'),statusEl=document.getElementById('status'),detEl=document.getElementById('det'),baseEl=document.getElementById('base'),totalEl=document.getElementById('total'),fine=document.getElementById('fine'),finev=document.getElementById('finev'),note=document.getElementById('note');

fine.oninput=()=>{fineMs=Number(fine.value);apply()};

function pollBounded(){clearTimeout(pollTimer);pollUntil=performance.now()+4000;const tick=()=>{core=deep();if(core){if(!patched)patch();if(readLatency())return}if(performance.now()<pollUntil){statusEl.textContent='leyendo latencia…';pollTimer=setTimeout(tick,120)}else{statusEl.textContent='latencia no disponible';detEl.textContent='no expuesta';note.textContent='WebAudio no expuso una latencia utilizable en 4 s. No se altera beat/tactus; use ajuste fino solo como evidencia residual.'}};tick()}

function patch(){if(!core||patched)return false;try{
// Wait until v1.9.6 export preservation is installed; this prevents race conditions that produced null audits.
if(!core.__hl196)return false;
core.eval(`(function(){if(window.__hlP0AutoComp)return;window.__hlP0AutoComp=true;window.__hlPlaybackOffset=0;let oldTone=tone;tone=function(at,f,v,d){let o=window.__hlPlaybackOffset||0;return oldTone(Math.max(ctx.currentTime+.002,at+o),f,v,d)};})();`);
const os=core.summary,od=core.dl;
core.summary=function(obj){let x=os(obj);if(x&&x.latency_phase_audit&&x.latency_phase_audit.tactus_events>0)lastAudit=x.latency_phase_audit;x.output_compensation=telemetry();x.notes=[...(x.notes||[]),'p0_auto_output_comp_v1_9_10'];return x};

// Refresh the v1.9.6 audit from the full raw object before exporting, but preserve the full object itself.

let x={...obj,output_compensation:telemetry()};

if(preserved)x.latency_phase_audit=preserved;

return od(x,s)};
patched=true;return true}catch(_){return false}}
function boot(){core=deep();if(core){if(!patched)patch();if(hookPlay()&&patched)return}setTimeout(boot,140)}

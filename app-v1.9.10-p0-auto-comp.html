<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.10 P0 AUTO COMP</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f2f2f0}.bar{position:sticky;top:0;z-index:999999;background:#fff;padding:10px 12px;border-bottom:1px solid #ddd}.bar b{display:block;margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.m{background:#f5f5f3;border-radius:8px;padding:7px}.m span{display:block;font-weight:700;font-variant-numeric:tabular-nums}.row{display:grid;grid-template-columns:105px 1fr 82px;gap:8px;align-items:center;margin-top:8px}.row input{width:100%}.small{font-size:12px;color:#666;margin-top:6px}iframe{border:0;width:100%;height:calc(100vh - 205px);display:block}</style></head><body><div class="bar"><b>v1.9.10 PRETEST · P0 compensación automática de salida</b><div class="grid"><div class="m">Estado<span id="status">esperando Play…</span></div><div class="m">Latencia detectada<span id="det">—</span></div><div class="m">Compensación base<span id="base">0.0 ms</span></div><div class="m">Compensación total<span id="total">0.0 ms</span></div></div><div class="row"><label>Ajuste fino</label><input id="fine" type="range" min="-20" max="20" step="0.1" value="0"><span id="finev">0.0 ms</span></div><div class="small" id="note">La compensación modifica únicamente la claqueta audible. Beat/tactus analítico permanece intacto.</div></div><iframe id="outer" src="app-v1.9.6-latency-audit-exportfix.html?build=20260820-1910p0" allow="autoplay"></iframe><script>
const outer=document.getElementById('outer'),statusEl=document.getElementById('status'),detEl=document.getElementById('det'),baseEl=document.getElementById('base'),totalEl=document.getElementById('total'),fine=document.getElementById('fine'),finev=document.getElementById('finev'),note=document.getElementById('note');
let core=null,baseMs=0,fineMs=0,patched=false,hooked=false,pollUntil=0,pollTimer=null,latency={detected_latency_ms:null,base_latency_ms:null,output_latency_ms:null,source_api:'unavailable'};
function deep(){try{let w=outer.contentWindow;for(let k=0;k<10;k++){let q=w.document.getElementById('outer')||w.document.getElementById('app');if(!q||!q.contentWindow)break;w=q.contentWindow}return w}catch(_){return null}}
function getCtx(){try{if(core&&core.ctx)return core.ctx;if(core&&core.eval)return core.eval('typeof ctx!=="undefined"?ctx:null')}catch(_){}return null}
function fmt(v){return Number.isFinite(v)?v.toFixed(1)+' ms':'—'}
function apply(){if(!core)return;const total=baseMs+fineMs;core.__hlPlaybackOffset=total/1000;baseEl.textContent=(baseMs>=0?'+':'')+baseMs.toFixed(1)+' ms';finev.textContent=(fineMs>=0?'+':'')+fineMs.toFixed(1)+' ms';totalEl.textContent=(total>=0?'+':'')+total.toFixed(1)+' ms'}
fine.oninput=()=>{fineMs=Number(fine.value);apply()};
function readLatency(){const c=getCtx();if(!c)return false;const b=Number(c.baseLatency),o=Number(c.outputLatency);const hb=Number.isFinite(b)&&b>0,ho=Number.isFinite(o)&&o>0;let ms=null,src='unavailable';if(hb&&ho){ms=(b+o)*1000;src='baseLatency+outputLatency'}else if(ho){ms=o*1000;src='outputLatency'}else if(hb){ms=b*1000;src='baseLatency'}latency={detected_latency_ms:Number.isFinite(ms)?ms:null,base_latency_ms:hb?b*1000:null,output_latency_ms:ho?o*1000:null,source_api:src};if(!(Number.isFinite(ms)&&ms>1&&ms<500))return false;baseMs=ms;detEl.textContent=fmt(ms);statusEl.textContent='compensación automática activa';note.textContent='Fuente: '+src+'. Base automática = latencia detectada; ajuste fino residual inicia en 0.0 ms.';apply();return true}
function pollBounded(){clearTimeout(pollTimer);pollUntil=performance.now()+4000;const tick=()=>{core=deep();if(core){patch();if(readLatency())return}if(performance.now()<pollUntil){statusEl.textContent='leyendo latencia…';pollTimer=setTimeout(tick,120)}else{statusEl.textContent='latencia no disponible';detEl.textContent='no expuesta';note.textContent='WebAudio no expuso una latencia utilizable en 4 s. No se altera beat/tactus; use ajuste fino solo como evidencia residual.'}};tick()}
function onPlay(){statusEl.textContent='Play detectado';core=deep();if(!core)return pollBounded();patch();const c=getCtx();try{if(c&&c.state==='suspended'&&c.resume){Promise.resolve(c.resume()).finally(()=>setTimeout(()=>{if(!readLatency())pollBounded()},25));return}}catch(_){}setTimeout(()=>{if(!readLatency())pollBounded()},25)}

function patch(){if(!core||patched)return false;try{core.eval(`(function(){if(window.__hlP0AutoComp)return;window.__hlP0AutoComp=true;window.__hlPlaybackOffset=0;let oldTone=tone;tone=function(at,f,v,d){let o=window.__hlPlaybackOffset||0;return oldTone(Math.max(ctx.currentTime+.002,at+o),f,v,d)};})();`);const os=core.summary,od=core.dl;const tel=()=>({detected_latency_ms:Number.isFinite(latency.detected_latency_ms)?+latency.detected_latency_ms.toFixed(3):null,base_output_compensation_ms:+baseMs.toFixed(3),manual_fine_adjustment_ms:+fineMs.toFixed(3),total_output_compensation_ms:+(baseMs+fineMs).toFixed(3),base_latency_ms:Number.isFinite(latency.base_latency_ms)?+latency.base_latency_ms.toFixed(3):null,output_latency_ms:Number.isFinite(latency.output_latency_ms)?+latency.output_latency_ms.toFixed(3):null,source_api:latency.source_api,scope:'click_playback_only'});if(typeof os==='function')core.summary=function(obj){let x=os(obj);x.output_compensation=tel();x.notes=[...(x.notes||[]),'p0_auto_output_comp_v1_9_10'];return x};if(typeof od==='function')core.dl=function(obj,s){let x={...obj,output_compensation:tel()};x.notes=[...(x.notes||[]),'p0_auto_output_comp_v1_9_10'];return od(x,s)};patched=true;return true}catch(_){return false}}

outer.addEventListener('load',()=>setTimeout(boot,350));setTimeout(boot,900);
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>MIE Oracle Melody v0.1.5</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input{font-size:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:6px 4px 6px 0}button:disabled{opacity:.4}audio{width:100%}.muted{color:#666;font-size:14px}</style></head><body><main><div class="card"><h1>MIE Oracle Melody v0.1.5</h1><p class="muted">Carga restaurada desde el baseline iPhone v1.9.61. Selecciona Voz1, decodifica y luego analiza.</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><br><button id="decode">1. Decodificar</button><p id="decodeState" class="muted">Sin decodificar.</p><button id="analyze" disabled>2. Analizar melodía</button><p id="analyzeState" class="muted">Sin análisis.</p><audio id="out" controls></audio></div></main><script>var input=document.getElementById('f'),out=document.getElementById('out'),buf=null,outUrl=null;function getFile(){var fs=input.files;if(!fs||fs.length<1)throw new Error('Sin archivo');return fs[0]}document.getElementById('decode').onclick=async function(){try{var f=getFile(),AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),ab=await f.arrayBuffer(),t=performance.now();buf=await ac.decodeAudioData(ab.slice(0));document.getElementById('decodeState').textContent='DECODE OK · '+f.name+' · '+buf.duration.toFixed(3)+' s · '+buf.sampleRate+' Hz · '+(performance.now()-t).toFixed(1)+' ms';document.getElementById('analyze').disabled=false;try{await ac.close()}catch(_){}}catch(e){document.getElementById('decodeState').textContent='ERROR DECODE · '+e.name+' · '+e.message}};function hz(m){return 440*Math.pow(2,(m-69)/12)}function mono(b){var y=new Float32Array(b.length);for(var c=0;c<b.numberOfChannels;c++){var x=b.getChannelData(c);for(var i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function wav(ev,start,end){var SR=44100,N=Math.ceil((end-start)*SR),y=new Float32Array(N);for(var q of ev){var A=Math.max(0,Math.floor((q.on-start)*SR)),B=Math.min(N,Math.floor((q.off-start)*SR)),f=hz(q.m);for(var i=A;i<B;i++){var t=(i-A)/SR,en=(1-Math.exp(-t/.006))*Math.exp(-t/1.8);y[i]+=.16*en*Math.sin(2*Math.PI*f*t)}}var mx=0;for(var v of y)mx=Math.max(mx,Math.abs(v));var g=.88/Math.max(mx,1e-9),ab=new ArrayBuffer(44+y.length*2),dv=new DataView(ab),p=0;function S(s){for(var c of s)dv.setUint8(p++,c.charCodeAt(0))}function U(n){dv.setUint32(p,n,true);p+=4}function H(n){dv.setUint16(p,n,true);p+=2}S('RIFF');U(36+y.length*2);S('WAVEfmt ');U(16);H(1);H(1);U(SR);U(SR*2);H(2);H(16);S('data');U(y.length*2);for(var x of y){x=Math.max(-1,Math.min(1,x*g));dv.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}document.getElementById('analyze').onclick=async function(){try{if(!buf)throw new Error('Primero pulsa Decodificar');var START=13.3,END=Math.min(40.7,buf.duration),x=mono(buf),sr=buf.sampleRate,hop=Math.floor(sr*.0464),N=Math.floor(sr*.0928),fr=[];for(var a=Math.floor(START*sr);a+N<Math.floor(END*sr);a+=hop){var best=null;for(var m=45;m<=76;m++){var f=hz(m),re=0,im=0,ws=0;for(var n=0;n<N;n+=4){var j=a+n,w=.5-.5*Math.cos(2*Math.PI*n/(N-1)),v=x[j]*w,ph=2*Math.PI*f*n/sr;re+=v*Math.cos(ph);im-=v*Math.sin(ph);ws+=w}var e=Math.hypot(re,im)/Math.max(1,ws);if(!best||e>best.e)best={m:m,e:e,t:a/sr}}fr.push(best)}var ev=[],cur=null;for(var q of fr){if(!cur||q.m!==cur.m){if(cur)ev.push(cur);cur={on:q.t,off:q.t+.0464,m:q.m}}else cur.off=q.t+.0464}if(cur)ev.push(cur);ev=ev.filter(function(e){return e.off-e.on>=.07});var blob=wav(ev,START,END);if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(blob);out.src=outUrl;out.load();document.getElementById('analyzeState').textContent='ANÁLISIS OK · '+ev.length+' eventos · pulsa Play';}catch(e){document.getElementById('analyzeState').textContent='ERROR ANÁLISIS · '+e.name+' · '+e.message}};</script></body></html>

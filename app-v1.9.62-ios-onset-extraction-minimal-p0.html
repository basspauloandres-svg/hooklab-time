<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.62 Onset Extraction mínimo</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input{font-size:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:6px 4px 6px 0}.muted{color:#666;font-size:14px}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f3;border-radius:10px;padding:10px}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.62 — Extracción de ataques mínima</h1><p class="muted">Añade una sola capa respecto de la ruta ya validada: extracción de ataques sobre 30 s. Sin adquisición automática, sin seguimiento de tempo y sin claqueta.</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><br><button id="decode">1. Decodificar</button><p id="decodeState" class="muted">Sin decodificar.</p><button id="onsets">2. Extraer ataques 30 s</button><p id="onsetState" class="muted">Sin analizar.</p><pre id="out">—</pre></div></main><script>
var input=document.getElementById('f'),buf=null;
function getFile(){var fs=input.files;if(!fs||fs.length<1)throw new Error('Sin archivo');return fs[0]}
function median(a){if(!a.length)return null;var z=a.slice().sort(function(x,y){return x-y}),m=z.length>>1;return z.length%2?z[m]:(z[m-1]+z[m])/2}
function mono(b){var y=new Float32Array(b.length);for(var c=0;c<b.numberOfChannels;c++){var x=b.getChannelData(c);for(var i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}
async function decode(){var f=getFile(),AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),ab=await f.arrayBuffer(),t=performance.now();buf=await ac.decodeAudioData(ab.slice(0));document.getElementById('decodeState').textContent='DECODE OK · '+buf.duration.toFixed(6)+' s · '+buf.sampleRate+' Hz · '+(performance.now()-t).toFixed(1)+' ms';try{await ac.close()}catch(_){}}
function onsetTimes(b,dur){var x=mono(b),sr=b.sampleRate,hop=Math.max(1,Math.round(sr*.005)),win=Math.max(16,Math.round(sr*.03)),env=[];for(var a=0;a+win<x.length&&a/sr<dur;a+=hop){var d=0,prev=x[a];for(var i=a+1;i<a+win;i+=2){var v=x[i];d+=Math.abs(v-prev);prev=v}env.push(d)}var med=median(env)||1,out=[];for(var k=2;k<env.length-2;k++){var local=[];for(var j=Math.max(0,k-20);j<=Math.min(env.length-1,k+20);j++)local.push(env[j]);var lm=median(local)||med,thr=lm*1.35+med*.08;if(env[k]>thr&&env[k]>=env[k-1]&&env[k]>env[k+1])out.push({t:k*hop/sr,s:Math.min(2,env[k]/Math.max(thr,1e-9))})}return out}
document.getElementById('decode').onclick=async function(){try{await decode()}catch(e){document.getElementById('decodeState').textContent='ERROR DECODE · '+e.name+' · '+e.message}};
document.getElementById('onsets').onclick=function(){try{if(!buf)throw new Error('Primero pulsa Decodificar');var t=performance.now(),dur=Math.min(30,buf.duration),ons=onsetTimes(buf,dur),ms=performance.now()-t,first=ons.slice(0,20).map(function(o){return o.t.toFixed(3)});document.getElementById('onsetState').textContent='ONSETS OK · '+ons.length+' ataques · '+ms.toFixed(1)+' ms';document.getElementById('out').textContent='Primeros ataques (s):\n'+first.join(', ')}catch(e){document.getElementById('onsetState').textContent='ERROR ONSETS · '+e.name+' · '+e.message}};
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>MIE Unified Transcription v0.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:22px}.muted{font-size:13px;color:#666}button,input,audio,progress{font-size:16px;width:100%;box-sizing:border-box}button{padding:12px;border:0;border-radius:10px;background:#222;color:#fff;margin-top:8px}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#f5f5f3;border-radius:10px;padding:10px}.m b{display:block;font-size:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>MIE Unified Transcription v0.1</h1><p class="muted">Un único audio → M + H + T → resíntesis. Prototipo limpio: no contiene P30, armonía congelada ni datos del tema de referencia.</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><button id="decode">1. Decodificar</button><p id="ds" class="muted">Sin decodificar.</p><button id="run" disabled>2. Analizar M + H + T</button><progress id="pr" max="100" value="0"></progress><p id="st" class="muted">Esperando audio.</p></div><div class="card"><div class="grid"><div class="m">Melodía<b id="mn">—</b></div><div class="m">Armonía<b id="hn">—</b></div><div class="m">Beat<b id="tn">—</b></div></div></div><div class="card"><b>Resíntesis unificada</b><audio id="out" controls></audio><button id="ex" disabled>Exportar JSON</button></div></main><script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.min.js"></script><script>var $=x=>document.getElementById(x),input=$('f'),buf=null,result=null,melS=null,beatS=null;const MEL_URL='https://raw.githubusercontent.com/danigb/beat-this-rs/main/models/mel_spectrogram.onnx',BEAT_URL='https://raw.githubusercontent.com/danigb/beat-this-rs/main/models/beat_this_small.onnx';function getFile(){var fs=input.files;if(!fs||!fs.length)throw Error('Sin archivo');return fs[0]}$('decode').onclick=async function(){try{var f=getFile(),AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),ab=await f.arrayBuffer(),t=performance.now();buf=await ac.decodeAudioData(ab.slice(0));$('ds').textContent='DECODE OK · '+buf.duration.toFixed(3)+' s · '+buf.sampleRate+' Hz · '+(performance.now()-t).toFixed(0)+' ms';$('run').disabled=false;try{await ac.close()}catch(_){}}catch(e){$('ds').textContent='ERROR DECODE · '+e.name+' · '+e.message}};function mono(b){let y=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){let x=b.getChannelData(c);for(let i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function rs(x,sr,to=22050){if(sr===to)return x;let n=Math.floor(x.length*to/sr),y=new Float32Array(n),r=sr/to;for(let i=0;i<n;i++){let p=i*r,a=Math.floor(p),f=p-a;y[i]=x[a]*(1-f)+x[Math.min(x.length-1,a+1)]*f}return y}function hz(m){return 440*Math.pow(2,(m-69)/12)}function goertzel(x,a,N,m,sr){let f=hz(m),re=0,im=0,ws=0;for(let n=0;n<N;n+=2){let j=a+n;if(j>=x.length)break,w=.5-.5*Math.cos(2*Math.PI*n/(N-1)),v=x[j]*w,p=2*Math.PI*f*n/sr;re+=v*Math.cos(p);im-=v*Math.sin(p);ws+=w}return Math.hypot(re,im)/Math.max(1,ws)}function melody(x,sr,dur){let N=2048,hop=1024,fr=[];for(let a=0;a+N<x.length;a+=hop){let best={m:48,e:0},second=0;for(let m=45;m<=79;m++){let e=goertzel(x,a,N,m,sr);if(e>best.e){second=best.e;best={m,e}}else if(e>second)second=e}fr.push({t:a/sr,m:best.m,e:best.e,ratio:best.e/(second+1e-9)})}let es=fr.map(q=>q.e).sort((a,b)=>a-b),thr=(es[Math.floor(es.length*.45)]||0)*.75,ev=[],cur=null;for(let q of fr){if(q.e<thr||q.ratio<1.03){if(cur){ev.push(cur);cur=null}continue}if(!cur||q.m!==cur.m){if(cur)ev.push(cur);cur={on:q.t,off:q.t+hop/sr,m:q.m}}else cur.off=q.t+hop/sr}if(cur)ev.push(cur);return ev.filter(e=>e.off-e.on>=.07)}function harmony(x,sr,beats,dur){let bounds=beats.length>3?beats:[...Array(Math.ceil(dur/.86)+1)].map((_,i)=>i*.86),out=[];for(let k=0;k<bounds.length-1;k++){let a=bounds[k],b=bounds[k+1];if(b-a<.15)continue;let N=4096,pc=Array(12).fill(0),mid=Array(85).fill(0),n=0;for(let t=a;t+N/sr<b;t+=2048/sr){let ix=Math.floor(t*sr);for(let m=36;m<=84;m++){let e=goertzel(x,ix,N,m,sr);pc[m%12]+=e;mid[m]+=e}n++}if(!n)continue;let mx=Math.max(...pc),med=[...pc].sort((x,y)=>x-y)[6],cand=[];for(let p=0;p<12;p++)if(pc[p]>=Math.max(mx*.18,med*1.18)){let bins=[];for(let m=36;m<=84;m++)if(m%12===p)bins.push([m,mid[m]]);bins.sort((x,y)=>y[1]-x[1]);cand.push({pc:p,m:bins[0][0],rel:pc[p]/(mx||1)})}cand.sort((x,y)=>y.rel-x.rel);let kept=cand.filter(c=>c.rel>=.34).slice(0,4);if(kept.length<2)kept=cand.slice(0,2);out.push({start:a,end:b,midi:kept.map(q=>q.m)})}return out}async function beatthis(x){ort.env.wasm.numThreads=1;if(!melS)melS=await ort.InferenceSession.create(MEL_URL,{executionProviders:['wasm']});if(!beatS)beatS=await ort.InferenceSession.create(BEAT_URL,{executionProviders:['wasm']});let mo=await melS.run({[melS.inputNames[0]]:new ort.Tensor('float32',x,[1,x.length])}),sp=mo[melS.outputNames[0]],dims=sp.dims,frames=dims.length===3?dims[1]:dims[0],bands=dims.length===3?dims[2]:dims[1],flat=sp.data,bp=[],chunk=1500,ov=12,step=chunk-2*ov;for(let st=0;st<frames;st+=step){let n=Math.min(chunk,frames-st),ar=new Float32Array(n*bands);ar.set(flat.subarray(st*bands,(st+n)*bands));let o=await beatS.run({[beatS.inputNames[0]]:new ort.Tensor('float32',ar,[1,n,bands])}),z=o[beatS.outputNames[0]].data,L=st?ov:0,R=st+n<frames?ov:0;for(let j=L;j<n-R;j++)bp.push({frame:st+j,v:1/(1+Math.exp(-z[j]))})}let q=[];for(let i=1;i<bp.length-1;i++)if(bp[i].v>=.5&&bp[i].v>=bp[i-1].v&&bp[i].v>bp[i+1].v)q.push({t:bp[i].frame*.02,s:bp[i].v});let keep=[];for(let z of q.sort((a,b)=>b.s-a.s))if(!keep.some(y=>Math.abs(y.t-z.t)<.16))keep.push(z);return keep.sort((a,b)=>a.t-b.t).map(z=>z.t)}function wav(M,H,T,dur){let SR=44100,N=Math.ceil(dur*SR),y=new Float32Array(N);function add(a,b,m,A,p){let i=Math.max(0,Math.floor(a*SR)),j=Math.min(N,Math.floor(b*SR)),f=hz(m);for(let k=i;k<j;k++){let t=(k-i)/SR,en=p?(1-Math.exp(-t/.004))*(.62*Math.exp(-t/.8)+.28*Math.exp(-t/2.2)+.1*Math.exp(-t/5)):(1-Math.exp(-t/.006))*Math.exp(-t/1.8),z=Math.sin(2*Math.PI*f*t)+(p?.38*Math.sin(4*Math.PI*f*t)+.16*Math.sin(6*Math.PI*f*t):0);y[k]+=A*en*z}}for(let q of M)add(q.on,q.off,q.m,.11,false);for(let q of H)for(let m of q.midi)add(q.start,q.end,m,.035,true);for(let b of T){let i=Math.floor(b*SR),j=Math.min(N,i+Math.floor(.04*SR));for(let k=i;k<j;k++){let t=(k-i)/SR;y[k]+=.16*Math.exp(-70*t)*Math.sin(2*Math.PI*1000*t)}}let mx=0;for(let v of y)mx=Math.max(mx,Math.abs(v));let g=.9/Math.max(mx,1e-9),ab=new ArrayBuffer(44+N*2),v=new DataView(ab),p=0,S=s=>{for(let c of s)v.setUint8(p++,c.charCodeAt(0))},U=n=>{v.setUint32(p,n,true);p+=4},H16=n=>{v.setUint16(p,n,true);p+=2};S('RIFF');U(36+N*2);S('WAVEfmt ');U(16);H16(1);H16(1);U(SR);U(SR*2);H16(2);H16(16);S('data');U(N*2);for(let z of y){z=Math.max(-1,Math.min(1,z*g));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}$('run').onclick=async function(){try{$('run').disabled=true;$('st').textContent='Preparando una sola señal…';let x=rs(mono(buf),buf.sampleRate),dur=Math.min(buf.duration,60),xx=x.subarray(0,Math.floor(dur*22050));$('pr').value=10;$('st').textContent='T · Beat This…';let T=await beatthis(xx);$('tn').textContent=T.length;$('pr').value=45;$('st').textContent='M · melodía…';let M=melody(xx,22050,dur);$('mn').textContent=M.length;$('pr').value=70;$('st').textContent='H · armonía…';let HH=harmony(xx,22050,T,dur);$('hn').textContent=HH.length;$('pr').value=90;$('st').textContent='Integrando…';let blob=wav(M,HH,T,dur);$('out').src=URL.createObjectURL(blob);$('out').load();result={schema:'MIE-UNIFIED-TRANSCRIPTION-v0.1',status:'EXPERIMENTAL_NOT_BASELINE',source:getFile().name,duration_s:dur,prior_reference_injected:false,melody:M,harmony:HH,beats:T};$('ex').disabled=false;$('pr').value=100;$('st').textContent='LISTO · escucha la resíntesis unificada'}catch(e){$('st').textContent='ERROR · '+e.name+' · '+e.message;console.error(e)}finally{$('run').disabled=false}};$('ex').onclick=()=>{if(!result)return;let b=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MIE_UNIFIED_TRANSCRIPTION_v0_1.json';a.click()};</script></body></html>

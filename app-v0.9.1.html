<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HookLab TIME v0.9.1</title><style>html,body{margin:0;height:100%;background:#f2f2f0;font-family:-apple-system,BlinkMacSystemFont,system-ui;color:#171717}.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar b{font-size:14px;margin-right:auto}.bar button{font-size:15px;padding:9px 12px;border:0;border-radius:9px;background:#222;color:#fff}.bar button.secondary{background:#e7e7e4;color:#222}.bar span{font-size:12px;color:#666;width:100%}iframe{display:block;width:100%;height:calc(100vh - 84px);border:0;background:#f2f2f0}</style></head><body><div class="bar"><b>HookLab v0.9.1</b><button id="summary">Descargar resumen JSON</button><button id="full" class="secondary">JSON completo</button><span id="msg">Analiza el tema y luego descarga el archivo.</span></div><iframe id="app" src="app-v0.9.html" title="HookLab TIME v0.9"></iframe><script>
const frame=document.getElementById('app'),msg=document.getElementById('msg');
function getResult(){try{const pre=frame.contentDocument&&frame.contentDocument.getElementById('out');if(!pre)throw new Error('resultado no disponible');const txt=pre.textContent.trim();if(!txt||txt==='{}')throw new Error('primero debes analizar un tema');return JSON.parse(txt)}catch(e){msg.textContent=e.message;return null}}
function safeName(name){return (name||'hooklab').replace(/\.[^.]+$/,'').replace(/[^a-z0-9_-]+/gi,'_')}
function download(obj,suffix){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safeName(obj.file)+'_'+suffix+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);msg.textContent='JSON descargado.'}
function makeSummary(d){return {schema:d.schema,engine:d.engine,file:d.file,duration_s:d.duration_s,raw_beat_candidates:d.raw_beat_candidates,beat_count:d.beat_count,removed_beat_duplicates:d.removed_beat_duplicates,raw_downbeat_candidates:d.raw_downbeat_candidates,estimated_bpm_from_median_ibi:d.estimated_bpm_from_median_ibi,metric_window_beats:d.metric_window_beats,metric_step_beats:d.metric_step_beats,metric_lock_threshold:d.metric_lock_threshold,metric_margin_threshold:d.metric_margin_threshold,metric_release_threshold:d.metric_release_threshold,metric_confirmation_windows:d.metric_confirmation_windows,metric_reacquisition_windows:d.metric_reacquisition_windows,metric_switch_advantage:d.metric_switch_advantage,accent_gate_on_segments:d.accent_gate_on_segments,accent_gate_off_segments:d.accent_gate_off_segments,metric_accent_count:d.metric_accent_count,metric_segments:d.metric_segments,notes:d.notes}}
document.getElementById('summary').onclick=()=>{const d=getResult();if(d)download(makeSummary(d),'resumen')};document.getElementById('full').onclick=()=>{const d=getResult();if(d)download(d,'completo')};
</script></body></html>

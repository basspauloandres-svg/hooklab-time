<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>MIE Decoder + Beat This v0.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input,audio,progress{font-size:16px;width:100%;box-sizing:border-box}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:6px 0}.muted{color:#666;font-size:14px}</style></head><body><main><div class="card"><h1>MIE Decoder + Beat This v0.1</h1><p class="muted">Una sola variable nueva sobre el decoder iPhone validado: Beat This. Sin melodía, sin armonía.</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><button id="decode">1. Decodificar</button><p id="decodeState" class="muted">Sin decodificar.</p><button id="beat" disabled>2. Detectar beat</button><progress id="pr" max="100" value="0"></progress><p id="beatState" class="muted">Sin análisis.</p><audio id="out" controls></audio></div></main><script>var input=document.getElementById('f'),out=document.getElementById('out'),buf=null,outUrl=null,melS=null,beatS=null;function getFile(){var fs=input.files;if(!fs||fs.length<1)throw new Error('Sin archivo');return fs[0]}document.getElementById('decode').onclick=async function(){try{var f=getFile(),AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),ab=await f.arrayBuffer(),t=performance.now();buf=await ac.decodeAudioData(ab.slice(0));document.getElementById('decodeState').textContent='DECODE OK · '+buf.duration.toFixed(6)+' s · '+buf.sampleRate+' Hz · '+(performance.now()-t).toFixed(1)+' ms';document.getElementById('beat').disabled=false;try{await ac.close()}catch(_){}}catch(e){document.getElementById('decodeState').textContent='ERROR DECODE · '+e.name+' · '+e.message}};function mono(b){var y=new Float32Array(b.length);for(var c=0;c<b.numberOfChannels;c++){var x=b.getChannelData(c);for(var i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function rs(x,sr,to){if(sr===to)return x;var n=Math.floor(x.length*to/sr),y=new Float32Array(n),r=sr/to;for(var i=0;i<n;i++){var p=i*r,a=Math.floor(p),f=p-a;y[i]=x[a]*(1-f)+x[Math.min(x.length-1,a+1)]*f}return y}function loadScript(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){no(new Error('No cargó '+src))};document.head.appendChild(s)})}async function beatthis(x){if(typeof ort==='undefined')await loadScript('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.min.js');ort.env.wasm.numThreads=1;var MEL='https://raw.githubusercontent.com/danigb/beat-this-rs/main/models/mel_spectrogram.onnx',BEAT='https://raw.githubusercontent.com/danigb/beat-this-rs/main/models/beat_this_small.onnx';if(!melS)melS=await ort.InferenceSession.create(MEL,{executionProviders:['wasm']});if(!beatS)beatS=await ort.InferenceSession.create(BEAT,{executionProviders:['wasm']});var mo=await melS.run({[melS.inputNames[0]]:new ort.Tensor('float32',x,[1,x.length])}),sp=mo[melS.outputNames[0]],dims=sp.dims,frames=dims.length===3?dims[1]:dims[0],bands=dims.length===3?dims[2]:dims[1],flat=sp.data,bp=[],chunk=1500,ov=12,step=chunk-2*ov;for(var st=0;st<frames;st+=step){var n=Math.min(chunk,frames-st),ar=new Float32Array(n*bands);ar.set(flat.subarray(st*bands,(st+n)*bands));var o=await beatS.run({[beatS.inputNames[0]]:new ort.Tensor('float32',ar,[1,n,bands])}),z=o[beatS.outputNames[0]].data,L=st?ov:0,R=st+n<frames?ov:0;for(var j=L;j<n-R;j++)bp.push({frame:st+j,v:1/(1+Math.exp(-z[j]))})}var q=[];for(var i=1;i<bp.length-1;i++)if(bp[i].v>=.5&&bp[i].v>=bp[i-1].v&&bp[i].v>bp[i+1].v)q.push({t:bp[i].frame*.02,s:bp[i].v});var keep=[];for(var k=0;k<q.sort((a,b)=>b.s-a.s).length;k++){var z=q[k];if(!keep.some(y=>Math.abs(y.t-z.t)<.16))keep.push(z)}return keep.sort((a,b)=>a.t-b.t).map(z=>z.t)}function wavWithClick(b,beats,dur){var sr=48000,OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext,off=new OAC(2,Math.ceil(dur*sr),sr),src=off.createBufferSource(),g=off.createGain();src.buffer=b;g.gain.value=.70;src.connect(g);g.connect(off.destination);src.start(0,0,dur);for(var k=0;k<beats.length;k++){var t=beats[k];if(t>=dur)continue;var o=off.createOscillator(),cg=off.createGain();o.frequency.value=900;cg.gain.setValueAtTime(.0001,t);cg.gain.linearRampToValueAtTime(.20,t+.003);cg.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(cg);cg.connect(off.destination);o.start(t);o.stop(t+.05)}return off.startRendering()}function toWav(b){var ch=b.numberOfChannels,n=b.length,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab),q=0;function s(x){for(var i=0;i<x.length;i++)v.setUint8(q++,x.charCodeAt(i))}function u32(x){v.setUint32(q,x,true);q+=4}function u16(x){v.setUint16(q,x,true);q+=2}s('RIFF');u32(36+n*ch*2);s('WAVEfmt ');u32(16);u16(1);u16(ch);u32(b.sampleRate);u32(b.sampleRate*ch*2);u16(ch*2);u16(16);s('data');u32(n*ch*2);for(var i=0;i<n;i++)for(var c=0;c<ch;c++){var x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(q,x<0?x*32768:x*32767,true);q+=2}return new Blob([ab],{type:'audio/wav'})}document.getElementById('beat').onclick=async function(){try{if(!buf)throw new Error('Primero pulsa Decodificar');document.getElementById('beat').disabled=true;document.getElementById('beatState').textContent='Cargando Beat This…';document.getElementById('pr').value=10;var dur=Math.min(60,buf.duration),x=rs(mono(buf),buf.sampleRate,22050).subarray(0,Math.floor(dur*22050));var t0=performance.now(),beats=await beatthis(x);document.getElementById('pr').value=70;document.getElementById('beatState').textContent='Beat detectado: '+beats.length+' pulsos · renderizando…';var mixed=await wavWithClick(buf,beats,dur),blob=toWav(mixed);if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(blob);out.src=outUrl;out.load();document.getElementById('pr').value=100;document.getElementById('beatState').textContent='BEAT OK · '+beats.length+' pulsos · '+(performance.now()-t0).toFixed(0)+' ms'}catch(e){document.getElementById('beatState').textContent='ERROR BEAT · '+e.name+' · '+e.message}finally{document.getElementById('beat').disabled=false}};</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.21 COMPACT MONITOR</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f2f2f0}iframe{border:0;width:100%;height:100vh;display:block}.panel{position:fixed;right:10px;bottom:10px;z-index:999999;background:rgba(255,255,255,.96);border:1px solid #bbb;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.18);width:min(300px,calc(100vw - 20px));padding:8px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}.toggle{font:700 12px system-ui;border:1px solid #aaa;border-radius:7px;background:#f7f7f7;padding:5px 8px}.body{margin-top:7px}.panel.collapsed .body{display:none}.mix{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ch{background:#f4f4f2;border-radius:8px;padding:7px}.ch label{display:flex;justify-content:space-between;font-size:11px;font-weight:700}.ch input{width:100%;margin-top:5px}.state{font-size:10px;color:#666;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exp{width:100%;margin-top:7px;font:700 12px system-ui;padding:7px;border:1px solid #aaa;border-radius:7px;background:#f7f7f7}</style></head><body><iframe id="outer" src="app-v1.9.19-tempo-bias-test.html?build=20260821-1921" allow="autoplay"></iframe><div class="panel collapsed" id="panel"><div class="head"><span>Mezcla monitor</span><button class="toggle" id="toggle">Abrir</button></div><div class="body"><div class="mix"><div class="ch"><label><span>Pista</span><span id="tv">65%</span></label><input id="track" type="range" min="0" max="100" value="65" step="1"><div class="state" id="ts">buscando…</div></div><div class="ch"><label><span>Claqueta</span><span id="cv">85%</span></label><input id="click" type="range" min="0" max="100" value="85" step="1"><div class="state" id="cs">buscando…</div></div></div><button class="exp" id="export">Exportar monitor audit</button></div></div><script>
const outer=document.getElementById('outer'),panel=document.getElementById('panel'),toggle=document.getElementById('toggle'),track=document.getElementById('track'),click=document.getElementById('click'),tv=document.getElementById('tv'),cv=document.getElementById('cv'),ts=document.getElementById('ts'),cs=document.getElementById('cs');let trackGain=.65,clickGain=.85,core=null,records=[];

function player(){let w=deep();try{return w&&w.document.getElementById('player')}catch(_){return null}}
function applyTrack(){let p=player();if(p){p.volume=trackGain;ts.textContent='activo '+p.volume.toFixed(2)}else ts.textContent='sin reproductor'}
function installClick(){core=deep();if(!core)return false;try{core.__hl1921ClickGain=clickGain;if(core.__hl1921)return true;core.eval(`(function(){if(window.__hl1921)return;window.__hl1921=true;window.__hl1921OriginalTone=tone;tone=function(at,f,v,d){return window.__hl1921OriginalTone(at,f,Math.max(0,Math.min(1,v*(window.__hl1921ClickGain==null?1:window.__hl1921ClickGain))),d)}})();`);return true}catch(_){return false}}
function applyClick(){core=deep();if(core)core.__hl1921ClickGain=clickGain;cs.textContent=installClick()?'activo '+clickGain.toFixed(2):'sin salida'}
track.oninput=()=>{trackGain=+track.value/100;tv.textContent=track.value+'%';applyTrack();records.push({t:performance.now(),kind:'track_gain',value:trackGain})};click.oninput=()=>{clickGain=+click.value/100;cv.textContent=click.value+'%';applyClick();records.push({t:performance.now(),kind:'click_gain',value:clickGain})};setInterval(()=>{applyTrack();applyClick()},500);outer.addEventListener('load',()=>setTimeout(()=>{applyTrack();applyClick()},900));
document.getElementById('export').onclick=()=>{let p=player(),payload={schema:'HookLab-TIME-v1.9.21-compact-monitor-overlay',track_gain_requested:trackGain,click_gain_requested:clickGain,player_volume:p?p.volume:null,playbackRate:p?p.playbackRate:null,defaultPlaybackRate:p?p.defaultPlaybackRate:null,currentTime_s:p?p.currentTime:null,records,user_agent:navigator.userAgent};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HookLab_monitor_overlay_v1_9_21.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.58 iOS Native Preview Minimal P0</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:22px}input,button,audio{width:100%;font-size:16px}button{margin-top:12px;padding:12px;border:0;border-radius:10px;background:#222;color:#fff}.muted{color:#666;font-size:14px}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.58 — Vista previa nativa mínima</h1><p class="muted">Sin TIME, sin decodeAudioData, sin OfflineAudioContext. Solo File → object URL → HTMLAudioElement.</p><input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><button id="load">Cargar en reproductor nativo</button><p id="status">JS: ACTIVO · esperando archivo</p></div><div class="card"><audio id="player" controls preload="metadata"></audio><p id="meta" class="muted">Sin fuente activa.</p></div><script>
(function(){
var input=document.getElementById('file');var btn=document.getElementById('load');var player=document.getElementById('player');var status=document.getElementById('status');var meta=document.getElementById('meta');var url=null;
function loadSelected(){try{var n=input.files?input.files.length:0;if(!n){status.textContent='ERROR · files.length = 0';meta.textContent='Sin fuente activa.';return;}var f=input.files[0];if(url){URL.revokeObjectURL(url);}url=URL.createObjectURL(f);player.pause();player.src=url;player.load();status.textContent='ENTRADA OK · files.length = '+n;meta.textContent='nombre = '+f.name+' | tamaño = '+f.size+' bytes | tipo = '+(f.type||'sin tipo');}catch(e){status.textContent='ERROR · '+e.message;}}
btn.addEventListener('click',loadSelected);input.addEventListener('change',loadSelected);player.addEventListener('loadedmetadata',function(){status.textContent='METADATA OK · duración = '+(isFinite(player.duration)?player.duration.toFixed(3):'—')+' s';});player.addEventListener('canplay',function(){status.textContent='CANPLAY OK · pulsa Play';});player.addEventListener('playing',function(){status.textContent='PLAYING OK · audio nativo audible si la salida está activa';});player.addEventListener('error',function(){status.textContent='ERROR MEDIA · code='+(player.error?player.error.code:'?');});
})();
</script></main></body></html>

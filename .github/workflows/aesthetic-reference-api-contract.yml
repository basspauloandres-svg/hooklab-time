name: Aesthetic Reference API Contract
on:
  push:
    branches: ["mie/golden-forensic-v0.3"]
    paths:
      - "services/aesthetic_reference_api/**"
      - "tests/aesthetic_reference_api_contract_test.py"
      - ".github/workflows/aesthetic-reference-api-contract.yml"
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -r services/aesthetic_reference_api/requirements.txt httpx==0.28.1
      - run: python tests/aesthetic_reference_api_contract_test.py

name: McGill Billboard deduction calibration
on:
  push:
    branches: [mie/golden-forensic-v0.3]
    paths:
      - 'mie_core/mcgill_billboard_deduction_calibration.py'
      - '.github/workflows/mcgill-billboard-deduction-calibration.yml'
  workflow_dispatch:
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scipy
        run: python -m pip install scipy
      - name: Clone CC0 McGill Billboard mirror
        run: git clone --depth 1 https://github.com/boomerr1/The-McGill-Billboard-Project.git /tmp/mcgill
      - name: Run calibration
        run: python mie_core/mcgill_billboard_deduction_calibration.py --repo /tmp/mcgill --output MCGILL_BILLBOARD_DEDUCTION_CALIBRATION_CURRENT_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: mcgill-billboard-deduction-calibration
          path: MCGILL_BILLBOARD_DEDUCTION_CALIBRATION_CURRENT_v1.json

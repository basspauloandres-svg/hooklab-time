name: Deploy HookLab Producer Interface v0.3 to Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-producer-interface-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-producer-interface"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical HookLab branch
        uses: actions/checkout@v6
        with:
          ref: mie/golden-forensic-v0.3

      - name: Prepare static Producer Interface
        run: |
          mkdir -p _site
          cp app/prototype_v1/index.html _site/index.html
          cp app/prototype_v1/d0_engine.js _site/d0_engine.js
          touch _site/.nojekyll
          printf '%s\n' 'User-agent: *' 'Disallow:' > _site/robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

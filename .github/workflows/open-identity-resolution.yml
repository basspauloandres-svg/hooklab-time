name: Open Cross-Source Identity Resolution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-identity-resolution.yml'
      - 'mie_core/open_identity_resolver.py'
      - 'tests/test_open_identity_resolver.py'
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hooklab-open-identity-resolution
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned open search extractor
        run: python3 -m pip install --disable-pip-version-check 'yt-dlp==2026.8.19'

      - name: Validate cross-source promotion contract
        run: python3 tests/test_open_identity_resolver.py

      - name: Resolve pending identities from independent open sources
        run: |
          python3 mie_core/open_identity_resolver.py \
            --case-manifest data/lyric_modeling/hooklab_corpus_case_metadata_manifest_v1.json \
            --identity-map data/engagement_modeling/youtube_video_identity_map_v0_1.json \
            --audit-output data/engagement_modeling/open_identity_resolution_audit_v1.json \
            --review-output data/engagement_modeling/open_identity_review_queue_v1.json

      - name: Validate identity boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          identity = json.loads(Path('data/engagement_modeling/youtube_video_identity_map_v0_1.json').read_text())
          audit = json.loads(Path('data/engagement_modeling/open_identity_resolution_audit_v1.json').read_text())
          review = json.loads(Path('data/engagement_modeling/open_identity_review_queue_v1.json').read_text())
          assert identity['scientific_d_unlocked'] is False
          assert audit['automatic_single_source_promotion'] is False
          assert audit['scientific_d_unlocked'] is False
          assert review['automatic_single_source_promotion'] is False
          assert review['scientific_d_unlocked'] is False
          assert review['unresolved_count'] == len(review['records'])
          assert all(row['review_class'] in {'AUDIT_AMBIGUOUS_CROSS_SOURCE', 'IDENTITY_REVIEW_PENDING'} for row in review['records'])
          assert all(row['popularity_based_selection_forbidden'] is True for row in review['records'])
          for row in identity['records']:
              if row.get('identity_verification_method') == 'AUTOMATED_CROSS_SOURCE_V1':
                  evidence = row.get('identity_evidence') or []
                  assert evidence and ',' in evidence[0]
          print('OPEN_IDENTITY_RESOLUTION_BOUNDARY_PASS')
          PY

      - name: Commit identity evidence and audit
        shell: bash
        run: |
          git config user.name 'hooklab-identity-bot'
          git config user.email 'hooklab-identity-bot@users.noreply.github.com'
          git add data/engagement_modeling/youtube_video_identity_map_v0_1.json \
            data/engagement_modeling/open_identity_resolution_audit_v1.json \
            data/engagement_modeling/open_identity_review_queue_v1.json
          if git diff --cached --quiet; then
            echo 'AUDIT_NO_IDENTITY_CHANGE'
            exit 0
          fi
          git commit -m 'data: refresh open cross-source identity evidence'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload identity audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hooklab-open-identity-audit-${{ github.run_id }}
          path: |
            data/engagement_modeling/open_identity_resolution_audit_v1.json
            data/engagement_modeling/open_identity_review_queue_v1.json
          if-no-files-found: warn
          retention-days: 30

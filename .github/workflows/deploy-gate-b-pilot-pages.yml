name: HookLab Producer Interface Pages

on:
  push:
    branches: ["mie/golden-forensic-v0.3", "release/producer-interface-v0.6", "main"]
    paths:
      - "app/prototype_v1/**"
      - ".github/workflows/deploy-gate-b-pilot-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/prototype_v1/**"
      - ".github/workflows/deploy-gate-b-pilot-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare complete static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R app/prototype_v1/. _site/
          printf '%s\n' 'User-agent: *' 'Disallow:' > _site/robots.txt
          test -f _site/index.html
          test -f _site/d0_engine.js
          test -f _site/local_beat_this.js
          test -f _site/lyric_prosody_ui_bridge.js
          test -f _site/hook_composition_assistant.js
          echo "Static asset inventory:"
          find _site -maxdepth 2 -type f | sort
      - name: Upload validated static bundle
        uses: actions/upload-artifact@v4
        with:
          name: hooklab-producer-interface-static
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-static-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare complete static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R app/prototype_v1/. _site/
          printf '%s\n' 'User-agent: *' 'Disallow:' > _site/robots.txt
          test -f _site/index.html
          test -f _site/d0_engine.js
          test -f _site/local_beat_this.js
          test -f _site/lyric_prosody_ui_bridge.js
          test -f _site/hook_composition_assistant.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

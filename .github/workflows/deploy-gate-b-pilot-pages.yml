name: Deploy HookLab Producer Interface to Pages

on:
  push:
    branches: ["mie/golden-forensic-v0.3"]
    paths:
      - "app/prototype_v1/index.html"
      - ".github/workflows/deploy-gate-b-pilot-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp app/prototype_v1/index.html _site/index.html
          printf '%s\n' 'User-agent: *' 'Disallow:' > _site/robots.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

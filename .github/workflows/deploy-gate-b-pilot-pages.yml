name: HookLab Producer Interface Pages

on:
  push:
    branches: ["mie/golden-forensic-v0.3", "release/producer-interface-v0.6", "main"]
    paths:
      - "app/prototype_v1/**"
      - ".github/workflows/deploy-gate-b-pilot-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/prototype_v1/**"
      - ".github/workflows/deploy-gate-b-pilot-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare complete static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R app/prototype_v1/. _site/
          printf '%s\n' 'User-agent: *' 'Disallow:' > _site/robots.txt
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/studio.html
          test -f _site/d0_engine.js
          test -f _site/local_beat_this.js
          test -f _site/lyric_prosody_ui_bridge.js
          test -f _site/hook_composition_assistant.js
          echo "Static asset inventory:"
          find _site -maxdepth 2 -type f | sort
      - name: Upload validated static bundle
        uses: actions/upload-artifact@v4
        with:
          name: hooklab-producer-interface-static
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-static-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare complete static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R app/prototype_v1/. _site/
          printf '%s\n' 'User-agent: *' 'Disallow:' > _site/robots.txt
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/studio.html
          test -f _site/d0_engine.js
          test -f _site/local_beat_this.js
          test -f _site/lyric_prosody_ui_bridge.js
          test -f _site/hook_composition_assistant.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live root and Studio
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euxo pipefail
          echo "Deployment URL: $PAGE_URL"
          for i in 1 2 3 4 5 6; do
            ROOT_CODE=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' "$PAGE_URL" || true)
            STUDIO_CODE=$(curl -L -sS -o /tmp/studio.html -w '%{http_code}' "${PAGE_URL%/}/studio.html" || true)
            echo "Attempt $i root=$ROOT_CODE studio=$STUDIO_CODE"
            if [ "$ROOT_CODE" = "200" ] && [ "$STUDIO_CODE" = "200" ]; then
              grep -q 'HookLab' /tmp/root.html
              grep -q 'HookLab Studio' /tmp/studio.html
              exit 0
            fi
            sleep 10
          done
          echo 'Pages deployment reported success but public HTTP verification failed.' >&2
          exit 1

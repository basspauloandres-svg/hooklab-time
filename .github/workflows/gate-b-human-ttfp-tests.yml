name: Gate B Human TTFP Tests

on:
  push:
    branches: ["mie/golden-forensic-v0.3"]
    paths:
      - "mie_core/gate_b_human_ttpf_trial.py"
      - "mie_core/test_gate_b_human_ttpf_trial.py"
      - "mie_core/gate_b_trial_template_v1.json"
      - ".github/workflows/gate-b-human-ttfp-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Run Gate B tests
        working-directory: mie_core
        run: pytest -q test_gate_b_human_ttpf_trial.py

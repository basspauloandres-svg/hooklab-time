name: Gate A External Vocal Identity Validator Tests

on:
  push:
    branches: ["mie/golden-forensic-v0.3"]
    paths:
      - "mie_core/external_vocal_identity_validator.py"
      - "mie_core/test_external_vocal_identity_validator.py"
      - ".github/workflows/external-vocal-identity-validator-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install pytest scipy
      - name: Run Gate A validator tests
        working-directory: mie_core
        run: pytest -q test_external_vocal_identity_validator.py

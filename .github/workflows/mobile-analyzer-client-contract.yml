name: Mobile Analyzer Client Contract
on:
  push:
    branches: ["mie/golden-forensic-v0.3"]
    paths:
      - "app/prototype_v1/analyzer_api_client.js"
      - "tests/analyzer_api_client_test.js"
      - ".github/workflows/mobile-analyzer-client-contract.yml"
  workflow_dispatch:
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check app/prototype_v1/analyzer_api_client.js
      - run: node tests/analyzer_api_client_test.js

name: Melodic Confidence Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'mie_core/melodic_confidence_gate.py'
      - 'mie_core/test_melodic_confidence_gate.py'
      - '.github/workflows/melodic-confidence-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest
      - name: Run melodic confidence regression suite
        run: pytest -q mie_core/test_melodic_confidence_gate.py

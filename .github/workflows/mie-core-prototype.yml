name: MIE Core Prototype

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct URL to input audio'
        required: false
        type: string
  push:
    paths:
      - 'mie_core/**'
      - '.github/workflows/mie-core-prototype.yml'

jobs:
  mie-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install MIE Core
        run: pip install -r mie_core/requirements.txt
      - name: Acquire authorized preview audio
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
          DEFAULT_PREVIEW_URL: https://audio-ssl.itunes.apple.com/itunes-assets/Music/53/ca/ec/mzm.cxqdopjk.aac.p.m4a
        run: |
          mkdir -p mie_run/input mie_run/output
          URL="$AUDIO_URL"
          if [ -z "$URL" ]; then URL="$DEFAULT_PREVIEW_URL"; fi
          curl -L --fail "$URL" -o mie_run/input/source.m4a
          ffmpeg -y -i mie_run/input/source.m4a -ar 44100 -ac 2 mie_run/input/source.wav
      - name: Separate 4 stems with HTDemucs
        run: python -m demucs -n htdemucs -o mie_run/stems mie_run/input/source.wav
      - name: Run MIE Core v0.2
        run: python mie_core/run_mie_core.py --audio mie_run/input/source.wav --stems mie_run/stems --output mie_run/output
      - name: Upload MIE prototype
        uses: actions/upload-artifact@v4
        with:
          name: mie-core-prototype-v0-2
          path: mie_run/output/
          if-no-files-found: error

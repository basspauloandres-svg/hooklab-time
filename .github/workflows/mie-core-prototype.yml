name: MIE Core Prototype

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct URL to regression input audio'
        required: false
        type: string
  push:
    paths:
      - 'mie_core/**'
      - '.github/workflows/mie-core-prototype.yml'

concurrency:
  group: mie-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install MIE Core
        run: pip install -r mie_core/requirements.txt
      - name: Structural reduction invariant tests
        run: python mie_core/test_structural_reduction.py
      - name: Acquire regression preview audio
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
          DEFAULT_PREVIEW_URL: https://audio-ssl.itunes.apple.com/itunes-assets/Music/53/ca/ec/mzm.cxqdopjk.aac.p.m4a
        run: |
          mkdir -p mie_run/input mie_run/output
          URL="$AUDIO_URL"
          if [ -z "$URL" ]; then URL="$DEFAULT_PREVIEW_URL"; fi
          curl -L --fail "$URL" -o mie_run/input/source.m4a
          ffmpeg -y -i mie_run/input/source.m4a -ar 44100 -ac 2 mie_run/input/source.wav
      - name: Separate 4 stems with HTDemucs
        run: python -m demucs -n htdemucs -o mie_run/stems mie_run/input/source.wav
      - name: Locate vocal stem
        run: |
          VOCAL=$(find mie_run/stems -type f -name vocals.wav | head -n 1)
          test -n "$VOCAL"
          echo "VOCAL=$VOCAL" >> "$GITHUB_ENV"
      - name: Run M-only structural probe
        run: python mie_core/run_structural_probe.py --vocal "$VOCAL" --output mie_run/output/structural_probe
      - name: Run frozen MIE Core v0.2 comparison path
        run: python mie_core/run_mie_core.py --audio mie_run/input/source.wav --stems mie_run/stems --output mie_run/output/core_v0_2
      - name: Upload regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: mie-structural-regression-v0-2
          path: mie_run/output/
          if-no-files-found: error

  generic-a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install MIE Core
        run: pip install -r mie_core/requirements.txt
      - name: Acquire contrasting public preview
        env:
          GENERIC_A_URL: https://audio-ssl.itunes.apple.com/itunes-assets/Music7/v4/68/46/97/6846978e-3c21-f67a-1b3c-ccb50b39af23/mzaf_6442408816188928529.plus.aac.p.m4a
        run: |
          mkdir -p generic_a/input generic_a/output
          curl -L --fail "$GENERIC_A_URL" -o generic_a/input/source.m4a
          ffmpeg -y -i generic_a/input/source.m4a -ar 44100 -ac 2 generic_a/input/source.wav
      - name: Separate generic A stems
        run: python -m demucs -n htdemucs -o generic_a/stems generic_a/input/source.wav
      - name: Locate generic A vocal stem
        run: |
          VOCAL=$(find generic_a/stems -type f -name vocals.wav | head -n 1)
          test -n "$VOCAL"
          echo "GENERIC_A_VOCAL=$VOCAL" >> "$GITHUB_ENV"
      - name: Run generic A M-only structural probe
        run: python mie_core/run_structural_probe.py --vocal "$GENERIC_A_VOCAL" --output generic_a/output/structural_probe
      - name: Upload generic A evidence
        uses: actions/upload-artifact@v4
        with:
          name: mie-structural-generic-a-v0-2
          path: generic_a/output/
          if-no-files-found: error

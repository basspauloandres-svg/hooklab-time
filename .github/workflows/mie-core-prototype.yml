name: MIE Core Prototype

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct URL to input audio'
        required: false
        type: string
  push:
    paths:
      - 'mie_core/**'
      - '.github/workflows/mie-core-prototype.yml'

jobs:
  mie-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install MIE Core
        run: pip install -r mie_core/requirements.txt
      - name: Acquire or synthesize audio
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          mkdir -p mie_run/input mie_run/output
          if [ -n "$AUDIO_URL" ]; then
            curl -L --fail "$AUDIO_URL" -o mie_run/input/source.mp3
          else
            ffmpeg -y \
              -f lavfi -i "sine=frequency=220:duration=10" \
              -f lavfi -i "sine=frequency=329.63:duration=10" \
              -f lavfi -i "sine=frequency=440:duration=10" \
              -filter_complex "[0:a][1:a][2:a]amix=inputs=3:normalize=0,volume=0.25" \
              -c:a libmp3lame -b:a 128k mie_run/input/source.mp3
          fi
      - name: Separate stems with HTDemucs
        run: python -m demucs -n htdemucs --two-stems=vocals -o mie_run/stems mie_run/input/source.mp3
      - name: Run MIE Core
        run: python mie_core/run_mie_core.py --audio mie_run/input/source.mp3 --stems mie_run/stems --output mie_run/output
      - name: Upload MIE prototype
        uses: actions/upload-artifact@v4
        with:
          name: mie-core-prototype
          path: mie_run/output/
          if-no-files-found: error

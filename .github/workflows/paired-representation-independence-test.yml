name: Paired Representation Independence Regression
on:
  push:
    branches: ["mie/golden-forensic-v0.3"]
    paths:
      - "mie_core/paired_representation_agreement.py"
      - "tests/paired_representation_independence_test.py"
      - ".github/workflows/paired-representation-independence-test.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install scipy
      - run: python tests/paired_representation_independence_test.py

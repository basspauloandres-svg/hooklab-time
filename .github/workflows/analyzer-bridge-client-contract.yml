name: Analyzer Bridge Client Contract
on:
  push:
    branches: ["mie/golden-forensic-v0.3"]
    paths:
      - "app/prototype_v1/analysis_bridge.js"
      - "tests/analysis_bridge_client_test.js"
      - ".github/workflows/analyzer-bridge-client-contract.yml"
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check app/prototype_v1/analysis_bridge.js
      - run: node tests/analysis_bridge_client_test.js

name: Hook Multimodal Composition Assistant
on:
  push:
    branches: [mie/golden-forensic-v0.3, release/producer-interface-v0.6, main]
    paths:
      - 'app/prototype_v1/hook_composition_assistant.js'
      - 'app/prototype_v1/lyric_prosody_ui_bridge.js'
      - 'tests/test_hook_composition_assistant.js'
      - 'tests/test_lyric_prosody_ui_bridge.js'
      - 'docs/contracts/HOOK_MULTIMODAL_COMPOSITION_CONTRACT_v1.md'
      - '.github/workflows/hook-multimodal-composition-assistant.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/prototype_v1/hook_composition_assistant.js'
      - 'app/prototype_v1/lyric_prosody_ui_bridge.js'
      - 'tests/test_hook_composition_assistant.js'
      - 'tests/test_lyric_prosody_ui_bridge.js'
      - 'docs/contracts/HOOK_MULTIMODAL_COMPOSITION_CONTRACT_v1.md'
      - '.github/workflows/hook-multimodal-composition-assistant.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/test_hook_composition_assistant.js
      - run: node tests/test_lyric_prosody_ui_bridge.js

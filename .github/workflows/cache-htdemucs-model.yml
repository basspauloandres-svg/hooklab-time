name: Cache HTDemucs Model

on:
  push:
    paths:
      - '.github/workflows/cache-htdemucs-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Demucs
        run: pip install 'demucs==4.0.1'
      - name: Download htdemucs checkpoint only
        run: |
          python - <<'PY'
          from demucs.pretrained import get_model
          m = get_model('htdemucs')
          print(type(m).__name__)
          PY
      - name: Locate checkpoint
        run: |
          mkdir -p model_artifact
          find "$HOME/.cache/torch/hub/checkpoints" -maxdepth 1 -type f -name '955717e8-8726e21a.th' -print -exec cp {} model_artifact/ \;
          test -f model_artifact/955717e8-8726e21a.th
          sha256sum model_artifact/955717e8-8726e21a.th | tee model_artifact/sha256.txt
          printf "models: ['955717e8']\n" > model_artifact/htdemucs.yaml
      - name: Upload model cache
        uses: actions/upload-artifact@v4
        with:
          name: htdemucs-model-cache
          path: model_artifact/
          if-no-files-found: error
          retention-days: 1

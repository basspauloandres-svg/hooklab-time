name: MIE Canonical Component Registry

on:
  push:
    paths:
      - 'data/music_modeling/mie_canonical_component_registry_v1.json'
      - 'assets/mie-stab004-p30-reconstruction-v0.1.2.js'
      - 'app-mie-other-motor-ia-motor-v0.1.html'
      - 'app-mie-harmonic-lock-v0.5.html'
      - 'app-recovery-lm-neural-beatthis-v1.9.3.html'
      - 'mie_core/run_mie_core.py'
      - 'mie_core/mie_temporal_refinement.py'
      - 'mie_core/mie_tf_plane_registration.py'
      - 'tests/mie_canonical_component_registry.test.js'
      - 'mie_core/mie_ai_candidate_reasoner.py'
      - 'mie_core/mie_recognition_contract.py'
      - 'tests/test_mie_recognition_contract.py'
      - 'tests/test_mie_temporal_refinement.py'
      - 'tests/test_mie_tf_plane_registration.py'
      - 'app/prototype_v1/mie_recognition_bridge.js'
      - 'tests/mie_recognition_bridge.test.js'
      - 'mie_core/mie_octave_plane_resolver.py'
      - 'mie_core/mie_recovery_resynthesis.py'
      - 'mie_core/mie_analyzer_service.py'
      - 'app-mie-recognition-v0.3.html'
      - 'notebooks/MIE_Recognition_v0_3_Mobile_Colab.ipynb'
      - 'mie_core/requirements-colab-py310.txt'
      - 'tests/mie_mobile_colab_contract.test.js'
      - '.github/workflows/mie-canonical-component-registry.yml'
  pull_request:
    paths:
      - 'data/music_modeling/mie_canonical_component_registry_v1.json'
      - 'assets/mie-stab004-p30-reconstruction-v0.1.2.js'
      - 'app-mie-other-motor-ia-motor-v0.1.html'
      - 'app-mie-harmonic-lock-v0.5.html'
      - 'app-recovery-lm-neural-beatthis-v1.9.3.html'
      - 'mie_core/run_mie_core.py'
      - 'mie_core/mie_temporal_refinement.py'
      - 'mie_core/mie_tf_plane_registration.py'
      - 'tests/mie_canonical_component_registry.test.js'
      - 'mie_core/mie_ai_candidate_reasoner.py'
      - 'mie_core/mie_recognition_contract.py'
      - 'tests/test_mie_recognition_contract.py'
      - 'tests/test_mie_temporal_refinement.py'
      - 'tests/test_mie_tf_plane_registration.py'
      - 'app/prototype_v1/mie_recognition_bridge.js'
      - 'tests/mie_recognition_bridge.test.js'
      - 'mie_core/mie_octave_plane_resolver.py'
      - 'mie_core/mie_recovery_resynthesis.py'
      - 'mie_core/mie_analyzer_service.py'
      - 'app-mie-recognition-v0.3.html'
      - 'notebooks/MIE_Recognition_v0_3_Mobile_Colab.ipynb'
      - 'mie_core/requirements-colab-py310.txt'
      - 'tests/mie_mobile_colab_contract.test.js'
      - '.github/workflows/mie-canonical-component-registry.yml'

jobs:
  canonical-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/mie_canonical_component_registry.test.js
      - run: node tests/mie_recognition_bridge.test.js
      - run: node tests/mie_mobile_colab_contract.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_mie_recognition_contract.py
      - run: python tests/test_mie_temporal_refinement.py
      - run: python tests/test_mie_tf_plane_registration.py

  colab-py310-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create isolated Python 3.10 runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.17
          python -m uv venv .mie-py310 --python 3.10 --seed
      - name: Install compatible CPU sensor stack
        run: |
          .mie-py310/bin/python -m pip install --disable-pip-version-check --progress-bar off \
            torch==2.2.2+cpu torchaudio==2.2.2+cpu \
            --extra-index-url https://download.pytorch.org/whl/cpu
          .mie-py310/bin/python -m pip install --disable-pip-version-check --progress-bar off \
            -r mie_core/requirements-colab-py310.txt
      - name: Verify MIE mobile imports
        run: |
          .mie-py310/bin/python -c \
            "import torch, torchaudio, demucs, librosa, onnxruntime, soundfile; from basic_pitch.inference import predict; print('MIE_COLAB_PY310_EFFECTIVE_IMPORTS_PASS')"

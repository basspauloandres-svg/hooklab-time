name: Cohort Stability Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'mie_core/cohort_stability_gate.py'
      - 'mie_core/test_cohort_stability_gate.py'
      - '.github/workflows/cohort-stability-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest
      - name: Run stability regression suite
        run: pytest -q mie_core/test_cohort_stability_gate.py

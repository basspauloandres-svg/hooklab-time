name: reference-batch-mie
on:
  push:
    paths:
      - 'evaluation/ctl/run_reference_batch_playwright.mjs'
      - 'evaluation/ctl/run_commercial_reference_descriptors.mjs'
      - '.github/workflows/reference-batch-mie.yml'
      - 'app-mie-unified-transcription-v0.1.1.html'
  workflow_dispatch:
jobs:
  commercial-descriptors:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Ensure ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run automated commercial reference descriptor batch
        run: node evaluation/ctl/run_commercial_reference_descriptors.mjs
      - name: Upload commercial descriptor outputs
        uses: actions/upload-artifact@v4
        with:
          name: commercial-rhythm-melody-descriptors
          path: evaluation/ctl/commercial_reference_outputs/*.json

name: Build HookLab microbenchmark

on:
  push:
    paths:
      - 'evaluation/microbenchmark/**'
      - '.github/workflows/build-microbenchmark.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python evaluation/microbenchmark/generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: hooklab-microbenchmark-v0.1
          path: evaluation/microbenchmark/generated/
          retention-days: 90
      - name: Publish individual files for mobile access
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evaluation/microbenchmark/generated/
          if git diff --cached --quiet; then
            echo "Generated files unchanged."
          else
            git commit -m "Publish generated microbenchmark [skip ci]"
            git push
          fi

name: Build HookLab microbenchmark

on:
  push:
    paths:
      - 'evaluation/microbenchmark/**'
      - '.github/workflows/build-microbenchmark.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python evaluation/microbenchmark/generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: hooklab-microbenchmark-v0.1
          path: evaluation/microbenchmark/generated/
          retention-days: 90

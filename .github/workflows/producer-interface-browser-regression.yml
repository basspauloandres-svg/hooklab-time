name: Producer Interface v0.2 Browser Regression

on:
  push:
    branches: ["main"]
    paths:
      - ".github/tests/producer-interface-regression.mjs"
      - ".github/workflows/producer-interface-browser-regression.yml"
      - "producer-interface-v0.2/index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOOKLAB_URL: https://basspauloandres-svg.github.io/hooklab-time/producer-interface-v0.2/
    steps:
      - name: Checkout main regression harness
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run deployed-interface regression
        run: timeout 90s node .github/tests/producer-interface-regression.mjs

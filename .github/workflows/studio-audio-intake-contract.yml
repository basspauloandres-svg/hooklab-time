name: Studio Audio Intake Contract
on:
  push:
    branches: [main]
    paths:
      - 'app/prototype_v1/studio.html'
      - 'app/prototype_v1/local_beat_this.js'
      - 'tests/test_studio_audio_contract.js'
      - '.github/workflows/studio-audio-intake-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/prototype_v1/studio.html'
      - 'app/prototype_v1/local_beat_this.js'
      - 'tests/test_studio_audio_contract.js'
      - '.github/workflows/studio-audio-intake-contract.yml'
  workflow_dispatch:
jobs:
  audio-intake-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/test_studio_audio_contract.js

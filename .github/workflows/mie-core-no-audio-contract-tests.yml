name: MIE Core No-Audio Contract Tests

on:
  push:
    paths:
      - 'mie_core/**'
      - 'tests/test_mie_melody_recognizability_gate.py'
      - 'tests/test_mie_frozen_reference_contract.py'
      - 'data/music_modeling/mie_v0_3_5_*'
      - '.github/workflows/mie-core-no-audio-contract-tests.yml'
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install contract-test dependency
        run: pip install numpy
      - name: Run M-only recognizability contract tests
        run: python tests/test_mie_melody_recognizability_gate.py
      - name: Run immutable frozen-reference contract tests
        run: python tests/test_mie_frozen_reference_contract.py

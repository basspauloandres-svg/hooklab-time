name: Integrated Evaluation v0.7
on:
  push:
    branches: ["integration/mie-r13-producer-v07-20260915"]
    paths:
      - "app/prototype_v1/integrated-evaluation-v0.7.html"
      - "app/prototype_v1/mie_r13_engine.js"
      - "tests/integrated_evaluation_v07_contract.js"
      - ".github/workflows/integrated-evaluation-v07.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/prototype_v1/integrated-evaluation-v0.7.html"
      - "app/prototype_v1/mie_r13_engine.js"
      - "tests/integrated_evaluation_v07_contract.js"
      - ".github/workflows/integrated-evaluation-v07.yml"
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check app/prototype_v1/mie_r13_engine.js
      - run: node tests/integrated_evaluation_v07_contract.js

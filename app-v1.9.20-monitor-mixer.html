const outer=document.getElementById('outer'),track=document.getElementById('track'),click=document.getElementById('click'),tv=document.getElementById('tv'),cv=document.getElementById('cv'),ts=document.getElementById('ts'),cs=document.getElementById('cs');let trackGain=.65,clickGain=.85,core=null,records=[];

function installClick(){core=deep();if(!core)return false;try{core.__hl1920ClickGain=clickGain;if(core.__hl1920)return true;core.eval(`(function(){if(window.__hl1920)return;window.__hl1920=true;window.__hl1920OriginalTone=tone;tone=function(at,f,v,d){return window.__hl1920OriginalTone(at,f,Math.max(0,Math.min(1,v*(window.__hl1920ClickGain==null?1:window.__hl1920ClickGain))),d)}})();`);return true}catch(_){return false}}
function applyClick(){core=deep();if(core)core.__hl1920ClickGain=clickGain;cs.textContent=installClick()?'activo · gain '+clickGain.toFixed(2):'salida aún no disponible'}

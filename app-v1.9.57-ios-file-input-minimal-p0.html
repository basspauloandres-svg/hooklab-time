<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.57 iOS File Input Minimal</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input{font-size:17px}button{padding:12px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin-top:12px}.ok{font-weight:700}.bad{font-weight:700}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.57 — Diagnóstico mínimo de archivo iPhone</h1><p>Esta página no usa TIME, Web Audio ni render. Solo comprueba si JavaScript puede leer el archivo seleccionado.</p><p id="boot" class="bad">JS: NO INICIADO</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><br><button type="button" onclick="probe()">Leer archivo seleccionado</button><p id="out">files.length = ?</p></div></main><script>
var boot=document.getElementById('boot');boot.textContent='JS: ACTIVO';boot.className='ok';
function probe(){try{var el=document.getElementById('f');var n=(el.files?el.files.length:0);var msg='files.length = '+n;if(n>0){var x=el.files[0];msg+=' | nombre = '+x.name+' | tamaño = '+x.size+' bytes | tipo = '+(x.type||'(vacío)');}document.getElementById('out').textContent=msg;}catch(e){document.getElementById('out').textContent='ERROR JS: '+e.message;}}
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.9 AUTO COMP</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f2f2f0}.bar{position:sticky;top:0;z-index:999999;background:#fff;padding:10px 12px;border-bottom:1px solid #ddd}.bar b{display:block;margin-bottom:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.m{background:#f5f5f3;border-radius:8px;padding:7px}.m span{display:block;font-weight:700;font-variant-numeric:tabular-nums}.row{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;margin-top:8px}.row input{width:100%}.small{font-size:12px;color:#666;margin-top:6px}iframe{border:0;width:100%;height:calc(100vh - 175px);display:block}</style></head><body><div class="bar"><b>v1.9.9 PRETEST · compensación automática robusta</b><div class="grid"><div class="m">Latencia detectada<span id="lat">esperando audio…</span></div><div class="m">Compensación aplicada<span id="comp">0 ms</span></div></div><div class="row"><label>Ajuste fino</label><input id="fine" type="range" min="-80" max="80" step="5" value="0"><span id="finev">0 ms</span></div><div class="small">La compensación solo afecta lo que oyes. Los tiempos analíticos permanecen intactos.</div></div><iframe id="outer" src="app-v1.9.6-latency-audit-exportfix.html?build=20260820-1999" allow="autoplay"></iframe><script>
const outer=document.getElementById('outer'),lat=document.getElementById('lat'),comp=document.getElementById('comp'),fine=document.getElementById('fine'),finev=document.getElementById('finev');let core=null,autoMs=0,fineMs=0,patched=false;
function deepest(){try{let w=outer.contentWindow;for(let k=0;k<8;k++){let q=w.document.getElementById('outer')||w.document.getElementById('app');if(!q||!q.contentWindow)break;w=q.contentWindow}return w}catch(_){return null}}
function getCtx(w){try{if(w.ctx)return w.ctx;if(w.eval)return w.eval('typeof ctx!=="undefined"?ctx:null')}catch(_){}return null}
function apply(){if(!core)return;let total=autoMs+fineMs;core.__hlPlaybackOffset=total/1000;comp.textContent=(total>=0?'+':'')+Math.round(total)+' ms'}
fine.oninput=()=>{fineMs=+fine.value;finev.textContent=(fineMs>=0?'+':'')+fineMs+' ms';apply()};
function installTone(){if(!core||patched)return false;try{core.eval(`(function(){if(window.__hlAutoCompTone)return;window.__hlAutoCompTone=true;window.__hlPlaybackOffset=0;let oldTone=tone;tone=function(at,f,v,d){let o=window.__hlPlaybackOffset||0;return oldTone(Math.max(ctx.currentTime+.002,at+o),f,v,d)};})();`);let os=core.summary,od=core.dl;if(typeof os==='function')core.summary=function(obj){let x=os(obj);x.output_compensation={detected_latency_ms:+autoMs.toFixed(1),fine_adjust_ms:fineMs,total_applied_ms:+(autoMs+fineMs).toFixed(1),scope:'playback_only'};x.notes=[...(x.notes||[]),'auto_output_comp_v1_9_9'];return x};if(typeof od==='function')core.dl=function(obj,s){let x={...obj,output_compensation:{detected_latency_ms:+autoMs.toFixed(1),fine_adjust_ms:fineMs,total_applied_ms:+(autoMs+fineMs).toFixed(1),scope:'playback_only'}};x.notes=[...(x.notes||[]),'auto_output_comp_v1_9_9'];return od(x,s)};patched=true;return true}catch(_){return false}}
function calibrate(){core=deepest();if(!core){setTimeout(calibrate,150);return}installTone();let c=getCtx(core);if(!c){lat.textContent='esperando audio…';setTimeout(calibrate,200);return}try{if(c.state==='suspended'&&c.resume)c.resume().catch(()=>{})}catch(_){}let ms=1000*((c.baseLatency||0)+(c.outputLatency||0));if(ms>1&&ms<500){autoMs=ms;lat.textContent=ms.toFixed(1)+' ms';apply();return}lat.textContent='sin dato aún';setTimeout(calibrate,250)}
outer.addEventListener('load',()=>setTimeout(calibrate,600));setInterval(()=>{if(!core||autoMs<=1)calibrate()},500);
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.60 Offline Render mínimo</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input{font-size:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:6px 4px 6px 0}audio{width:100%}.muted{color:#666;font-size:14px}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.60 — Offline Render mínimo iPhone</h1><p class="muted">Añade una sola capa respecto de v1.9.59: renderiza 5 s del audio decodificado con OfflineAudioContext. Sin TIME y sin claqueta.</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><br><button id="native">1. Cargar nativo</button><audio id="p" controls></audio><p id="nativeState" class="muted">Sin fuente.</p><button id="decode">2. Decodificar</button><p id="decodeState" class="muted">Sin decodificar.</p><button id="render">3. Render offline 5 s</button><p id="renderState" class="muted">Sin render.</p><audio id="out" controls></audio><p id="outState" class="muted">Sin salida renderizada.</p></div></main><script>
var input=document.getElementById('f'),p=document.getElementById('p'),out=document.getElementById('out'),buf=null,srcUrl=null,outUrl=null;
function getFile(){var fs=input.files;if(!fs||fs.length<1)throw new Error('Sin archivo');return fs[0]}
document.getElementById('native').onclick=function(){try{var f=getFile();if(srcUrl)URL.revokeObjectURL(srcUrl);srcUrl=URL.createObjectURL(f);p.src=srcUrl;p.load();document.getElementById('nativeState').textContent='NATIVE READY · '+f.name}catch(e){document.getElementById('nativeState').textContent='ERROR · '+e.message}};
p.addEventListener('playing',function(){document.getElementById('nativeState').textContent='PLAYING OK · salida nativa audible'});
document.getElementById('decode').onclick=async function(){try{var f=getFile(),AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),ab=await f.arrayBuffer(),t=performance.now();buf=await ac.decodeAudioData(ab.slice(0));document.getElementById('decodeState').textContent='DECODE OK · '+buf.duration.toFixed(6)+' s · '+buf.sampleRate+' Hz · '+(performance.now()-t).toFixed(1)+' ms';try{await ac.close()}catch(_){}}catch(e){document.getElementById('decodeState').textContent='ERROR DECODE · '+e.name+' · '+e.message}};
function wav(b){var ch=b.numberOfChannels,n=b.length,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab),q=0;function s(x){for(var i=0;i<x.length;i++)v.setUint8(q++,x.charCodeAt(i))}function u32(x){v.setUint32(q,x,true);q+=4}function u16(x){v.setUint16(q,x,true);q+=2}s('RIFF');u32(36+n*ch*2);s('WAVEfmt ');u32(16);u16(1);u16(ch);u32(b.sampleRate);u32(b.sampleRate*ch*2);u16(ch*2);u16(16);s('data');u32(n*ch*2);for(var i=0;i<n;i++)for(var c=0;c<ch;c++){var x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(q,x<0?x*32768:x*32767,true);q+=2}return new Blob([ab],{type:'audio/wav'})}
document.getElementById('render').onclick=async function(){try{if(!buf)throw new Error('Primero pulsa Decodificar');var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OAC)throw new Error('OfflineAudioContext no disponible');var sr=48000,dur=Math.min(5,buf.duration),off=new OAC(2,Math.ceil(dur*sr),sr),src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start(0,0,dur);var t=performance.now(),mixed=await off.startRendering(),blob=wav(mixed);if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(blob);out.src=outUrl;out.load();document.getElementById('renderState').textContent='RENDER OK · '+(performance.now()-t).toFixed(1)+' ms · '+blob.size+' bytes';document.getElementById('outState').textContent='Render listo. Pulsa Play.'}catch(e){document.getElementById('renderState').textContent='ERROR RENDER · '+e.name+' · '+e.message}};
out.addEventListener('playing',function(){document.getElementById('outState').textContent='RENDER PLAYING OK · WAV nativo audible'});out.addEventListener('error',function(){var e=out.error;document.getElementById('outState').textContent='ERROR MEDIA · '+(e?e.code:'?')});
</script></body></html>

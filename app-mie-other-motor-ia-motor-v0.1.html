v(a,b){return(b-a+12)%12}async function decode(f){const AC=window.AudioContext||window.webkitAudioContext;ctx=ctx||new AC();if(ctx.state==='suspended')await ctx.resume();return await ctx.decodeAudioData((await f.arrayBuffer()).slice(0))}function mono(b){let y=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){let x=b.getChannelData(c);for(let i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}function rs(x,sr,to=22050){if(sr===to)return x;let n=Math.floor(x.length*to/sr),y=new Float32Array(n),r=sr/to;for(let i=0;i<n;i++){let p=i*r,j=Math.floor(p),f=p-j;y[i]=x[j]*(1-f)+x[Math.min(x.length-1,j+1)]*f}return y}function spec(x,sr,a,N){let z=[];for(let m=36;m<=84;m++){let f=hz(m),re=0,im=0,ws=0;for(let n=0;n<N;n+=2){let j=a+n;if(j>=x.length)break,w=.5-.5*Math.cos(2*Math.PI*n/(N-1)),v=x[j]*w,p=2*Math.PI*f*n/sr;re+=v*Math.cos(p);im-=v*Math.sin(p);ws+=w}z.push({m,e:Math.hypot(re,im)/Math.max(1,ws)})}return z}function aggregate(fs,a,b){let midi={},pc=Array(12).fill(0),n=0;for(let f of fs)if(f.t>=a&&f.t<b){for(let z of f.s){midi[z.m]=(midi[z.m]||0)+z.e;pc[z.m%12]+=z.e}n++}if(n){for(let m in midi)midi[m]/=n;for(let i=0;i<12;i++)pc[i]/=n}return{midi,pc}}function raw(ev){let mx=Math.max(...ev.pc),s=[...ev.pc].sort((a,b)=>a-b),med=s[6]||1e-9,a=[];for(let p=0;p<12;p++)if(ev.pc[p]>=Math.max(med*1.18,mx*.15)){let bins=Object.entries(ev.midi).filter(([m])=>(+m)%12===p).map(([m,e])=>({m:+m,e})).sort((x,y)=>y.e-x.e);a.push({pc:p,m:bins[0]?.m??60,rel:ev.pc[p]/(mx||1)})}return a.sort((x,y)=>y.rel-x.rel).slice(0,7)}function root(c){let top=c[0]?.rel||0,e=c.filter(x=>x.rel>=top*.42).sort((a,b)=>a.m-b.m);return e[0]?.pc??c[0]?.pc}function partial(c,all){let best=0;for(let b of all){if(b.pc===c.pc||b.rel<=c.rel)continue;let d=iv(b.pc,c.pc),f=d===7?.56:d===4?.33:d===10?.22:d===0?.9:0;best=Math.max(best,f*b.rel)}return best}function dialogue(c){let r=root(c),rows=c.map(q=>{let p=partial(q,c),resid=Math.max(0,q.rel-.58*p),prior=PRI[iv(r,q.pc)]??.15,action=resid>=.58?'KEEP_ACOUSTIC':resid>=.31&&prior>=.68?'KEEP_CONTEXT':resid>=.24?'QUERY_DROP':'DROP';return{...q,partial:p,residual:resid,prior,action}}),keep=rows.filter(x=>x.action.startsWith('KEEP'));if(keep.length<2)keep=[...rows].sort((a,b)=>b.residual-a.residual).slice(0,2);return{root:r,rows,keep:keep.slice(0,4)}}function wav(units,key,start,end){const SR=44100,N=Math.ceil((end-start)*SR),y=new Float32Array(N);function add(at,d,m,A){let i0=Math.max(0,Math.floor((at-start)*SR)),i1=Math.min(N,Math.floor((at-start+d)*SR)),f=hz(m);for(let i=i0;i<i1;i++){let t=(i-i0)/SR,en=(1-Math.exp(-t/.004))*(.62*Math.exp(-t/.8)+.28*Math.exp(-t/2.2)+.1*Math.exp(-t/5));y[i]+=A*en*(Math.sin(2*Math.PI*f*t)+.38*Math.sin(4*Math.PI*f*t)+.16*Math.sin(6*Math.PI*f*t))}}for(let u of units){let d=Math.max(.1,u.end-u.start-.02);for(let m of u[key])add(u.start,d,m,.05)}let mx=0;for(let v of y)mx=Math.max(mx,Math.abs(v));let g=.88/Math.max(mx,1e-9),ab=new ArrayBuffer(44+y.length*2),v=new DataView(ab),p=0,S=s=>{for(let c of s)v.setUint8(p++,c.charCodeAt(0))},U=n=>{v.setUint32(p,n,true);p+=4},H=n=>{v.setUint16(p,n,true);p+=2};S('RIFF');U(36+y.length*2);S('WAVEfmt ');U(16);H(1);H(1);U(SR);U(SR*2);H(2);H(16);S('data');U(y.length*2);for(let x of y){x=Math.max(-1,Math.min(1,x*g));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}$('go').onclick=async()=>{try{let f=$('f').files[0];if(!f)throw Error('Selecciona el stem Otro');$('go').disabled=true;$('st').textContent='Analizando…';let b=await decode(f),start=13.3,end=Math.min(40.7,b.duration),x=rs(mono(b),b.sampleRate),sr=22050,N=4096,hop=2048,fs=[],a0=Math.floor(start*sr),a1=Math.floor(end*sr),k=0,total=(a1-a0)/hop;for(let a=a0;a+N<a1;a+=hop,k++){fs.push({t:a/sr,s:spec(x,sr,a,N)});if(k%8===0){$('pr').value=Math.min(60,60*k/total);await new Promise(r=>setTimeout(r,0))}}let units=[];for(let i=0;i<T.length-1;i++){let a=Math.max(start,T[i]),z=Math.min(end,T[i+1]);if(z<=a)continue;let c=raw(aggregate(fs,a,z)),d=dialogue(c);units.push({tactus:i+15,start:a,end:z,A:c.slice(0,5).map(q=>q.m),B:d.keep.map(q=>q.m),root:PC[d.root],dialogue:d.rows.map(q=>({pc:PC[q.pc],midi:q.m,acoustic:+q.rel.toFixed(4),partial:+q.partial.toFixed(4),residual:+q.residual.toFixed(4),prior:+q.prior.toFixed(4),action:q.action}))})}$('a').src=URL.createObjectURL(wav(units,'A',start,end));$('b').src=URL.createObjectURL(wav(units,'B',start,end));$('a').load();$('b').load();res={schema:'MIE-OTHER-MOTOR-IA-MOTOR-v0.1-external',source:f.name,tactus:'Beat This v1.9.3',excluded:['bass','guitars','vocals','P30'],units};$('ex').disabled=false;$('pr').value=100;$('st').textContent='LISTO · compara A y B'}catch(e){$('st').textContent='ERROR · '+e.message}finally{$('go').disabled=false}};$('ex').onclick=()=>{if(!res)return;let b=new Blob([JSON.stringify(res,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MIE_OTHER_MOTOR_IA_MOTOR_v0_1.json';a.click()};</script></body></html>

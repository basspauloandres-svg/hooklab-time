<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.42 DIRECT vs PRE A/B</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:22px;margin:0 0 6px}.muted{font-size:13px;color:#666}input,button{font-size:16px}input{width:100%}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:4px}.secondary{background:#e7e7e4;color:#222}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.42 — DIRECT vs PRE A/B</h1><p class="muted">Prueba causal mínima. Un solo HTML, un solo AudioContext, un solo AudioBufferSourceNode activo. DIRECT: source→destination. PRE: source→GainNode(1.0)→destination. Nunca suenan ambas rutas simultáneamente.</p><input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg"><button id="decode" disabled>Preparar audio</button><span id="status" class="muted"> esperando audio</span></div><div class="card"><button id="direct" disabled>Play DIRECT</button><button id="pre" disabled>Play PRE</button><button id="stop" class="secondary" disabled>Stop</button><p id="rt" class="muted">runtime no iniciado</p></div><div class="card"><button id="export" class="secondary">Exportar diagnóstico A/B</button></div></main><script>
const $=x=>document.getElementById(x);let selectedFile=null,arrayBuffer=null,ctx=null,buf=null,src=null,preBus=null,activeRoute=null,records=[];
$('audioFile').onchange=e=>{selectedFile=e.target.files&&e.target.files[0];arrayBuffer=null;buf=null;$('decode').disabled=!selectedFile;$('status').textContent=selectedFile?' '+selectedFile.name+' · pulsa Preparar audio':' esperando audio'};
async function prepare(){if(!selectedFile)return;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();arrayBuffer=arrayBuffer||await selectedFile.arrayBuffer();buf=await ctx.decodeAudioData(arrayBuffer.slice(0));if(!preBus){preBus=ctx.createGain();preBus.gain.value=1;preBus.connect(ctx.destination)}$('direct').disabled=false;$('pre').disabled=false;$('stop').disabled=false;$('status').textContent=' audio preparado';$('rt').textContent=`AudioContext ${ctx.state} · buffer ${buf.duration.toFixed(3)} s · sampleRate ${ctx.sampleRate}`;records.push({kind:'prepared',duration_s:buf.duration,audio_context_state:ctx.state,sample_rate:ctx.sampleRate,baseLatency:ctx.baseLatency??null,outputLatency:ctx.outputLatency??null})}
$('decode').onclick=prepare;
function stop(){if(src)try{src.stop()}catch(_){}src=null;activeRoute=null;$('rt').textContent=`AudioContext ${ctx?ctx.state:'n/d'} · detenido`}
async function play(route){if(!buf)await prepare();if(ctx.state==='suspended')await ctx.resume();stop();src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=1;if(route==='DIRECT')src.connect(ctx.destination);else src.connect(preBus);let at=ctx.currentTime+.05;src.start(at,0);activeRoute=route;src.onended=()=>{if(src){src=null;activeRoute=null}};$('rt').textContent=`${route} · AudioContext ${ctx.state} · start ${at.toFixed(3)} s`;records.push({kind:'start',route,ctx_state:ctx.state,ctx_start_s:at,pre_gain:route==='PRE'?preBus.gain.value:null})}
$('direct').onclick=()=>play('DIRECT');$('pre').onclick=()=>play('PRE');$('stop').onclick=stop;
$('export').onclick=()=>{let payload={schema:'HookLab-TIME-v1.9.42-direct-vs-prefader-ab',build_id:'v1.9.42-direct-vs-prefader-ab',architecture:{runtime_count:1,audio_context_count:ctx?1:0,active_source_count_design:1,simultaneous_routes:false,direct_route:'source>destination',pre_route:'source>GainNode(1)>destination',iframe_count:0},file:selectedFile&&selectedFile.name,buffer_duration_s:buf&&buf.duration,records};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HookLab_direct_vs_prefader_AB_v1_9_42.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>

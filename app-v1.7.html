<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HookLab TIME v1.7</title><style>html,body{margin:0;height:100%;background:#f2f2f0}iframe{display:block;border:0;width:100%;height:100vh}</style></head><body><iframe id="app" src="app-v1.6.html?v=1701" allow="autoplay"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{const w=f.contentWindow,d=w.document;d.title='HookLab TIME v1.7';const h=d.querySelector('h1');if(h)h.textContent='HookLab TIME Mobile — Beat This! v1.7';const p=d.querySelector('.card .muted');if(p)p.textContent='Fallback con transferencia de autoridad: los onsets de audio no pueden sustituir a Beat This mientras el reloj principal siga estable. Tras una ruptura confirmada, el nuevo run conserva T de forma provisional antes de permitir 2T/3T.';
const oldSummary=w.summary,oldDl=w.dl;
w.predictiveTrack=function(strong,onsets,states,dur){let out=[],runs=0,transitions=[],cursor=0,safety=0,fallbackArmed=false;while(cursor<dur-1&&safety++<140){let acq=w.acquireAfter(strong,cursor,.72),source='beat_this';if(!acq&&fallbackArmed){acq=w.acquireAfter(onsets,cursor,.62);source='audio_onset'}if(!acq)break;if(source==='beat_this')fallbackArmed=false;let rid=++runs,last=acq.event.t,period=acq.period,miss=0;out.push({t:last,run:rid,observed:true,source});cursor=last+.01;while(last+period<dur){let pred=last+period,st=w.stateAt(pred,states),tol=Math.min(.16,Math.max(.07,period*.24)),best=null,bSource='beat_this';for(const x of strong){if(x.t<pred-tol)continue;if(x.t>pred+tol)break;let dd=Math.abs(x.t-pred);if(!best||dd<Math.abs(best.t-pred))best=x}if(!best&&(fallbackArmed||miss>=2||st==='TEMPO_TRANSITION'||st==='FREE_TIME')){for(const x of onsets){if(x.t<pred-tol)continue;if(x.t>pred+tol)break;let dd=Math.abs(x.t-pred);if(!best||dd<Math.abs(best.t-pred)){best=x;bSource='audio_onset'}}}if(best){let err=best.t-pred;last=pred+.22*err;period=Math.max(.22,Math.min(1.6,period+.05*err));out.push({t:last,run:rid,observed:true,source:bSource});miss=0}else{last=pred;out.push({t:last,run:rid,observed:false,source:'inferred'});miss++}if(st==='NO_PULSE'){cursor=last+.2;fallbackArmed=false;break}
let primaryBroken=(st!=='PULSE_STABLE'&&miss>=2)||miss>=3;if(primaryBroken){let alt=w.acquireAfter(onsets,last+.02,.58);if(alt){let ratio=Math.max(period,alt.period)/Math.min(period,alt.period);transitions.push({at_s:+last.toFixed(3),from_run:rid,from_bpm:+(60/period).toFixed(3),candidate_bpm:+(60/alt.period).toFixed(3),candidate_score:+alt.score.toFixed(4),source:'audio_onset',authority_transfer:true,ratio:+ratio.toFixed(3)});fallbackArmed=true;cursor=Math.max(last+.03,alt.event.t-.15);break}}
if(st==='FREE_TIME'&&miss>=2){fallbackArmed=true;cursor=last+.2;break}if(miss>=4){fallbackArmed=true;cursor=last+.2;break}cursor=last+.01}}return{track:out,runs,transitions}};
w.resolveTactus=function(track,evidence){let groups=new Map();for(const x of track){if(!groups.has(x.run))groups.set(x.run,[]);groups.get(x.run).push(x)}let tact=[],choices=[];for(const [id,xs] of groups){if(xs.length<4)continue;let ints=[];for(let i=1;i<xs.length;i++)ints.push(xs[i].t-xs[i-1].t);let p=w.median(ints);if(!p)continue;let base=60/p,cands=[];for(const factor of[1,2,3])for(let ph=0;ph<factor;ph++){let sel=[],omit=[];for(let i=0;i<xs.length;i++){let v=.82*w.nearStrength(xs[i].t,evidence,.18)+.18*(xs[i].observed?1:.35);(i%factor===ph?sel:omit).push(v)}let a=w.mean(sel),b=w.mean(omit),contrast=factor===1?0:a-b,score=.68*a+.18*Math.min(1,sel.length/6)+.14*Math.max(-.5,Math.min(.5,contrast));cands.push({factor,phase:ph,bpm:base/factor,score,contrast})}let tBest=cands.filter(c=>c.factor===1).sort((a,b)=>b.score-a.score)[0],two=cands.filter(c=>c.factor===2).sort((a,b)=>b.score-a.score)[0],three=cands.filter(c=>c.factor===3).sort((a,b)=>b.score-a.score)[0],pick=tBest,decision='T_baseline';let fallbackRun=xs.some(x=>x.source==='audio_onset');let provisional=xs.length<12||(fallbackRun&&xs.length<16);if(provisional){pick=tBest;decision=fallbackRun?'T_provisional_fallback':'T_provisional_short_run'}else{if(two&&two.score>=tBest.score+.075&&two.contrast>=.055){pick=two;decision='2T_evidence_advantage'}if(three&&three.score>=pick.score+.10&&three.contrast>=.07){pick=three;decision='3T_evidence_advantage'}}for(let i=pick.phase;i<xs.length;i+=pick.factor)tact.push({t:xs[i].t,run:id});choices.push({run:id,base_bpm:+base.toFixed(3),selected_level:pick.factor===1?'T':pick.factor===2?'2T':'3T',selected_bpm:+pick.bpm.toFixed(3),decision,selected_score:+pick.score.toFixed(4),tactus_beats:Math.ceil((xs.length-pick.phase)/pick.factor),fallback_run:fallbackRun,provisional_lock:provisional})}tact.sort((a,b)=>a.t-b.t);let ii=[];for(let i=1;i<tact.length;i++)if(tact[i].run===tact[i-1].run)ii.push(tact[i].t-tact[i-1].t);let med=w.median(ii);return{tactus:tact,estimated_bpm:med?+(60/ w.summary=function(obj){let x=oldSummary(obj);x.schema='HookLab-Mobile-BeatThis-v1.7';x.engine='Beat This small pretrained ONNX + authority-gated audio-onset fallback + provisional T reacquisition';x.notes=[...(x.notes||[]),'fallback_authority_gate','fallback_only_after_confirmed_primary_break','provisional_T_on_short_or_fallback_runs','no_early_2T_3T_after_reacquisition'];return x};

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>HookLab TIME v1.9 MIXER</title><style>html,body{margin:0;height:100%;background:#f2f2f0;font-family:-apple-system,BlinkMacSystemFont,system-ui}.mix{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #ddd;padding:10px 12px;box-shadow:0 2px 10px #0001}.mix b{display:block;margin-bottom:6px}.row{display:grid;grid-template-columns:72px 1fr 46px;gap:8px;align-items:center;margin:7px 0}.row input{width:100%}.v{font-variant-numeric:tabular-nums;text-align:right;color:#555}iframe{display:block;border:0;width:100%;height:calc(100vh - 142px)}</style></head><body><div class="mix"><b>v1.9 PRETEST · Mezclador de escucha</b><div class="row"><label>Pista</label><input id="track" type="range" min="0" max="100" value="35"><span id="trackV" class="v">35%</span></div><div class="row"><label>Beat</label><input id="beat" type="range" min="0" max="100" value="85"><span id="beatV" class="v">85%</span></div><div class="row"><label>Acento</label><input id="accent" type="range" min="0" max="100" value="70"><span id="accentV" class="v">70%</span></div></div><iframe id="app" src="app-v1.9-direct.html?build=20260820-mixer1" allow="autoplay"></iframe><script>
const f=document.getElementById('app'),$=x=>document.getElementById(x);let beatMaster=null,accentMaster=null,installed=false;

function install(){if(installed)return;let w=f.contentWindow,d=w.document;let p=d.getElementById('player');if(p)p.volume=.35;try{let AC=w.AudioContext||w.webkitAudioContext;if(!AC)return;let proto=AC.prototype,oldCreate=proto.createOscillator;if(!oldCreate.__hooklabMixer){proto.createOscillator=function(){let o=oldCreate.apply(this,arguments),oldConnect=o.connect.bind(o);o.connect=function(dest,...rest){try{if(dest&&typeof dest==='object')dest.__hooklabFreq=o.frequency.value}catch(_){ }return oldConnect(dest,...rest)};return o};proto.createOscillator.__hooklabMixer=true}
let G=w.GainNode&&w.GainNode.prototype;if(G&&!G.__hooklabMixer){let old=G.connect;G.connect=function(dest,...rest){try{if(dest instanceof w.AudioDestinationNode&&this.__hooklabFreq){let ctx=this.context;if(!beatMaster||beatMaster.context!==ctx){beatMaster=ctx.createGain();accentMaster=ctx.createGain();beatMaster.gain.value=.85;accentMaster.gain.value=.70;old.call(beatMaster,dest);old.call(accentMaster,dest)}let master=this.__hooklabFreq>=1800?accentMaster:beatMaster;return old.call(this,master,...rest)}}catch(_){ }return old.call(this,dest,...rest)};G.__hooklabMixer=true}installed=true}catch(e){console.warn('mixer hook',e)}}

ui('track',v=>{try{let p=f.contentWindow.document.getElementById('player');if(p)p.volume=v}catch(_){}});ui('beat',v=>{if(beatMaster)beatMaster.gain.value=v});ui('accent',v=>{if(accentMaster)accentMaster.gain.value=v});

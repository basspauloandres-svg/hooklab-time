<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.63 Auto Acquisition Analysis Only</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;margin:0;background:#f2f2f0;color:#171717}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}button,input{font-size:16px}button{padding:11px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin:6px 4px 6px 0}.muted{color:#666;font-size:14px}.metric{font-size:20px;font-weight:700;margin:8px 0}pre{white-space:pre-wrap;background:#f5f5f3;padding:12px;border-radius:10px}</style></head><body><main><div class="card"><h1>HookLab TIME v1.9.63 — Adquisición automática · análisis aislado</h1><p class="muted">Sin render, sin claqueta y sin reproducción. Decodifica, extrae ataques y estima periodo/fase inicial desde los primeros 12 s.</p><input id="f" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><br><button id="decode">1. Decodificar + ataques</button><p id="d" class="muted">Esperando.</p><button id="acq">2. Calcular adquisición automática</button><div class="metric" id="bpm">BPM inicial: —</div><div class="metric" id="anchor">Ancla: —</div><div class="metric" id="score">Score: —</div><pre id="detail">Sin resultado.</pre></div></main><script>
var input=document.getElementById('f'),buf=null,onsets=[];
function median(a){if(!a.length)return null;var z=a.slice().sort(function(x,y){return x-y}),m=z.length>>1;return z.length%2?z[m]:(z[m-1]+z[m])/2}
function mono(b){var y=new Float32Array(b.length);for(var c=0;c<b.numberOfChannels;c++){var x=b.getChannelData(c);for(var i=0;i<y.length;i++)y[i]+=x[i]/b.numberOfChannels}return y}
function onsetTimes(b,dur){var x=mono(b),sr=b.sampleRate,hop=Math.max(1,Math.round(sr*.005)),win=Math.max(16,Math.round(sr*.03)),env=[];for(var a=0;a+win<x.length&&a/sr<dur;a+=hop){var d=0,prev=x[a];for(var i=a+1;i<a+win;i+=2){var v=x[i];d+=Math.abs(v-prev);prev=v}env.push(d)}var med=median(env)||1,out=[];for(var k=2;k<env.length-2;k++){var local=[];for(var j=Math.max(0,k-20);j<=Math.min(env.length-1,k+20);j++)local.push(env[j]);var lm=median(local)||med,thr=lm*1.35+med*.08;if(env[k]>thr&&env[k]>=env[k-1]&&env[k]>env[k+1])out.push({t:k*hop/sr,s:Math.min(2,env[k]/Math.max(thr,1e-9))})}return out}
function acquire(os){var xs=os.filter(function(o){return o.t>=.2&&o.t<=12});if(xs.length<6)throw new Error('Ataques insuficientes: '+xs.length);var best={score:-1,p:.5,a:.5,hits:0};for(var p=.34;p<=.75;p+=.002){var seeds=xs.slice(0,Math.min(24,xs.length));for(var si=0;si<seeds.length;si++){var a=seeds[si].t,s=0,w=0,h=0;for(var oi=0;oi<xs.length;oi++){var o=xs[oi],kk=Math.round((o.t-a)/p),pred=a+kk*p,dd=Math.abs(o.t-pred),tol=Math.min(.09,p*.18);if(dd<=tol){var q=1-dd/tol;s+=o.s*q;h++}w+=o.s}var sc=.72*(s/Math.max(.001,w))+.28*Math.min(1,h/16);if(sc>best.score)best={score:sc,p:p,a:a,hits:h}}}while(best.a-best.p>.15)best.a-=best.p;while(best.a<.15)best.a+=best.p;return best}
document.getElementById('decode').onclick=async function(){try{var fs=input.files;if(!fs||!fs.length)throw new Error('Sin archivo');var f=fs[0],AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),ab=await f.arrayBuffer(),t=performance.now();buf=await ac.decodeAudioData(ab.slice(0));onsets=onsetTimes(buf,30);document.getElementById('d').textContent='OK · '+onsets.length+' ataques en 30 s · '+(performance.now()-t).toFixed(1)+' ms total';try{await ac.close()}catch(_){}}catch(e){document.getElementById('d').textContent='ERROR · '+e.name+' · '+e.message}};
document.getElementById('acq').onclick=function(){try{if(!onsets.length)throw new Error('Primero calcula ataques');var t=performance.now(),r=acquire(onsets),ms=performance.now()-t,bpm=60/r.p;document.getElementById('bpm').textContent='BPM inicial: '+bpm.toFixed(3);document.getElementById('anchor').textContent='Ancla: '+r.a.toFixed(3)+' s';document.getElementById('score').textContent='Score: '+r.score.toFixed(4);document.getElementById('detail').textContent='period_s = '+r.p.toFixed(6)+'\nhits = '+r.hits+'\nacquire_ms = '+ms.toFixed(1)+'\nonsets_0_12s = '+onsets.filter(function(o){return o.t>=.2&&o.t<=12}).length}catch(e){document.getElementById('detail').textContent='ERROR ACQ · '+e.name+' · '+e.message}};
</script></body></html>

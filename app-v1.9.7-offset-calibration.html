<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HookLab TIME v1.9.7 OFFSET</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f2f2f0}.bar{position:sticky;top:0;z-index:999999;background:#fff;padding:10px 12px;border-bottom:1px solid #ddd}.bar b{display:block}.row{display:grid;grid-template-columns:100px 1fr 72px;gap:8px;align-items:center;margin-top:8px}.row input{width:100%}.hint{font-size:12px;color:#666;margin-top:6px}iframe{border:0;width:100%;height:calc(100vh - 112px);display:block}</style></head><body><div class="bar"><b>v1.9.7 PRETEST · calibración de offset de claqueta</b><div class="row"><label>Offset beat</label><input id="off" type="range" min="-220" max="220" step="5" value="-115"><span id="val">−115 ms</span></div><div class="hint">Negativo = adelanta la claqueta. Empieza en −115 ms por la latencia WebAudio observada; ajústalo de oído sin modificar el análisis.</div></div><iframe id="outer" src="app-v1.9.6-latency-audit-exportfix.html?build=20260820-1977" allow="autoplay"></iframe><script>
const outer=document.getElementById('outer'),slider=document.getElementById('off'),val=document.getElementById('val');let offset=-.115,done=false;
slider.oninput=()=>{offset=(+slider.value)/1000;val.textContent=(+slider.value<0?'−':'+')+Math.abs(+slider.value)+' ms';let c=deep();if(c)c.__hlPlaybackOffset=offset};
function deep(){try{let a=outer.contentWindow,i=a.document.getElementById('outer')||a.document.getElementById('app');if(!i)return null;let b=i.contentWindow;for(let k=0;k<5;k++){let q=b.document.getElementById('app')||b.document.getElementById('outer');if(!q||!q.contentWindow)break;b=q.contentWindow}return b}catch(_){return null}}
function patch(){let c=deep();if(!c)return setTimeout(patch,150);c.__hlPlaybackOffset=offset;if(done)return;try{c.eval(`(function(){if(window.__hlOffsetInstalled)return;window.__hlOffsetInstalled=true;let oldTone=tone;tone=function(at,f,v,d){let o=window.__hlPlaybackOffset||0;return oldTone(Math.max(ctx.currentTime+.002,at+o),f,v,d)};})();`);let os=c.summary,od=c.dl;c.summary=function(obj){let x=os(obj);x.playback_offset_ms=Math.round((c.__hlPlaybackOffset||0)*1000);x.notes=[...(x.notes||[]),'playback_offset_calibration_v1_9_7'];return x};c.dl=function(obj,s){let x={...obj,playback_offset_ms:Math.round((c.__hlPlaybackOffset||0)*1000)};x.notes=[...(x.notes||[]),'playback_offset_calibration_v1_9_7'];return od(x,s)};done=true}catch(e){setTimeout(patch,150)}}
outer.addEventListener('load',()=>setTimeout(patch,800));setTimeout(patch,1600);
</script></body></html>
